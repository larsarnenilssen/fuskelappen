# Midlertidig (fase 4): henter Vestlands sider om tilrettelegging og språkopplæring og skriver teksten til loggen,
# fordi utviklingsmiljøet ikke når vestlandfylke.no. Ingenting lagres i repoet. Fjernes før PR-en flettes.
name: Hent Vestland (midlertidig)

on:
  push:
    branches: [claude/fuskelappen-fase-4-wh9y2g]
    paths: [.github/workflows/hent-vestland-midlertidig.yml]

permissions:
  contents: read

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent sidene
        run: |
          pip install --quiet beautifulsoup4
          cat > les.py <<'PY'
          import sys, urllib.request
          from bs4 import BeautifulSoup
          for url in sys.argv[1:]:
              print('\n=====', url)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (fuskelappen kildesjekk)'})
                  html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
              except Exception as e:
                  print('FEIL', e); continue
              s = BeautifulSoup(html, 'html.parser')
              hoved = s.find('main') or s.body
              for t in hoved.find_all(['script', 'style', 'nav']): t.decompose()
              for el in hoved.find_all(['h1', 'h2', 'h3', 'h4', 'p', 'li', 'a']):
                  tekst = ' '.join(el.get_text(' ', strip=True).split())
                  if not tekst: continue
                  if el.name == 'a':
                      href = el.get('href', '')
                      if href.startswith('/') or 'vestlandfylke' in href: print(f'  [lenke] {tekst} -> {href}')
                  else:
                      print(f'{el.name}: {tekst}')
          PY
          B=https://www.vestlandfylke.no/utdanning-og-karriere
          python3 les.py \
            $B/tilrettelegging-ved-laringsutfordringar/ \
            $B/fremhevde-sider/minoritetsspraklege/ \
            $B/fremhevde-sider/minoritetsspraklege/innforingskurs/ \
            $B/elev/privatskular/
