# Publiserer testversjonen (avgjørelse 045). En push til grenen «test» starter «Publiser» fra main, som bygger den
# siste versjonen av appen og testversjonen fra grenen under test/. Appen selv endres ikke.
#
# Ta ned (avgjørelse 095): «Publiser» starter denne med ta_ned når en versjon er publisert uten testversjonen.
# Da slettes grenen test, så senere publiseringer ikke tar testversjonen med igjen. Den kan også kjøres for hånd.
name: Testversjon

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      ta_ned:
        description: 'Slett grenen test (testversjonen er tatt ned, eller tas ned ved neste publisering).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  publiser:
    name: Start publisering med testversjon
    if: ${{ !inputs.ta_ned }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  ta-ned:
    name: Slett grenen test
    if: ${{ inputs.ta_ned }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/test" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/test"
            echo "::notice::Grenen test er slettet. Testversjonen er tatt ned."
          else
            echo "Ingen gren som heter test."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
