# Publiserer en versjon til GitHub Pages.
#
# - Når en versjonstag (vX.Y.Z) pushes, startes publiseringen av den taggen.
# - Manuelt (Actions → Publiser → Run workflow): skriv en tag for å publisere eller rulle tilbake
#   til en bestemt versjon. Tomt felt publiserer siste versjon.
# - Kildesjekken kaller denne arbeidsflyten hver uke, slik at kildestatusen på Pages er fersk.
# - «Sett versjonstag» kaller den med den nye taggen. I en kalt arbeidsflyt er github.event_name den kallende
#   arbeidsflytens hendelse (push til main), så videresendingen må også sjekke at det er en tag som er pushet.
#
# Koden bygges alltid fra taggen. Kildestatusen og registerdataene (Grep og skoleregisteret) hentes fra main,
# slik at de oppdateres hver uke (avgjørelse 018). Det samme gjelder resultatene fra Elevundersøkelsen, så et nytt
# skoleår kommer med uten ny versjon (avgjørelse 077). Består ikke taggens tester med dataene fra main, brukes
# taggens egne data.
# Selve publiseringen kjører fra main, fordi GitHub Pages som standard bare tillater publisering derfra.
#
# Adressen (avgjørelse 065): Bygget legges under stien GitHub Pages oppgir, så appen følger domenet som er satt under
# Settings → Pages. Endres domenet, må appen publiseres på nytt (Actions → Publiser → Run workflow).
#
# Testversjonen (avgjørelse 045): Finnes grenen «test», bygges den også, og legges under test/ ved siden av appen.
# Arbeidsflyten «Testversjon» starter publiseringen når noen pusher til grenen. Feiler bygget av testversjonen,
# publiseres appen likevel, uten testversjon. Slett grenen og publiser på nytt for å fjerne testversjonen.
name: Publiser

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versjon som skal publiseres, f.eks. v0.1.0. La stå tomt for siste versjon.'
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ''

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  videresend:
    name: Start publisering fra main
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  bygg:
    name: Bygg
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      tag: ${{ steps.versjon.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      # Stien appen skal ligge under, fra innstillingene for GitHub Pages: tom med eget domene (jukselappen.no),
      # /jukselappen på github.io. Bygget leser den fra PAGES_BASE (avgjørelse 065).
      - name: Finn adressen i innstillingene for GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Sjekk adressen
        env:
          VERT: ${{ steps.pages.outputs.host }}
          STI: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "Appen publiseres på https://$VERT$STI/"
          case "$VERT" in
            *.github.io) [ -n "$STI" ] || { echo "::error::GitHub Pages oppga ingen sti for $VERT."; exit 1; } ;;
          esac
      - name: Finn versjon
        id: versjon
        env:
          ONSKET: ${{ inputs.tag }}
        run: |
          if [ -n "$ONSKET" ]; then
            TAG="$ONSKET"
          else
            TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          fi
          if [ -z "$TAG" ]; then
            echo "::notice::Ingen versjon er publisert ennå. Hopper over."
          elif ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Fant ikke versjonen $TAG."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Hent koden for versjonen, med fersk kildestatus og registerdata fra main
        if: steps.versjon.outputs.tag != ''
        env:
          TAG: ${{ steps.versjon.outputs.tag }}
        run: |
          cp data/status/kildestatus.json "$RUNNER_TEMP/kildestatus.json"
          mkdir -p "$RUNNER_TEMP/data"
          cp -r data/grep data/skoler data/elevundersokelsen "$RUNNER_TEMP/data/"
          git checkout --quiet "$TAG"
          cp "$RUNNER_TEMP/kildestatus.json" data/status/kildestatus.json
          cp -r "$RUNNER_TEMP/data/grep" "$RUNNER_TEMP/data/skoler" "$RUNNER_TEMP/data/elevundersokelsen" data/
          VERSJON=$(node -p "require('./package.json').version")
          if [ "v$VERSJON" != "$TAG" ]; then
            echo "::error::package.json har versjon $VERSJON, men taggen er $TAG."
            exit 1
          fi
      - uses: actions/setup-node@v5
        if: steps.versjon.outputs.tag != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.versjon.outputs.tag != ''
        run: npm ci
      - name: Sjekk registerdataene fra main mot versjonens tester
        if: steps.versjon.outputs.tag != ''
        env:
          TAG: ${{ steps.versjon.outputs.tag }}
        run: |
          if git diff --quiet "$TAG" -- data/grep data/skoler data/elevundersokelsen && [ -z "$(git status --porcelain -- data/elevundersokelsen)" ]; then
            echo "Registerdataene er de samme som i $TAG."
          elif npx vitest run; then
            echo "Registerdataene fra main består testene i $TAG."
          else
            echo "::warning::Registerdataene fra main består ikke testene i $TAG. Bruker registerdataene i $TAG."
            git checkout "$TAG" -- data/grep data/skoler
            # Eldre versjoner har ikke Elevundersøkelsen. Da fjernes dataene fra main.
            git checkout "$TAG" -- data/elevundersokelsen 2>/dev/null || rm -rf data/elevundersokelsen
          fi
      - if: steps.versjon.outputs.tag != ''
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Bygg testversjonen fra grenen test, hvis den finnes
        if: steps.versjon.outputs.tag != ''
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if ! git fetch --quiet origin test 2>/dev/null; then
            echo "Ingen gren som heter test. Publiserer uten testversjon."
            exit 0
          fi
          COMMIT=$(git rev-parse --short FETCH_HEAD)
          git worktree add --quiet --detach "$RUNNER_TEMP/test" FETCH_HEAD
          if (cd "$RUNNER_TEMP/test" && npm ci && npm run build:test); then
            cp -r "$RUNNER_TEMP/test/dist-test" dist/test
            echo "::notice::Testversjonen fra $COMMIT ligger under test/."
          else
            echo "::warning::Testversjonen fra $COMMIT kunne ikke bygges. Publiserer uten testversjon."
          fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.versjon.outputs.tag != ''
        with:
          path: dist

  publiser:
    name: Publiser til GitHub Pages
    needs: bygg
    if: needs.bygg.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
