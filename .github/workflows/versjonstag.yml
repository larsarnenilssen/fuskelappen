# Setter versjonstaggen og publiserer (avgjørelse 029).
#
# - Når versjonsnummeret i package.json endres på main, lages taggen vX.Y.Z på main, og publiseringen startes.
#   Versjonsnummeret økes bare når eier og Claude er enige om en ny versjon (AGENTS.md).
# - Manuelt (Actions → Sett versjonstag → Run workflow): lager taggen for versjonen i package.json hvis den
#   mangler, og publiserer.
# - Hver tag nyere enn siste utgivelse får en utgivelse under Releases, med teksten fra CHANGELOG.md. Mangler noen,
#   lages de i versjonsrekkefølge, og den nyeste merkes som siste.
# Taggen settes her fordi Claudes arbeidsmiljø ikke kan pushe tagger. En tag pushet med GITHUB_TOKEN starter ikke
# andre arbeidsflyter, så publiseringen kalles direkte.
name: Sett versjonstag

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/versjonstag.yml
  workflow_dispatch:

concurrency:
  group: versjonstag
  cancel-in-progress: false

jobs:
  tag:
    name: Sett versjonstag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ny: ${{ steps.tag.outputs.ny }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Lag taggen hvis den mangler
        id: tag
        run: |
          VERSJON=$(node -p "require('./package.json').version")
          TAG="v$VERSJON"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ugyldig versjon i package.json: $VERSJON"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Taggen $TAG finnes allerede."
            echo "ny=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Versjon $VERSJON"
            git push origin "$TAG"
            echo "::notice::Satte taggen $TAG på $(git rev-parse --short HEAD)."
            echo "ny=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publiser:
    name: Publiser
    needs: tag
    if: needs.tag.outputs.ny == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write

  utgivelse:
    name: Lag utgivelse
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Lag utgivelser for tagger som mangler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SISTE=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          git tag --list 'v*.*.*' --sort=v:refname > "$RUNNER_TEMP/tagger"
          NYESTE=$(tail -n 1 "$RUNNER_TEMP/tagger")
          while read -r TAG; do
            if [ -n "$SISTE" ] && [ "$(printf '%s\n%s\n' "$SISTE" "$TAG" | sort -V | tail -n 1)" = "$SISTE" ]; then
              continue
            fi
            if gh release view "$TAG" </dev/null >/dev/null 2>&1; then
              continue
            fi
            VERSJON="${TAG#v}"
            # Avsnittet for versjonen i CHANGELOG.md, uten overskriften.
            awk -v v="$VERSJON" '
              index($0, "## [" v "]") == 1 { med = 1; next }
              med && /^## \[/ { exit }
              med { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notat.md"
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notat.md"; then
              echo "Versjon $VERSJON." > "$RUNNER_TEMP/notat.md"
            fi
            if [ "$TAG" = "$NYESTE" ]; then SIST=true; else SIST=false; fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notat.md" --latest="$SIST" </dev/null
            echo "::notice::Laget utgivelsen $TAG."
          done < "$RUNNER_TEMP/tagger"
