# Midlertidig (fase 3, avgjørelse 039): første ekte henting av lov- og forskriftstekst fra Lovdata, på grenen for
# Lov og forskrift. Utviklingsmiljøet når ikke Lovdata. Hentingen lagres på grenen, så den kan kontrolleres før
# modulen publiseres. Etter fletting hentes teksten hver uke av kildesjekken (kilder.yml). Fjernes før fletting.
name: Hent lovtekst (gren)

on:
  push:
    branches: ['claude/fase-3-lov-og-forskrift']
    paths:
      - scripts/lovdata/**
      - scripts/hent-lovdata.ts
      - content/lovverk.yaml
      - content/kilder.yaml
      - .github/workflows/lovdata-gren.yml

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # --alle henter også de lokale forskriftene (to sider hos Lovdata).
      - run: npm run hent:lovdata -- --alle
      - name: Endringer
        if: always()
        run: cat .generert/lovdata-endringer.json || true
      - name: Lagre teksten på grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lovdata
          git commit -m "Lovtekst fra Lovdata $(date -u +%F)" || echo "Ingen endring."
          git push
