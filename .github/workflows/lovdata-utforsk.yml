# Midlertidig (fase 3): kartlegger Lovdatas datasett fra Actions og lagrer utdrag på grenen.
# Utviklingsmiljøet når ikke Lovdata. Fjernes når leseren for Lov og forskrift er på plass.
name: Utforsk Lovdata

on:
  push:
    branches: ['claude/fase-3-lov-og-forskrift']
    paths:
      - scripts/lovdata/utforsk.ts
      - .github/workflows/lovdata-utforsk.yml

permissions:
  contents: write

jobs:
  utforsk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/lovdata/utforsk.ts
      # Artefakter kan ikke lastes ned fra utviklingsmiljøet. Dokumentene legges derfor på en egen gren uten historikk,
      # som slettes når leseren er på plass.
      - name: Legg dokumentene på grenen claude/lovdata-utforsk-data
        run: |
          cd .generert/lovdata-utforsk
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Utdrag fra Lovdata (midlertidig)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:claude/lovdata-utforsk-data
