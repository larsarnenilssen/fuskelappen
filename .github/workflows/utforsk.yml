# Midlertidig (05.10.2026): kjører hentingen av lokale forskrifter fra grenen claude/fylkene og legger resultatet på
# grenen utforsk-data, så det kan leses i utviklingsmiljøet, som Lovdata stenger. Slettes når fylkesarbeidet er bygget.
name: Utforsk
on:
  push:
    branches: [utforsk/lovdata]
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/fylkene
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: LOVDATA_SIDER=ut/sider npm run hent:lovdata -- --alle || echo "hent:lovdata feilet" > hent-feilet.txt
      - if: always()
        run: |
          mkdir -p ut ut/sider
          cp -r data/lovdata ut/ || true
          cp .generert/lovdata-endringer.json ut/ || true
          cp hent-feilet.txt ut/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(cd ut && git add -f . >/dev/null 2>&1; true)
          export GIT_INDEX_FILE=$(mktemp -u)
          (cd ut && find . -type f | sed 's#^\./##' | while read f; do git update-index --add --cacheinfo 100644,$(git hash-object -w "$f"),"$f"; done)
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Utforsk $(date -u +%F)")
          git push --force origin "$commit:refs/heads/utforsk-data"
