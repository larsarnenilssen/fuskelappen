# Midlertidig (05.10.2026): undersøker Norsk Lovtidend avdeling II. Sjekker at hver lokale forskrift i registeret
# (lokale.json fra forrige kjøring på grenen utforsk-data) også er kunngjort i Lovtidend, og henter eksempelsider.
# Resultatet legges på grenen utforsk-lovtidend. Slettes når fylkesarbeidet er bygget.
name: Utforsk
on:
  push:
    branches: [utforsk/lovdata]
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p ut
          ua='Jukselappen-kildesjekk/0.1 (+https://github.com/larsarnenilssen/jukselappen)'
          hent() { curl -sSL -A "$ua" --max-time 60 -o "ut/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> ut/logg.txt || echo "$1 feilet" >> ut/logg.txt; sleep 1; }
          hent lovtidend-0.html 'https://lovdata.no/register/lovtidend'
          hent lovtidend-20.html 'https://lovdata.no/register/lovtidend?offset=20'
          hent lovtidend-avd2.html 'https://lovdata.no/register/lovtidend?avdeling=avdeling2'
          hent ltii-oppheving.html 'https://lovdata.no/dokument/LTII/forskrift/2026-09-29-1985'
          hent ltii-endring.html 'https://lovdata.no/dokument/LTII/forskrift/2026-06-10-1971'
          hent ltii-ikraft.html 'https://lovdata.no/dokument/LTII/forskrift/2026-09-03-1972'
          hent ltii-ny.html 'https://lovdata.no/dokument/LTII/forskrift/2026-10-01-1986'
          for ts in '02.10.2026 kl. 15.00' '30.09.2026 kl. 14.25' '29.09.2026 kl. 15.45' '01.10.2026 kl. 14.30'; do
            q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$ts")
            n=$(echo "$ts" | tr -cd '0-9')
            hent "lt-$n.html" "https://lovdata.no/register/lovtidend?avdeling=LTII&kunngjortDato=$q"
            hent "lt-$n-20.html" "https://lovdata.no/register/lovtidend?avdeling=LTII&kunngjortDato=$q&offset=20"
          done
          hent lt-avd2-20.html 'https://lovdata.no/register/lovtidend?avdeling=LTII&offset=20'
          hent lt-avd2.html 'https://lovdata.no/register/lovtidend?avdeling=LTII'
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE=$(mktemp -u)
          (cd ut && for f in *; do git update-index --add --cacheinfo 100644,$(git hash-object -w "$f"),"$f"; done)
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Utforsk Lovtidend $(date -u +%F)")
          git push --force origin "$commit:refs/heads/utforsk-lovtidend"
