# Midlertidig (05.10.2026, siste henting): prøver hentingen av lokale forskrifter fra grenen claude/fylkene i tre runder: hele
# registeret, så Lovtidend avdeling II siden 1. juni 2026, så siden 1. desember 2025 (årsskiftet, med registeret for
# årene i tillegg). Resultatet legges på grenen utforsk-data. Slettes når fylkesarbeidet er bygget.
name: Utforsk
on:
  push:
    branches: [utforsk/lovdata]
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/fylkene
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Hele registeret
        run: |
          mkdir -p ut/a ut/b
          (time npm run hent:lovdata -- --alle) > ut/a/logg.txt 2>&1 || echo "feilet" >> ut/a/logg.txt
          cp -r data/lovdata ut/a/ ; cp .generert/lovdata-endringer.json ut/a/ || true
      - name: Lovtidend (ingen endring ventet)
        run: |
          (time npm run hent:lovdata) > ut/b/logg.txt 2>&1 || echo "feilet" >> ut/b/logg.txt
          git status --porcelain data/lovdata > ut/b/endret.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE=$(mktemp -u)
          (cd ut && find . -type f | sed 's#^\./##' | while read f; do git update-index --add --cacheinfo 100644,$(git hash-object -w "$f"),"$f"; done)
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Utforsk $(date -u +%F)")
          git push --force origin "$commit:refs/heads/utforsk-data"
