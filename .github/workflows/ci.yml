# Lint, typesjekk, tester, bygg og ende-til-ende-tester på hver PR og hver push til main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Kildesjekken starter CI på endringsforslagene sine (PR-er laget med GITHUB_TOKEN starter ikke CI selv).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test og bygg
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bygg (med sjekk av startpakkens størrelse)
        run: npm run build
      - name: Installer nettlesere for Playwright
        # Nedlastingen henger av og til. Da avbrytes den etter 5 minutter og prøves på nytt, opptil tre ganger.
        run: |
          for forsok in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Installasjonen av nettlesere hang eller feilet (forsøk $forsok av 3)."
          done
          exit 1
      - name: Ende-til-ende-tester (Chromium og WebKit)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
