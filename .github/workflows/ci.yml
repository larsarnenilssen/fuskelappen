# Lint, typesjekk, tester, bygg og ende-til-ende-tester på hver PR og hver push til main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Kildesjekken starter CI på endringsforslagene sine (PR-er laget med GITHUB_TOKEN starter ikke CI selv).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sjekk:
    name: Lint, typesjekk, tester og bygg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bygg (med sjekk av startpakkens størrelse)
        run: npm run build

  # Ende-til-ende-testene deles på seks jobber som kjører samtidig (avgjørelse 040). WebKit mobil har de tunge
  # overflyt- og tilgjengelighetstestene i lys og mørk visning, og deles derfor etter tema. Hver jobb bygger appen
  # selv og bruker to workers.
  e2e:
    name: Ende-til-ende (${{ matrix.navn }})
    runs-on: ubuntu-latest
    # Playwrights eget bilde har nettleserne og alle systempakkene de trenger. Da slipper vi å installere dem
    # fra Ubuntu-speilet, som av og til er svært tregt. Versjonen må være den samme som @playwright/test i
    # package-lock.json (det testes i tests/unit/arbeidsflyter.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { navn: 'Chromium mobil', del: chromium-mobil, valg: '--project=chromium-mobil' }
          - { navn: 'WebKit mobil, lys', del: webkit-mobil-lys, valg: '--project=webkit-mobil --grep "\\(lys\\)$"' }
          - { navn: 'WebKit mobil, mørk', del: webkit-mobil-mork, valg: '--project=webkit-mobil --grep "\\(mork\\)$"' }
          - { navn: 'WebKit mobil, resten', del: webkit-mobil-resten, valg: '--project=webkit-mobil --grep-invert "\\((lys|mork)\\)$"' }
          - { navn: 'Chromium skrivebord', del: chromium-skrivebord, valg: '--project=chromium-skrivebord' }
          - { navn: 'WebKit skrivebord', del: webkit-skrivebord, valg: '--project=webkit-skrivebord' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ende-til-ende-tester
        run: npm run test:e2e -- ${{ matrix.valg }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.del }}
          path: playwright-report/
          retention-days: 14

  # Samlet resultat med samme navn som før, så en regel om påkrevd sjekk på main fortsatt virker.
  test:
    name: Test og bygg
    needs: [sjekk, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alle jobbene må være grønne
        run: |
          test "${{ needs.sjekk.result }}" = success
          test "${{ needs.e2e.result }}" = success
