# Lint, typesjekk, tester, bygg og ende-til-ende-tester på hver PR og hver push til main. På en PR ser den første jobben
# hvilke filer som er endret, og hopper over det som ikke trengs (avgjørelse 067): bare dokumentasjon gir ingen tester,
# bare versjonsnummeret gir bare den raske jobben. På main og ved manuell start kjøres alt.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Kildesjekken starter CI på endringsforslagene sine (PR-er laget med GITHUB_TOKEN starter ikke CI selv).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nivået: ingen, rask eller alt (scripts/ci/endringer.ts). Skriptet kjøres med Node uten npm ci, så jobben er rask.
  endringer:
    name: Hva er endret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nivaa: ${{ steps.nivaa.outputs.nivaa }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
      - id: nivaa
        env:
          HENDELSE: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$HENDELSE" = pull_request ]; then
            node --experimental-strip-types scripts/ci/endringer.ts "$BASE"
          else
            echo "Nivå: alt ($HENDELSE)"
            echo nivaa=alt >> "$GITHUB_OUTPUT"
          fi

  # Hoppes over på jobbnivå når PR-en bare endrer dokumentasjon.
  sjekk:
    name: Lint, typesjekk, tester og bygg
    needs: endringer
    if: needs.endringer.outputs.nivaa != 'ingen'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bygg (med sjekk av startpakkens størrelse)
        run: npm run build

  # Appen bygges én gang for ende-til-ende-testene, og delene under henter bygget (avgjørelse 055). Hoppes over på
  # jobbnivå når PR-en bare endrer dokumentasjon eller versjonsnummeret. Da hoppes også e2e over, så de åtte jobbene
  # ikke henter Playwright-bildet bare for å rapportere.
  bygg-e2e:
    name: Bygg for ende-til-ende
    needs: endringer
    if: needs.endringer.outputs.nivaa == 'alt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist-e2e
          path: dist-e2e/
          retention-days: 1

  # Ende-til-ende-testene fordeles på åtte jobber som kjører samtidig, med tre workers hver (avgjørelse 055). Playwright
  # deler etter antall tester i rekkefølge, så hvert nettleseroppsett deles for seg: WebKit mobil har de tunge
  # overflyt- og axe-testene (merket @mobil) og WebKit er tregest, så det får fire deler, Chromium mobil to og
  # skrivebordsoppsettene én hver.
  e2e:
    name: Ende-til-ende (${{ matrix.navn }})
    needs: bygg-e2e
    runs-on: ubuntu-latest
    # Playwrights eget bilde har nettleserne og alle systempakkene de trenger. Da slipper vi å installere dem
    # fra Ubuntu-speilet, som av og til er svært tregt. Versjonen må være den samme som @playwright/test i
    # package-lock.json (det testes i tests/unit/arbeidsflyter.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { navn: 'WebKit mobil 1/4', del: webkit-mobil-1, valg: '--project=webkit-mobil --shard=1/4' }
          - { navn: 'WebKit mobil 2/4', del: webkit-mobil-2, valg: '--project=webkit-mobil --shard=2/4' }
          - { navn: 'WebKit mobil 3/4', del: webkit-mobil-3, valg: '--project=webkit-mobil --shard=3/4' }
          - { navn: 'WebKit mobil 4/4', del: webkit-mobil-4, valg: '--project=webkit-mobil --shard=4/4' }
          - { navn: 'Chromium mobil 1/2', del: chromium-mobil-1, valg: '--project=chromium-mobil --shard=1/2' }
          - { navn: 'Chromium mobil 2/2', del: chromium-mobil-2, valg: '--project=chromium-mobil --shard=2/2' }
          - { navn: 'Chromium skrivebord', del: chromium-skrivebord, valg: '--project=chromium-skrivebord' }
          - { navn: 'WebKit skrivebord', del: webkit-skrivebord, valg: '--project=webkit-skrivebord' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-e2e
          path: dist-e2e/
      - name: Ende-til-ende-tester
        run: npm run test:e2e -- ${{ matrix.valg }}
        env:
          E2E_FERDIG_BYGD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.del }}
          path: playwright-report/
          retention-days: 14

  # Samlet resultat med samme navn som før, så en regel om påkrevd sjekk på main fortsatt virker. Den er grønn når
  # jobbene er grønne, eller hoppet over fordi nivået tillater det (avgjørelse 067).
  test:
    name: Test og bygg
    needs: [endringer, sjekk, bygg-e2e, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alle jobbene må være grønne eller hoppet over etter nivået
        env:
          NIVAA: ${{ needs.endringer.outputs.nivaa }}
          ENDRINGER: ${{ needs.endringer.result }}
          SJEKK: ${{ needs.sjekk.result }}
          BYGG_E2E: ${{ needs.bygg-e2e.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          # krev <jobb> <resultat> <lov å hoppe over: ja eller nei>
          krev() {
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = ja ]; }; then
              echo "$1: $2"
            else
              echo "::error::$1: $2"
              exit 1
            fi
          }
          krev endringer "$ENDRINGER" nei
          echo "Nivå: $NIVAA"
          case "$NIVAA" in ingen|rask|alt) ;; *) echo "::error::Ukjent nivå: '$NIVAA'"; exit 1 ;; esac
          hopp_sjekk=nei
          hopp_e2e=nei
          if [ "$NIVAA" = ingen ]; then hopp_sjekk=ja; hopp_e2e=ja; fi
          if [ "$NIVAA" = rask ]; then hopp_e2e=ja; fi
          krev sjekk "$SJEKK" "$hopp_sjekk"
          krev bygg-e2e "$BYGG_E2E" "$hopp_e2e"
          krev e2e "$E2E" "$hopp_e2e"

  # Varsel til eier når CI feiler på main (avgjørelse 085). På PR-er varsles ikke eier; der retter Claude feilen.
  varsle:
    name: Varsle eier
    needs: [test]
    if: always() && github.event_name == 'push' && needs.test.result != 'cancelled'
    uses: ./.github/workflows/varsle.yml
    with:
      resultat: ${{ needs.test.result == 'failure' && 'feilet' || 'ok' }}
    permissions:
      contents: read
      issues: write
      actions: read
