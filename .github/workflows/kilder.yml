# Kildesjekk: sjekker de aktive kildene hver uke og kan startes manuelt.
# Skriver data/status/kildestatus.json og verdistatus.json (verdisjekken) og lager docs/KONTROLL.md og docs/KOBLING.md på nytt,
# committer dem ved hver kjøring (holder den planlagte jobben i live),
# oppretter, oppdaterer eller lukker den ukentlige kontrollsaken (issue med etiketten «kontroll»), og publiserer
# fersk status og registerdata (Grep, skoleregisteret).
name: Kildesjekk

on:
  schedule:
    - cron: '17 4 * * 1' # mandager kl. 04.17 UTC
    # Dagen etter at de fleste endringer i lover og forskrifter trer i kraft (1. januar, 1. juli og 1. august), så
    # teksten i appen er oppdatert innen et døgn (eier 05.10.2026). Faller dagen på en mandag, går bare den vanlige.
    - cron: '47 4 2 1,7,8 *'
  workflow_dispatch:
    inputs:
      simuler_feil:
        description: 'Simuler feil for én kilde (skriv f.eks. ks-sfs2213). La stå tomt for vanlig kjøring.'
        required: false
        default: ''
      kontrollrunde:
        description: 'Lag en kontrollrunde nå (ellers bare første mandag i mai og august).'
        type: boolean
        required: false
        default: false

concurrency:
  group: kildesjekk
  cancel-in-progress: false

jobs:
  # Den ekstra kjøringen 2. januar, juli og august hoppes over når dagen er en mandag, fordi den vanlige går da.
  dag:
    name: Skal kildesjekken gå i dag?
    runs-on: ubuntu-latest
    outputs:
      kjor: ${{ steps.dag.outputs.kjor }}
    steps:
      - id: dag
        env:
          PLAN: ${{ github.event.schedule }}
        run: |
          if [ "$PLAN" = '47 4 2 1,7,8 *' ] && [ "$(date -u +%u)" = 1 ]; then echo kjor=nei >> "$GITHUB_OUTPUT"; else echo kjor=ja >> "$GITHUB_OUTPUT"; fi

  sjekk:
    name: Sjekk kilder
    needs: dag
    if: needs.dag.outputs.kjor == 'ja'
    runs-on: ubuntu-latest
    # Grep kan være tregt (04.10.2026: over 20 minutter), så jobben får god tid. Grep-hentingen har egen grense under.
    # Første lesing av hele registeret over lokale forskrifter hos Lovdata tar 15–20 minutter (avgjørelse 061), og
    # lenkesjekken noen minutter (avgjørelse 062).
    timeout-minutes: 75
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Installer Chromium (for KF Infoserie, som krever nettleser)
        # Uten --with-deps: systempakkene fra Ubuntu-speilet er av og til svært trege, og maskinene hos GitHub har
        # allerede det Chromium trenger (Google Chrome er installert). Nettleseren hentes fra Playwright.
        timeout-minutes: 10
        run: npx playwright install chromium
      # Grep (avgjørelse 018): hentes hver uke. Stemmer testene med de nye dataene, tas de inn og publiseres.
      # Feiler testene, legges de gamle dataene tilbake, og kontrollsaken sier fra.
      # Lageret for Grep (avgjørelse 060) ligger på grenen grep-lager, så hentingen bare tar det som er nytt eller endret.
      - name: Hent Grep-lageret
        run: |
          mkdir -p .generert
          if git fetch --depth=1 origin grep-lager; then
            git show FETCH_HEAD:grep-lager.json.gz > .generert/grep-lager.json.gz
            sha256sum .generert/grep-lager.json.gz > .generert/grep-lager.sha
          else
            echo "Ingen Grep-lager ennå. Alt hentes."
          fi
      - name: Hent Grep, fag- og timefordeling, overordnet del og lovtekst
        id: grep
        continue-on-error: true
        # Fag- og timefordelingen (Udir-1), VIGO Kodeverksbase, løpene fra utdanning.no og lov- og forskriftstekst fra
        # Lovdata, fagene på NDLA, opplæringskontorene i NOR, eksamensdatoene og inntaksdatoene hentes selv om Grep
        # feiler, og omvendt (avgjørelse 024, 026, 039, 052, 053 og 059).
        run: |
          status=0
          # Grep får høyst 20 minutter. Blir den ikke ferdig, beholdes forrige henting, og de andre kildene hentes likevel.
          timeout -k 30s 20m npm run hent:grep || status=1
          npm run hent:udir || status=1
          npm run hent:overordnet || status=1
          npm run hent:lovdata || status=1
          npm run hent:vigo || status=1
          npm run hent:utdanning || status=1
          npm run hent:ndla || status=1
          npm run hent:nor || status=1
          npm run hent:eksamen || status=1
          npm run hent:inntak || status=1
          exit $status
      # Lageret lagres også når Grep ble stoppet, så neste kjøring fortsetter der denne slapp. Grenen har bare én
      # commit, som skrives over.
      - name: Lagre Grep-lageret
        if: always()
        run: |
          f=.generert/grep-lager.json.gz
          if [ ! -f "$f" ] || { [ -f .generert/grep-lager.sha ] && sha256sum -c --status .generert/grep-lager.sha; }; then
            echo "Lageret er uendret."
            exit 0
          fi
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          blob=$(git hash-object -w "$f")
          tree=$(printf '100644 blob %s\tgrep-lager.json.gz\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Grep-lager $(date -u +%F)")
          git push --force origin "$commit:refs/heads/grep-lager"
      # Rapporten over koblingen fra fagkode til årsramme (avgjørelse 023) og oversikten over tilbudsstrukturen
      # (avgjørelse 024) lages på nytt med de nye dataene, så nye fag og endrede tilbud står der før testene kjøres.
      # Begge lages også når dataene er uendret, fordi skoleåret og regelperioden følger datoen.
      - name: Test de nye dataene fra Grep, Udir-1, VIGO, utdanning.no, NDLA og NOR
        run: |
          mkdir -p .generert
          if [ -z "$(git status --porcelain -- data/grep data/udir data/vigo data/utdanning data/ndla data/eksamen data/inntak)" ]; then
            echo uendret > .generert/grep-tester.txt
            npm run kobling:rapport
            npm run tilbud:rapport
          elif npm run kobling:rapport && npm run tilbud:rapport && npx vitest run; then
            echo ok > .generert/grep-tester.txt
          else
            echo feilet > .generert/grep-tester.txt
            # Ta vare på de nye dataene til endringsforslaget, og legg de gamle tilbake (med rapporten for dem).
            mkdir -p .generert/grep-ny && cp -r data/grep/. .generert/grep-ny/
            mkdir -p .generert/udir-ny && cp -r data/udir/. .generert/udir-ny/
            mkdir -p .generert/vigo-ny && cp -r data/vigo/. .generert/vigo-ny/
            mkdir -p .generert/utdanning-ny && cp -r data/utdanning/. .generert/utdanning-ny/
            mkdir -p .generert/ndla-ny && cp -r data/ndla/. .generert/ndla-ny/
            mkdir -p .generert/eksamen-ny && cp -r data/eksamen/. .generert/eksamen-ny/
            mkdir -p .generert/inntak-ny && cp -r data/inntak/. .generert/inntak-ny/
            git checkout -- data/grep data/udir data/vigo data/utdanning data/ndla data/eksamen data/inntak docs/KOBLING.md docs/TILBUDSSTRUKTUR.md data/status/kobling.json data/status/lopsamsvar.json && git clean -fdq -- data/grep data/udir data/vigo data/utdanning data/ndla data/eksamen data/inntak
            npm run kobling:rapport
            npm run tilbud:rapport
          fi
      - name: Sjekk kildene
        env:
          SIMULER: ${{ inputs.simuler_feil }}
        run: |
          if [ -n "$SIMULER" ]; then
            npm run kilder:sjekk -- "--simuler-feil=$SIMULER"
          else
            npm run kilder:sjekk
          fi
      # Teksten fra kildene, så sider som ikke kan leses fra utviklingsmiljøet (f.eks. vestlandfylke.no), kan leses fra
      # kjøringen (fase 6, pakke 3). Ligger i 14 dager.
      - name: Last opp kildetekstene
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kildetekster
          path: .generert/kildetekster/
          retention-days: 14
          if-no-files-found: ignore
      - name: Kontrolloversikt
        run: npm run kontroll:rapport
      - name: Sammendrag
        run: cat .generert/kilderapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lagre kildestatus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/kildestatus.json data/status/verdistatus.json data/status/kildetekst.json data/status/kobling.json data/status/lopsamsvar.json data/skoler/vgs.json data/grep data/udir data/vigo data/utdanning data/ndla data/lovdata data/eksamen data/inntak docs/KONTROLL.md docs/KOBLING.md docs/TILBUDSSTRUKTUR.md
          git commit -m "Kildestatus $(date -u +%F)" || echo "Ingen endring å lagre."
          git push
      # Endringsforslag (avgjørelse 020): PR med nye tall og sitater, og med nye Grep-data når testene feiler.
      # Lenkesjekken (avgjørelse 062): alle faste lenker og et utvalg av de massegenererte, hver uke. Statusen fra
      # forrige gang ligger på grenen lenkesjekk (én commit, som skrives over), så lenker som har feilet to ganger på
      # rad, kommer i kontrollsaken for lenkene (etikett «lenker»).
      - name: Hent lenkestatus
        run: |
          mkdir -p .generert
          if git fetch --depth=1 origin lenkesjekk; then
            git show FETCH_HEAD:lenkestatus.json > .generert/lenkestatus.json
          else
            echo "Ingen lenkestatus ennå."
          fi
      - name: Sjekk lenkene
        continue-on-error: true
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run lenker:sjekk
      - name: Lagre lenkestatus
        if: always()
        run: |
          f=.generert/lenkestatus.json
          if [ ! -f "$f" ]; then echo "Ingen lenkestatus å lagre."; exit 0; fi
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          blob=$(git hash-object -w "$f")
          tree=$(printf '100644 blob %s\tlenkestatus.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Lenkestatus $(date -u +%F)")
          git push --force origin "$commit:refs/heads/lenkesjekk"
      - name: Endringsforslag (PR)
        # Feiler forslagene, skal kontrollsaken likevel komme.
        continue-on-error: true
        run: npm run kilder:forslag
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Ukentlig kontrollsak og kontrollrunde (issues)
        run: npm run kilder:varsle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KONTROLLRUNDE: ${{ inputs.kontrollrunde && 'ja' || '' }}

  publiser:
    name: Publiser fersk kildestatus
    needs: sjekk
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ''
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
