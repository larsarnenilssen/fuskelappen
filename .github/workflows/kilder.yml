# Kildesjekk: sjekker de aktive kildene hver uke og kan startes manuelt.
# Skriver data/status/kildestatus.json og verdistatus.json (verdisjekken) og lager docs/KONTROLL.md på nytt,
# committer dem ved hver kjøring (holder den planlagte jobben i live),
# oppretter, oppdaterer eller lukker den ukentlige kontrollsaken (issue med etiketten «kontroll»), og publiserer
# fersk status og registerdata (Grep, skoleregisteret).
name: Kildesjekk

on:
  schedule:
    - cron: '17 4 * * 1' # mandager kl. 04.17 UTC
  workflow_dispatch:
    inputs:
      simuler_feil:
        description: 'Simuler feil for én kilde (skriv f.eks. ks-sfs2213). La stå tomt for vanlig kjøring.'
        required: false
        default: ''
      kontrollrunde:
        description: 'Lag en kontrollrunde nå (ellers bare første mandag i mai og august).'
        type: boolean
        required: false
        default: false

concurrency:
  group: kildesjekk
  cancel-in-progress: false

jobs:
  sjekk:
    name: Sjekk kilder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Installer Chromium (for KF Infoserie, som krever nettleser)
        run: npx playwright install --with-deps chromium
      # Grep (avgjørelse 018): hentes hver uke. Stemmer testene med de nye dataene, tas de inn og publiseres.
      # Feiler testene, legges de gamle dataene tilbake, og kontrollsaken sier fra.
      - name: Hent Grep
        id: grep
        continue-on-error: true
        run: npm run hent:grep
      - name: Test de nye Grep-dataene
        if: steps.grep.outcome == 'success'
        run: |
          mkdir -p .generert
          if git diff --quiet -- data/grep; then
            echo uendret > .generert/grep-tester.txt
          elif npx vitest run; then
            echo ok > .generert/grep-tester.txt
          else
            echo feilet > .generert/grep-tester.txt
            git checkout -- data/grep
          fi
      - name: Sjekk kildene
        env:
          SIMULER: ${{ inputs.simuler_feil }}
        run: |
          if [ -n "$SIMULER" ]; then
            npm run kilder:sjekk -- "--simuler-feil=$SIMULER"
          else
            npm run kilder:sjekk
          fi
      - name: Kontrolloversikt
        run: npm run kontroll:rapport
      - name: Sammendrag
        run: cat .generert/kilderapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lagre kildestatus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/kildestatus.json data/status/verdistatus.json data/status/kildetekst.json data/skoler/vgs.json data/grep docs/KONTROLL.md
          git commit -m "Kildestatus $(date -u +%F)" || echo "Ingen endring å lagre."
          git push
      - name: Ukentlig kontrollsak og kontrollrunde (issues)
        run: npm run kilder:varsle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KONTROLLRUNDE: ${{ inputs.kontrollrunde && 'ja' || '' }}

  publiser:
    name: Publiser fersk kildestatus
    needs: sjekk
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ''
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
