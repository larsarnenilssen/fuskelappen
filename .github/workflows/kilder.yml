# Kildesjekk: sjekker de aktive kildene hver uke og kan startes manuelt.
# Skriver data/status/kildestatus.json, committer den ved hver kjøring (holder den planlagte jobben i live),
# oppretter eller oppdaterer én sak (issue) per kilde ved endring eller feil, og publiserer fersk status.
name: Kildesjekk

on:
  schedule:
    - cron: '17 4 * * 1' # mandager kl. 04.17 UTC
  workflow_dispatch:
    inputs:
      simuler_feil:
        description: 'Simuler feil for én kilde (skriv f.eks. ks-sfs2213). La stå tomt for vanlig kjøring.'
        required: false
        default: ''

concurrency:
  group: kildesjekk
  cancel-in-progress: false

jobs:
  sjekk:
    name: Sjekk kilder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sjekk kildene
        env:
          SIMULER: ${{ inputs.simuler_feil }}
        run: |
          if [ -n "$SIMULER" ]; then
            npm run kilder:sjekk -- "--simuler-feil=$SIMULER"
          else
            npm run kilder:sjekk
          fi
      - name: Sammendrag
        run: cat .generert/kilderapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lagre kildestatus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/kildestatus.json data/skoler/vgs.json
          git commit -m "Kildestatus $(date -u +%F)" || echo "Ingen endring å lagre."
          git push
      - name: Varsle eier (issues)
        run: npm run kilder:varsle
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publiser:
    name: Publiser fersk kildestatus
    needs: sjekk
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ''
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
