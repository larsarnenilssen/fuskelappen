# Kobling fra fagkode i Grep til årsramme i vedlegg 1 til SFS 2213 (OPPDRAG fase 2, avgjørelse 023).
# Del av regelsettet sfs2213-2026-2027. Radnummeret (nr) viser til rules/sfs2213/arsrammer-2026-2027.yaml.
#
# Slik finnes årsrammen for en fagkode (src/modules/arbeidstid/beregning/kobling.ts):
# 1. Eksplisitt: fagkoden står i kobling_fellesfag eller kobling_programfag for utdanningsprogrammet og trinnet.
# 2. Regel: fagkoden er et programfag (aldri et fellesfag), fagkodeprefikset står i en regel i kobling_regler eller
#    kobling_yff, og faget brukes på utdanningsprogrammet og trinnet i Grep. Fagkoder i «unntak» følger ikke regelen.
# 3. Manuell: brukeren velger rad i vedlegg 1 eller skriver årsrammen selv (i kalkulatoren).
# Utdanningsprogram og trinn i Grep kommer fra programområdene faget brukes i (data/grep/fagindeks.json).
# Gir koblingen ulik årsramme for ulike program eller trinn, spør kalkulatoren om program og trinn.
# Fag som ikke er koblet, står i rapporten docs/KOBLING.md (npm run kobling:rapport), med grunn.
#
# Tabellene er et forslag laget av Claude 30.09.2026 ut fra navn, program og trinn i Grep og i vedlegg 1, og
# fagsøket og årstimetabellen fra fase 1. Alt har kontrollert: null til eier har gått gjennom det.
id: sfs2213-2026-2027
regelverk: sfs2213
del: kobling
gyldig_fra: "2026-01-01"
gyldig_til: "2027-12-31"
kilde: udir-grep
verdier:
  programnavn:
    kilde: { id: udir-grep }
    kontrollert: { dato: "2026-10-01" }
    grunnlag: avledet
    merknad: >-
      Programnavnene i vedlegg 1 koblet til utdanningsprogrammene i Grep (kode på to bokstaver). PB er påbygging
      til generell studiekompetanse (programområdet PBPBY3 i Grep). Vedlegget er skrevet for Kunnskapsløftet 2006.
      Kunst, design og arkitektur (KD) og Medier og kommunikasjon (ME) er egne studieforberedende program fra 2020.
      Eier bekreftet tabellen 01.10.2026: «Stud.spes» gjelder bare studiespesialisering (ST).
    verdi:
      - { vedlegg: "Stud.spes", navn: "Studiespesialisering", grep: [ST] }
      - { vedlegg: "MDD", navn: "Musikk, dans og drama", grep: [MD] }
      - { vedlegg: "Idrett", navn: "Idrettsfag", grep: [ID] }
      - { vedlegg: "Kunst, design og arkitektur", navn: "Kunst, design og arkitektur", grep: [KD] }
      - { vedlegg: "Med./komm", navn: "Medier og kommunikasjon", grep: [ME] }
      - { vedlegg: "Med./komm.", navn: "Medier og kommunikasjon", grep: [ME] }
      - { vedlegg: "Yrkesfag", navn: "Yrkesfaglige utdanningsprogram", grep: [BA, DT, EL, FD, HS, IM, NA, RM, SR, TP] }
      - { vedlegg: "Yrkes/På", navn: "Påbygging til generell studiekompetanse", grep: [PB] }
      - { vedlegg: "Yrkesf/På", navn: "Påbygging til generell studiekompetanse", grep: [PB] }
      - { vedlegg: "Rest. og mat", navn: "Restaurant- og matfag", grep: [RM] }
      - { vedlegg: "Bygg og anl.", navn: "Bygg- og anleggsteknikk", grep: [BA] }
      - { vedlegg: "Naturbruk", navn: "Naturbruk", grep: [NA] }
      - { vedlegg: "Tekn/ind.prod", navn: "Teknologi- og industrifag", grep: [TP] }
      - { vedlegg: "Helse/sos", navn: "Helse- og oppvekstfag", grep: [HS] }
      - { vedlegg: "Elektrofag", navn: "Elektro og datateknologi", grep: [EL] }
      - { vedlegg: "Håndverk, design og produktutvikling", navn: "Håndverk, design og produktutvikling", grep: [DT] }
      - { vedlegg: "Frisør, blomster, interiør og eksponeringsdesign", navn: "Frisør, blomster, interiør og eksponeringsdesign", grep: [FD] }
      - { vedlegg: "Salg, service, reiseliv", navn: "Salg, service og reiseliv", grep: [SR] }
      - { vedlegg: "Informasjonsteknologi og medieproduksjon", navn: "Informasjonsteknologi og medieproduksjon", grep: [IM] }
      - { vedlegg: "Design og hå", navn: "Design og håndverk (utgått)", grep: [] }
      - { vedlegg: "Serv/samf", navn: "Service og samferdsel (utgått)", grep: [] }
  kobling_fellesfag:
    kilde: { id: udir-grep }
    kontrollert: null
    grunnlag: avledet
    merknad: >-
      Fellesfag kobles alltid eksplisitt per fagkode, utdanningsprogram og trinn, aldri med prefiksregler (eier).
      Med er hovedkodene for norsk, engelsk, matematikk, naturfag, samfunnskunnskap, historie, geografi, religion
      og etikk, kroppsøving og alle fremmedspråk (også samiske språk og tegnspråk som fremmedspråk), med vurderingskodene for samme opplæring (f.eks. muntlig).
      Norsk og engelsk på yrkesfag: NOR1262 og ENG1009 gjelder både vg1 og vg2 (eier 29.09.2026). Varianter
      (samisk plan, tegnspråk, kort botid, grunnleggende norsk, styrket opplæring) og samisk er ikke koblet ennå.
