# Årstimetall for elevene i fagene i vedlegg 1, hentet fra Grep (Udir, NLOD 2.0): feltet omfang-totalt på fagkoden.
# Del av regelsettet sfs2213-2026-2027. Brukes til å fylle inn årstimer i kalkulatorene når brukeren velger et fag.
# Brukeren kan alltid endre tallet. Nøkkelen er radnummeret (nr) i vedlegg 1.
# Radene er koblet til fagkodene for hånd. Bare rader der fagkodene gir ett årstimetall for trinnet, er tatt med.
# Norsk og engelsk på yrkesfag: eier bekreftet 29.09.2026 at årstimetallet er 112 (norsk) og 140 (engelsk), som
# omfanget for NOR1262 og ENG1009 i Grep. Samme tall står på radene for vg1 og vg2.
# Latin 1 og Gresk 1 står under Latin/Gresk (rad 114), ikke Antikkens språk og kultur (eier 01.10.2026: 496).
# Ikke med: samisk, fremmedspråk på påbygging, programfag på yrkesfag og forkortelser som ikke kan bekreftes
# i Grep (Info.tekn. samf., Nær.øk, Pol/samf).
# npm run hent:grep henter fagindeksen på nytt (data/grep/fagindeks.json), og en test sammenligner årstimene (avgjørelse 049).
