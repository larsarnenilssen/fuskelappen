  kontrollsporsmal:
    - "Ved ny eksamen faller bare standpunktkarakteren som svarer til eksamenen bort (merknaden til § 9-37, f.eks. bare skriftlig hovedmål). Bør tabellen si det?"
    - "Er det riktig at sommerskole er nevnt bare under ny eksamen, når merknaden til § 9-38 sier at det også gjelder særskilt eksamen?"

- id: ek-vl-bortvisning
  type: forklaring
  gyldighet: { niva: fylke, fylke: "46", forhold: supplerer }
  tittel:
    nb: "Bortvisning og annullering i Vestland"
    nn: "Bortvising og annullering i Vestland"
  tekst:
    nb: "Skulereglane i Vestland regner bortvisning fra og annullering av eksamen som en sanksjon med klagerett, etter vedtak av rektor selv. Klagen sendes til rektor, og fristen er vanligvis tre uker. Statsforvalteren er klageinstans."
    nn: "Skulereglane i Vestland reknar bortvising frå og annullering av eksamen som ein sanksjon med klagerett, etter vedtak av rektor sjølv. Klaga blir send til rektor, og fristen er vanlegvis tre veker. Statsforvaltaren er klageinstans."
  paragrafer: [vestland-skoleregler/8, vestland-skoleregler/13]
  kilder:
    - { id: vestland-forskrift-skulereglar, punkt: "§ 8 tredje ledd nr. 6" }
    - { id: vestland-forskrift-skulereglar, punkt: "§ 13 første og tredje ledd" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det greit at Vestland-boksen bare gjengir skulereglane, uten fylkeskommunens egne sider om eksamen (vlfk.no hentes ikke ennå)?"
