  kontrollert: null
  kontrollsporsmal:
    - "Er det to sidene i raden gjengitt riktig og kort nok?"

- id: us-rad-form
  type: forklaring
  tittel:
    nb: "Form"
    nn: "Form"
  tekst:
    nb: "Underveis: Muntlig, skriftlig eller begge. Halvårsvurdering med karakter er skriftlig. Slutt: Karakter. Standpunkt etter at eleven har vist kompetansen på flere og varierte måter."
    nn: "Undervegs: Munnleg, skriftleg eller begge delar. Halvårsvurdering med karakter er skriftleg. Slutt: Karakter. Standpunkt etter at eleven har vist kompetansen på fleire og varierte måtar."
  sammenligning:
    venstre:
      nb: "Muntlig, skriftlig eller begge. Halvårsvurdering med karakter er skriftlig."
      nn: "Munnleg, skriftleg eller begge delar. Halvårsvurdering med karakter er skriftleg."
    hoyre:
      nb: "Karakter. Standpunkt etter at eleven har vist kompetansen på flere og varierte måter."
      nn: "Karakter. Standpunkt etter at eleven har vist kompetansen på fleire og varierte måtar."
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-11 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-11" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-13 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-13" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-16 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-16" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det to sidene i raden gjengitt riktig og kort nok?"

- id: us-rad-eleven
  type: forklaring
  tittel:
    nb: "Eleven"
    nn: "Eleven"
  tekst:
    nb: "Underveis: Vurderer eget arbeid, vet hva som skal læres, får vite hva hen mestrer og hvordan komme videre. Slutt: Er kjent med hva det legges vekt på når standpunkt settes."
    nn: "Undervegs: Vurderer eige arbeid, veit kva som skal lærast, får vite kva hen meistrar og korleis kome vidare. Slutt: Er kjend med kva det blir lagt vekt på når standpunkt blir sett."
  sammenligning:
    venstre:
      nb: "Vurderer eget arbeid, vet hva som skal læres, får vite hva hen mestrer og hvordan komme videre."
      nn: "Vurderer eige arbeid, veit kva som skal lærast, får vite kva hen meistrar og korleis kome vidare."
    hoyre:
      nb: "Er kjent med hva det legges vekt på når standpunkt settes."
      nn: "Er kjend med kva det blir lagt vekt på når standpunkt blir sett."
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-11 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-11" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-16 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-16" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det to sidene i raden gjengitt riktig og kort nok?"

- id: us-rad-klage
  type: forklaring
  tittel:
    nb: "Klage"
    nn: "Klage"
  tekst:
    nb: "Underveis: Ingen klagerett. Slutt: Klage innen 10 dager på standpunkt og eksamen."
    nn: "Undervegs: Ingen klagerett. Slutt: Klage innan 10 dagar på standpunkt og eksamen."
  sammenligning:
    venstre:
      nb: "Ingen klagerett."
      nn: "Ingen klagerett."
    hoyre:
      nb: "Klage innen 10 dager på standpunkt og eksamen."
      nn: "Klage innan 10 dagar på standpunkt og eksamen."
  paragrafer: [opplaeringsforskrifta/10-1, opplaeringsforskrifta/10-2]
  kilder:
