# Underveis- og sluttvurdering (fase 6, pakke 1). Egne ord. Godkjent i forslaget av eier 04.10.2026.
# Skoleåret (us-skolearet), forskjellen side om side (us-rad-*) og prinsippene for vurdering (us-prinsipp-*).
- id: us-skolearet
  type: forklaring
  tittel:
    nb: "Skoleåret i et fag"
    nn: "Skoleåret i eit fag"
  tekst:
    nb: "Underveisvurderingen går hele året. Halvårsvurderingen gis midt i opplæringsperioden, og ved slutten av skoleåret når faget fortsetter neste år. Standpunktkarakteren settes så sent som mulig, og senest dagen før sensur når eleven har eksamen i faget. Datoene for eksamen fastsetter Udir hvert år."
    nn: "Undervegsvurderinga går heile året. Halvårsvurderinga blir gitt midt i opplæringsperioden, og ved slutten av skoleåret når faget held fram neste år. Standpunktkarakteren blir sett så seint som mogleg, og seinast dagen før sensur når eleven har eksamen i faget. Datoane for eksamen fastset Udir kvart år."
  paragrafer: [opplaeringsforskrifta/9-13, opplaeringsforskrifta/9-16]
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-13 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-13" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-16 tredje og fjerde ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-16" }
    - { id: udir-merknader-ofo-kap9, punkt: "Merknad til § 9-16", url: "https://www.udir.no/regelverkstolkninger/opplaring/forskrift-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringsforskrifta/tredje-delen--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-9-individuell-vurdering/iii.-sluttvurdering/-9-16-standpunktkarakterar-i-fag/" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-26 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-26" }
  kontrollert: null
  kontrollsporsmal:
    - "Er figuren av skoleåret (underveis hele året, halvår midt i, eksamen i mai, standpunkt etter eksamen og før sensur) en riktig forenkling for et fag som avsluttes?"

- id: us-rad-hva
  type: forklaring
  tittel:
    nb: "Hva det er"
    nn: "Kva det er"
  tekst:
    nb: "Underveis: All vurdering før opplæringen i faget er slutt, også halvårsvurderingen. Slutt: Standpunkt, eksamen og fag- og svenneprøven, praksisbrevprøven og kompetanseprøven."
    nn: "Undervegs: All vurdering før opplæringa i faget er slutt, også halvårsvurderinga. Slutt: Standpunkt, eksamen og fag- og sveineprøva, praksisbrevprøva og kompetanseprøva."
  sammenligning:
    venstre:
      nb: "All vurdering før opplæringen i faget er slutt, også halvårsvurderingen."
      nn: "All vurdering før opplæringa i faget er slutt, også halvårsvurderinga."
    hoyre:
      nb: "Standpunkt, eksamen og fag- og svenneprøven, praksisbrevprøven og kompetanseprøven."
      nn: "Standpunkt, eksamen og fag- og sveineprøva, praksisbrevprøva og kompetanseprøva."
  paragrafer: [opplaeringsforskrifta/9-11, opplaeringsforskrifta/9-15]
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-11 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-11" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-15 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-15" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det to sidene i raden gjengitt riktig og kort nok?"

- id: us-rad-formal
  type: forklaring
  tittel:
    nb: "Formål"
    nn: "Formål"
  tekst:
    nb: "Underveis: Fremme læring, øke kompetansen og tilpasse opplæringen. Slutt: Gi informasjon om kompetansen når opplæringen i faget er slutt."
    nn: "Undervegs: Fremje læring, auke kompetansen og tilpasse opplæringa. Slutt: Gi informasjon om kompetansen når opplæringa i faget er slutt."
  sammenligning:
    venstre:
      nb: "Fremme læring, øke kompetansen og tilpasse opplæringen."
      nn: "Fremje læring, auke kompetansen og tilpasse opplæringa."
    hoyre:
      nb: "Gi informasjon om kompetansen når opplæringen i faget er slutt."
      nn: "Gi informasjon om kompetansen når opplæringa i faget er slutt."
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-11 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-11" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-15 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-15" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det to sidene i raden gjengitt riktig og kort nok?"

- id: us-rad-grunnlag
  type: forklaring
  tittel:
    nb: "Grunnlag"
    nn: "Grunnlag"
  tekst:
    nb: "Underveis: Kompetansemålene i læreplanen. Slutt: Kompetansemålene i læreplanen."
    nn: "Undervegs: Kompetansemåla i læreplanen. Slutt: Kompetansemåla i læreplanen."
  sammenligning:
    venstre:
      nb: "Kompetansemålene i læreplanen."
      nn: "Kompetansemåla i læreplanen."
    hoyre:
      nb: "Kompetansemålene i læreplanen."
      nn: "Kompetansemåla i læreplanen."
  paragrafer: [opplaeringsforskrifta/9-1]
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-1 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-1" }
