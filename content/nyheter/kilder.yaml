    ingress: true
    fylker: ["42"]

  - id: statsforvalteren-innlandet
    navn: { nb: Statsforvalteren i Innlandet, nn: Statsforvaltaren i Innlandet }
    kortnavn: { nb: Statsforvalteren, nn: Statsforvaltaren }
    type: myndighet
    kilde: statsforvalteren-nyheter
    format: rss
    url: https://www.statsforvalteren.no/nb/innlandet/nyheter/rss?limit=50
    filter: vgs
    ingress: true
    fylker: ["34"]

  - id: statsforvalteren-more-og-romsdal
    navn: { nb: Statsforvalteren i Møre og Romsdal, nn: Statsforvaltaren i Møre og Romsdal }
    kortnavn: { nb: Statsforvalteren, nn: Statsforvaltaren }
