  - id: statsforvalteren-trondelag
    navn: { nb: Statsforvalteren i Trøndelag, nn: Statsforvaltaren i Trøndelag }
    kortnavn: { nb: Statsforvalteren, nn: Statsforvaltaren }
    type: myndighet
    kilde: statsforvalteren-nyheter
    format: rss
    url: https://www.statsforvalteren.no/nb/trondelag/nyheter/rss?limit=50
