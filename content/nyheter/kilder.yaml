# Nyhetskildene (fase 7b). scripts/hent-nyheter.ts henter dem hver dag til data/nyheter/nyheter.json, og appen viser
# navnet, typen og merknaden herfra. Hver kilde har en oppføring i content/kilder.yaml med lisens (`kilde`).
#
# - type: myndighet, fagpresse, organisasjon (interessepart), forskning eller media.
# - format: rss (RSS eller Atom), udir eller utdanningsforbundet (nyhetslisten på én side).
# - filter: vgs (bare saker som passer ordene under) eller alle.
# - ingress: om ingressen tas med (eier avgjør når designet er klart).
# - fylker: Statsforvalteren vises bare når et av fylkene er valgt.
# - utelat: ord i tittelen som utelukker en sak fra kilden.

# Ordene som gjør en sak relevant for videregående. Et ord treffer også når det er starten på et lengre ord
# (scripts/nyheter/filter.ts):
# - Et sterkt ord tar med saken, med mindre tittelen handler om en annen del av utdanningen og ikke har et sterkt ord.
# - Et generelt ord i tittelen tar med saken når ingen ord fra `utelukker` står der. Står de generelle ordene bare i
#   ingressen, må minst to ulike ord treffe, så én tilfeldig «elev» eller «skole» ikke er nok.
# Ord som er tatt ut fordi de ga feiltreff (eier 07.10.2026): «fylkeskommune» (landbruk, budsjett), «opplæring»
# (fengsel, helse), «undervisning» og «vurdering» (forvaltning).
filter:
  sterke:
    - videregående
    - vidaregåande
    - vgs
    - vg1
    - vg2
    - vg3
    - yrkesfag
    - studieforberedende
    - studiekompetanse
    - lærling
    - lærlinga
    - lærekandidat
    - lærefag
    - læreplass
    - lærebedrift
    - fagbrev
    - svennebrev
    - fagprøve
    - fagopplæring
    - fag- og yrkesopplæring
    - opplæringskontor
    - privatist
    - inntak
    - opplæringslov
    - opplæringsforskrift
    - privatskolelov
    - SFS 2213
    - lektor
  generelle:
    - skole
    - skule
    - elev
    - lærer
    - lærar
    - rektor
    - skoleleder
    - skuleleiar
    - eksamen
    - standpunkt
    - karakter
    - fravær
    - læreplan
    - fagfornyelsen
    - underveisvurdering
    - sluttvurdering
    - vurderingen
    - vurderinga
    - skolemiljø
    - skulemiljø
    - mobbing
    - tilpasset opplæring
    - tilpassa opplæring
    - spesialundervisning
    - individuelt tilrettelagt
    - særskilt språkopplæring
    - privatskole
    - privatskule
  utelukker:
    - barnehage
    - grunnskole
    - grunnskule
    - barneskole
    - barneskule
    - ungdomsskole
    - ungdomsskule
    - småskole
    - 1. trinn
    - 1. og 2. trinn
    - 1.–4. trinn
    - 5.–7. trinn
    - 8.–10. trinn
    - barnetrinn
    - småtrinn
    - mellomtrinn
    - ungdomstrinn
    - de minste
    - de yngste
    - dei minste
    - dei yngste
    - tiendeklass
    - tiandeklass
    - nasjonale prøver
    - nasjonale prøvar
    - fellesskole
    - fellesskule
    - skolefritidsordning
    - SFO
    - universitet
    - høyskole
    - høgskole
    - studenter
    - studentar
    - doktorgrad
    - fagskole
    - fagskule
    - studielån
    - forskningssenter
    - lærerutdanning
    - lærarutdanning
  aldri:
    - stillingsutlysning
    - ledig stilling

kilder:
  - id: regjeringen-kd
    navn: { nb: Kunnskapsdepartementet, nn: Kunnskapsdepartementet }
    kortnavn: { nb: KD, nn: KD }
    type: myndighet
    kilde: regjeringen-kd-nyheter
    format: rss
    url: https://www.regjeringen.no/no/rss/Rss/2581966/?owner=586
    filter: vgs
    ingress: true

  - id: udir
    navn: { nb: Utdanningsdirektoratet, nn: Utdanningsdirektoratet }
    kortnavn: { nb: Udir, nn: Udir }
    type: myndighet
    kilde: udir-siste-nytt
    format: udir
    url: https://www.udir.no/om-udir/siste-nytt/
    filter: vgs
    ingress: true

  # Vedtatte endringer i lovene og forskriftene appen har, fra hentingen fra Lovdata (data/lovdata/kommende.json).
  # Tittelen og ingressen lages av appen, på bokmål og nynorsk. Datoen er datoen endringen ble vedtatt.
  - id: lovdata
    navn: { nb: Lovdata (Norsk Lovtidend), nn: Lovdata (Norsk Lovtidend) }
    kortnavn: { nb: Lovdata, nn: Lovdata }
    type: myndighet
    kilde: lovdata-lovtidend
    format: lovdata
    url: https://lovdata.no/register/lovtidend
    filter: alle
    ingress: true

  # Forskning (K5 og K6, eier 07.10.2026). forskning.no har mye om barn og grunnskole, så saker om barn og foreldre
  # tas bare med når de har et sterkt ord.
  - id: forskning-no
    navn: { nb: forskning.no, nn: forskning.no }
    type: forskning
    kilde: forskning-no-skole
    format: rss
    url: "https://www.forskning.no/tag/skole%20og%20utdanning?lab_viewport=rss"
    filter: vgs
    ingress: true
    utelukker: [barn, foreldre]

  - id: nifu
    navn: { nb: NIFU, nn: NIFU }
    type: forskning
    merknad: { nb: Nordisk institutt for studier av innovasjon, forskning og utdanning, nn: Nordisk institutt for studiar av innovasjon, forsking og utdanning }
    kilde: nifu-nyheter
    format: rss
    url: https://www.nifu.no/category/nyhet/feed/
    filter: vgs
    ingress: true

  - id: skolelederforbundet
    navn: { nb: Skolelederforbundet, nn: Skolelederforbundet }
    type: organisasjon
    kilde: skolelederforbundet-nyheter
    format: rss
    url: https://www.skolelederforbundet.no/feed/
    filter: alle
    ingress: true
    utelat: [forsikring, YS Fordel, Kampanje]

  - id: utdanningsforbundet
    navn: { nb: Utdanningsforbundet, nn: Utdanningsforbundet }
    type: organisasjon
    kilde: utdanningsforbundet-nyheter
    format: utdanningsforbundet
    url: https://www.utdanningsforbundet.no/nyheter
    filter: alle
    ingress: true

  - id: utdanningsnytt
    navn: { nb: Utdanningsnytt, nn: Utdanningsnytt }
    type: fagpresse
    merknad: { nb: Utgitt av Utdanningsforbundet, nn: Gitt ut av Utdanningsforbundet }
    kilde: utdanningsnytt-nyheter
    format: rss
    url: https://www.utdanningsnytt.no/tag/videreg%C3%A5ende?lab_viewport=rss
    filter: alle
    ingress: true

  # Statsforvalteren: ett embete per fylke eller gruppe av fylker. Sakene står bare når et av fylkene er valgt.
  # Embetene som skriver nynorsk, har feeden under /nn/<embete>/nyhende/.

  - id: statsforvalteren-agder
    navn: { nb: Statsforvalteren i Agder, nn: Statsforvaltaren i Agder }
    kortnavn: { nb: Statsforvalteren, nn: Statsforvaltaren }
    type: myndighet
    kilde: statsforvalteren-nyheter
    format: rss
    url: https://www.statsforvalteren.no/nb/agder/nyheter/rss?limit=50
