    - grunnskole
    - grunnskule
    - barneskole
    - barneskule
    - ungdomsskole
    - ungdomsskule
    - småskole
    - 1. trinn
    - 1. og 2. trinn
    - 1.–4. trinn
    - 5.–7. trinn
    - 8.–10. trinn
    - barnetrinn
    - småtrinn
    - mellomtrinn
    - ungdomstrinn
    - de minste
    - de yngste
    - dei minste
    - dei yngste
    - nasjonale prøver
