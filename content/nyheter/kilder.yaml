    format: rss
    url: https://www.statsforvalteren.no/nb/nordland/nyheter/rss?limit=50
    filter: vgs
    ingress: true
    fylker: ["18"]

  - id: statsforvalteren-rogaland
    navn: { nb: Statsforvalteren i Rogaland, nn: Statsforvaltaren i Rogaland }
    kortnavn: { nb: Statsforvalteren, nn: Statsforvaltaren }
    type: myndighet
    kilde: statsforvalteren-nyheter
    format: rss
    url: https://www.statsforvalteren.no/nn/rogaland/nyhende/rss?limit=50
    filter: vgs
    ingress: true
    fylker: ["11"]

  - id: statsforvalteren-troms-og-finnmark
    navn: { nb: Statsforvalteren i Troms og Finnmark, nn: Statsforvaltaren i Troms og Finnmark }
    kortnavn: { nb: Statsforvalteren, nn: Statsforvaltaren }
    type: myndighet
    kilde: statsforvalteren-nyheter
    format: rss
    url: https://www.statsforvalteren.no/nb/troms-og-finnmark/nyheter/rss?limit=50
    filter: vgs
