# Prøvekilder: hentes bare av «npm run nyheter:prove» (i PR-er og ved manuell kjøring av arbeidsflyten Nyheter), og
# vises ikke i appen. Rapporten viser om kilden svarer, hvor mange saker den har, og hva filteret ville tatt med, så
# eier kan avgjøre om kilden skal med (K3, K5, K6 og K8, eier 07.10.2026). `streng`: bare sterke ord i tittelen.
prove:
  - { id: hkdir-aktuelt, navn: HKdir (Aktuelt), url: https://hkdir.no/aktuelt, format: hkdir }
  - { id: skolenes, navn: Skolenes landsforbund, url: https://www.skolenes.no/feed/, alle: true }
  # Fylkeskommunene (K4). ACOS-fylkene har en feed per nyhetskategori med 5–9 saker.
  - { id: fk-akershus, navn: Akershus fylkeskommune, url: "https://afk.no/ArtikkelRSS.ashx?NyhetsKategoriId=22134&Spraak=Norsk" }
  - { id: fk-buskerud, navn: Buskerud fylkeskommune, url: "https://bfk.no/ArtikkelRSS.ashx?NyhetsKategoriId=21858&Spraak=Norsk" }
  - { id: fk-innlandet, navn: Innlandet fylkeskommune (utdanning), url: "https://innlandetfylke.no/ArtikkelRSS.ashx?NyhetsKategoriId=3578&Spraak=Norsk", alle: true }
  - { id: fk-agder, navn: Agder fylkeskommune, url: "https://agderfk.no/ArtikkelRSS.ashx?NyhetsKategoriId=9&Spraak=Norsk" }
  - { id: fk-rogaland, navn: Rogaland fylkeskommune, url: "https://www.rogfk.no/ArtikkelRSS.ashx?NyhetsKategoriId=9&Spraak=Norsk" }
  - { id: fk-more-og-romsdal, navn: Møre og Romsdal fylkeskommune, url: "https://mrfylke.no/ArtikkelRSS.ashx?NyhetsKategoriId=917&Spraak=Nynorsk" }
  - { id: fk-nordland, navn: Nordland fylkeskommune, url: "https://www.nfk.no/ArtikkelRSS.ashx?NyhetsKategoriId=367&Spraak=Norsk" }
  - { id: fk-troms, navn: Troms fylkeskommune, url: "https://www.tromsfylke.no/ArtikkelRSS.ashx?NyhetsKategoriId=9&Spraak=Norsk" }
  - { id: fk-finnmark, navn: Finnmark fylkeskommune, url: "https://www.ffk.no/ArtikkelRSS.ashx?NyhetsKategoriId=9&Spraak=Norsk" }

# Sider der prøvehentingen leter etter feeder (<link rel="alternate">) og leser robots.txt.
oppdag:
  - https://hkdir.no/aktuelt
  - https://afk.no/aktuelt/
  - https://ostfoldfk.no/
