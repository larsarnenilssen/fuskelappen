# Synonymer for søket: nynorske former (varianter) gjøres om til bokmål (kanonisk)
# både når indeksen bygges og når brukeren søker. Varianter byttes også inne i
# sammensatte ord, så «skul» dekker skule, skulen, skulemiljø og grunnskule.
# Legg til nye par når nye moduler tar i bruk nye ord.
grupper:
  - { kanonisk: skol, varianter: [skul] }
  - { kanonisk: fravær, varianter: [fråvær] }
  - { kanonisk: lærer, varianter: [lærar] }
  - { kanonisk: opplæringsloven, varianter: [opplæringslova] }
  - { kanonisk: videregående, varianter: [vidaregåande] }
  - { kanonisk: særskilt, varianter: [særskild] }
  - { kanonisk: regler, varianter: [reglar] }
  - { kanonisk: elever, varianter: [elevar] }
  - { kanonisk: timer, varianter: [timar] }
  - { kanonisk: hjemmel, varianter: [heimel] }
  - { kanonisk: hjem, varianter: [heim] }
  - { kanonisk: uke, varianter: [veke] }
  - { kanonisk: måned, varianter: [månad] }
  - { kanonisk: syk, varianter: [sjuk] }
  - { kanonisk: egen, varianter: [eigen] }
  - { kanonisk: ikke, varianter: [ikkje] }
  - { kanonisk: hvordan, varianter: [korleis] }
  - { kanonisk: undersøke, varianter: [undersøkje] }
  - { kanonisk: søker, varianter: [søkjar] }
  - { kanonisk: ansatt, varianter: [tilsett] }
  - { kanonisk: giver, varianter: [gjevar] }
  - { kanonisk: begrep, varianter: [omgrep] }
  - { kanonisk: kilde, varianter: [kjelde] }
  - { kanonisk: tilpasset, varianter: [tilpassa] }
  - { kanonisk: planfestet, varianter: [planfesta] }
  - { kanonisk: fastsatt, varianter: [fastsett] }
  - { kanonisk: språklig, varianter: [språkleg] }
  - { kanonisk: daglig, varianter: [dagleg] }
  - { kanonisk: hele, varianter: [heile] }
  - { kanonisk: bare, varianter: [berre] }
  - { kanonisk: fremmedspråk, varianter: [framandspråk] }
  - { kanonisk: forside, varianter: [framside] }
  - { kanonisk: innhold, varianter: [innhald] }
  - { kanonisk: veiledning, varianter: [rettleiing] }
  - { kanonisk: veileder, varianter: [rettleiar] }
  - { kanonisk: sakkyndig, varianter: [sakkunnig] }
  # Læreplanverket (pakke 6, avgjørelse 037).
  - { kanonisk: overordnet, varianter: [overordna] }
  - { kanonisk: grunnleggende, varianter: [grunnleggjande] }
  - { kanonisk: ferdighet, varianter: [ferdigheit] }
  - { kanonisk: tverrfaglig, varianter: [tverrfagleg] }
  - { kanonisk: livsmestring, varianter: [livsmeistring] }
  - { kanonisk: bærekraftig, varianter: [berekraftig] }
  - { kanonisk: medborgerskap, varianter: [medborgarskap] }
  # Lov og forskrift (fase 3, avgjørelse 039). Endelser som -lig/-leg og -het/-heit byttes av søket selv.
  - { kanonisk: hva, varianter: [kva] }
  - { kanonisk: hvem, varianter: [kven] }
  - { kanonisk: noen, varianter: [nokon] }
  - { kanonisk: sammen, varianter: [saman] }
  - { kanonisk: mye, varianter: [mykje] }
  - { kanonisk: eier, varianter: [eigar] }
  - { kanonisk: muntlig, varianter: [munnleg] }
  - { kanonisk: tjeneste, varianter: [teneste] }
  - { kanonisk: taushetsplikt, varianter: [teieplikt] }
  - { kanonisk: begrunnelse, varianter: [grunngiving] }
  - { kanonisk: bolig, varianter: [bustad] }

# Hverdagsord brukerne søker med, men som ikke står i teksten (avgjørelse 100). Et søk på et av ordene i `ord` finner
# også det som står i `gir`. Bare søkehjelp, ikke en påstand om at ordene betyr det samme. Ett ord per oppføring i `ord`;
# et uttrykk i `gir` må ha alle ordene. Ta bare med ord der appen har innhold å finne.
hverdagsord:
  - { ord: [leseplikt, undervisningsplikt, lesetimer], gir: [undervisningstid, årsramme, beskjeftigelse] }
  - { ord: [fagfordeling], gir: [beskjeftigelse, arbeidsplan] }
  - { ord: [timeressurs, timeressurser], gir: [tidsressurser, årsramme] }
  - { ord: [stillingsbrøk], gir: [beskjeftigelse] }
  - { ord: [ordenskarakter, oppførselskarakter], gir: [orden og oppførsel] }
  - { ord: [terminkarakter], gir: [halvårsvurdering] }
  - { ord: [spesialundervisning], gir: [individuelt tilrettelagt opplæring] }
  - { ord: [9a], gir: [skolemiljø, aktivitetsplikt] }
