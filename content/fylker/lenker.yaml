# Lenker til fylkeskommunenes egne sider om videregående opplæring, per tema (eier 05.10.2026, avgjørelse 061).
# Fylkenes tekster kopieres ikke. Appen lenker til siden i fylket brukeren har valgt.
# Adressene er funnet med nettsøk 05.10.2026. «bekreftet» er datoen siden svarte med riktig tittel. null betyr at
# adressen bare er sett i søk, fordi nettstedet stenger skymiljøet. Lenkesjekken holder dette oppdatert.
# Mangler et tema, vises fylkets side for videregående (forside).
temaer: [forside, inntak, klage-inntak, sprak, tilrettelegging, eksamen, klage-standpunkt, privatist, fagprove]
kontrollert: null
kontrollsporsmal:
  - "Er temaene (inntak, klage på inntak, særskilt språkopplæring, tilrettelegging og PPT, eksamen, klage på standpunkt, privatist og fag- og svenneprøven) de riktige å lenke til hos fylkene?"
  - "Er det riktig å lenke til søknadssiden for klage på inntak der fylket ikke har egen side om klage (Østfold, Akershus og Buskerud)?"
