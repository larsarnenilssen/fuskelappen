# Begreper om arbeidstid for undervisningspersonalet (SFS 2213 og hovedtariffavtalen). Fase 1.
- id: arbeidstid
  type: begrep
  tittel: { nb: Arbeidstid, nn: Arbeidstid }
  tekst:
    nb: Arbeidstiden for lærere er regulert i særavtalen SFS 2213. Den består av planfestet arbeidstid og tid læreren disponerer selv, til sammen årsverket. Arbeidsmiljøloven kapittel 10 gir de generelle reglene om arbeidstid.
    nn: Arbeidstida for lærarar er regulert i særavtalen SFS 2213. Ho består av planfesta arbeidstid og tid læraren disponerer sjølv, til saman årsverket. Arbeidsmiljølova kapittel 10 gir dei generelle reglane om arbeidstid.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "4–5" }
    - { id: arbeidsmiljoloven, punkt: Kapittel 10 }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å si at arbeidstiden består av planfestet tid og tid læreren disponerer selv, også når arbeidsåret er utvidet på grunn av funksjoner?"
  stikkord: [SFS 2213, arbeidstidsavtale, lærerarbeidstid]
  relatert: [arsverk, planfestet-arbeidstid, selvdisponert-tid]

- id: arsverk
  type: begrep
  tittel: { nb: Årsverk, nn: Årsverk }
  tekst:
    nb: Et årsverk for lærere er 1687,5 timer, eller 1650 timer for lærere som er 60 år og eldre. Forskjellen er fem arbeidsdager ekstra ferie, så arbeidsåret er fem dager kortere. Planfestet tid er da samme andel av årsverket som for andre lærere. Alle arbeidsoppgavene skal gjøres innenfor årsverket.
    nn: Eit årsverk for lærarar er 1687,5 timar, eller 1650 timar for lærarar som er 60 år og eldre. Skilnaden er fem arbeidsdagar ekstra ferie, så arbeidsåret er fem dagar kortare. Planfesta tid er då same del av årsverket som for andre lærarar. Alle arbeidsoppgåvene skal gjerast innanfor årsverket.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: "4" }]
  kontrollert: null
  kontrollsporsmal:
    - "Stemmer det at forskjellen mellom 1687,5 og 1650 timer er fem arbeidsdager ekstra ferie?"
    - "Er det riktig at planfestet tid er samme andel av årsverket for lærere som er 60 år og eldre (1124,44 timer), eller kan fylket regne annerledes?"
  stikkord: ["1687,5", timer]
  relatert: [arbeidsar, planfestet-arbeidstid]

- id: arbeidsar
  type: begrep
  tittel: { nb: Arbeidsår, nn: Arbeidsår }
  tekst:
    nb: Arbeidsåret er elevenes skoleår og 6 dager à 7,5 timer til kompetanseutvikling, planlegging og lignende. Partene lokalt kan avtale flere dager. Arbeidsåret kan også utvides når planfestet tid går over 37,5 timer i uka.
    nn: Arbeidsåret er skuleåret til elevane og 6 dagar à 7,5 timar til kompetanseutvikling, planlegging og liknande. Partane lokalt kan avtale fleire dagar. Arbeidsåret kan også utvidast når planfesta tid går over 37,5 timar i veka.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "4" }
    - { id: ks-sfs2213-avtaletekst, punkt: "5.3" }
  kontrollert: null
  kontrollsporsmal:
    - "Kan «Arbeidsåret kan også utvides når planfestet tid går over 37,5 timer i uka» leses som at det gjelder alle lærere, og ikke bare ved funksjoner og andre oppgaver etter punkt 5.3?"
  stikkord: [planleggingsdager, skoleår]
  relatert: [arsverk, planfestet-arbeidstid]

- id: arsramme
  type: begrep
  tittel: { nb: Årsramme, nn: Årsramme }
  tekst:
    nb: Årsrammen er antallet undervisningstimer i et fag som utgjør en hel stilling i et helt skoleår. Årsrammene står i vedlegg 1 til SFS 2213, i 60- og 45-minutters enheter, og varierer med fag, utdanningsprogram og trinn. Har en time elever fra program eller nivåer med ulike årsrammer, brukes den laveste.
    nn: Årsramma er talet på undervisningstimar i eit fag som utgjer ei heil stilling i eit heilt skuleår. Årsrammene står i vedlegg 1 til SFS 2213, i 60- og 45-minutts einingar, og varierer med fag, utdanningsprogram og trinn. Har ein time elevar frå program eller nivå med ulike årsrammer, blir den lågaste brukt.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }]
  kontrollert: null
  kontrollsporsmal:
    - "Er regelen om laveste årsramme for grupper med elever fra ulike program eller nivåer gjengitt riktig og fullstendig?"
  stikkord: [vedlegg 1, årsrammetimer, blandet gruppe]
  relatert: [beskjeftigelse, stjernefag, minuttenheter]

- id: stjernefag
  type: begrep
  tittel: { nb: Fag merket *, nn: Fag merkte * }
  tekst:
    nb: Noen fellesfag er merket * i vedlegg 1. Er det faktiske antallet elever i klassen 1–15, økes årsrammen i disse fagene med 52,5 timer (70 i 45-minutters enheter). For læreren betyr en større årsramme at hver undervisningstime i faget gir lavere beskjeftigelse enn når klassen har flere enn 15 elever, og læreren må undervise flere timer for å fylle stillingen. Eksempel – 140 årstimer i naturfag på vg1 studieforberedende (årsramme 554) gir 140 ÷ 554 × 100 = 25,27 % med 16 elever eller flere, og 140 ÷ 606,5 × 100 = 23,08 % med 15 eller færre.
    nn: Nokre fellesfag er merkte * i vedlegg 1. Er det faktiske talet på elevar i klassen 1–15, blir årsramma i desse faga auka med 52,5 timar (70 i 45-minutts einingar). For læraren tyder ei større årsramme at kvar undervisningstime i faget gir lågare sysselsetjing enn når klassen har fleire enn 15 elevar, og læraren må undervise fleire timar for å fylle stillinga. Døme – 140 årstimar i naturfag på vg1 studieførebuande (årsramme 554) gir 140 ÷ 554 × 100 = 25,27 % med 16 elevar eller fleire, og 140 ÷ 606,5 × 100 = 23,08 % med 15 eller færre.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }]
  kontrollert: null
  kontrollsporsmal:
    - "Er «det faktiske antallet elever i klassen» tydelig nok for grupper som ikke er klasser, for eksempel valgfag på tvers av klasser?"
    - "Er det tydelig at større årsramme gir lavere beskjeftigelse per undervisningstime, og er eksemplet med naturfag riktig?"
  stikkord: [stjerne, små klasser, elevtall, beskjeftigelse]
  relatert: [arsramme, beskjeftigelse]

- id: minuttenheter
  type: begrep
  tittel: { nb: 60- og 45-minutters enheter, nn: 60- og 45-minutts einingar }
  tekst:
    nb: Årsrammene oppgis både i 60-minutters timer og i 45-minutters enheter, for eksempel 525/700. En økt på 45 minutter er 0,75 time på 60 minutter. Kalkulatorene i appen regner i 60-minutters timer.
    nn: Årsrammene blir oppgitt både i 60-minutts timar og i 45-minutts einingar, til dømes 525/700. Ei økt på 45 minutt er 0,75 time på 60 minutt. Kalkulatorane i appen reknar i 60-minutts timar.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }]
  kontrollert: null
  kontrollsporsmal:
    - "Kan det misforstås at kalkulatorene regner i 60-minutters timer når skolen bruker 45-minutters økter?"
  stikkord: [klokketimer, undervisningstimer, økt]
  relatert: [arsramme]

- id: beskjeftigelse
  type: begrep
  tittel: { nb: Beskjeftigelse, nn: Sysselsetjing }
  tekst:
    nb: Beskjeftigelse er hvor stor del av en hel stilling undervisningen utgjør, regnet som årstimer ÷ årsramme × 100. Undervisning i flere fag summeres. Beskjeftigelse og stillingsprosent er ikke alltid det samme, for eksempel når læreren også har funksjoner.
    nn: Sysselsetjing er kor stor del av ei heil stilling undervisninga utgjer, rekna som årstimar ÷ årsramme × 100. Undervisning i fleire fag blir summert. Sysselsetjing og stillingsprosent er ikkje alltid det same, til dømes når læraren også har funksjonar.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }]
  kontrollert: null
  kontrollsporsmal:
    - "Er formelen årstimer ÷ årsramme × 100 den samme som skolen og Visma InSchool bruker?"
    - "Er forskjellen mellom beskjeftigelse og stillingsprosent forklart godt nok?"
  stikkord: [undervisningsprosent, stillingsprosent, beskjæftigelse]
  relatert: [arsramme, periodebeskjeftigelse, fast-overtid]

- id: periodebeskjeftigelse
  type: begrep
  tittel: { nb: Periodebeskjeftigelse, nn: Periodesysselsetjing }
  tekst:
    nb: Periodebeskjeftigelse er beskjeftigelse for undervisning i bare en del av skoleåret, for eksempel i et vikariat. Årsrammen gjøres om til en perioderamme med periodenøkkelen, som er undervisningsdager i perioden delt på undervisningsdager i skoleåret.
    nn: Periodesysselsetjing er sysselsetjing for undervisning i berre ein del av skuleåret, til dømes i eit vikariat. Årsramma blir gjord om til ei perioderamme med periodenøkkelen, som er undervisningsdagar i perioden delt på undervisningsdagar i skuleåret.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }
    - { id: inschool-periodebeskjeftigelse }
  kontrollert: null
  kontrollsporsmal:
    - "Er periodenøkkelen (undervisningsdager i perioden ÷ undervisningsdager i skoleåret) forklart slik Visma InSchool regner?"
  stikkord: [periode, vikariat, periodenøkkel, perioderamme]
  relatert: [beskjeftigelse, arsramme]

- id: planfestet-arbeidstid
  type: begrep
  tittel: { nb: Planfestet arbeidstid, nn: Planfesta arbeidstid }
  tekst:
    nb: Planfestet arbeidstid er den delen av årsverket som står i oversikten over lærerens arbeidstid. I videregående skole er den 1150 timer, med mindre partene på skolen blir enige om noe annet. Den kan være høyst 9 timer per dag og 37,5 timer per uke, og brukes først og fremst til undervisning, annet elevrettet arbeid, for- og etterarbeid, faglig ajourføring, samarbeid og kontakt med foresatte og samarbeidsinstanser.
    nn: Planfesta arbeidstid er den delen av årsverket som står i oversikta over arbeidstida til læraren. I vidaregåande skule er ho 1150 timar, om ikkje partane på skulen blir samde om noko anna. Ho kan vere høgst 9 timar per dag og 37,5 timar per veke, og blir først og fremst brukt til undervisning, anna elevretta arbeid, før- og etterarbeid, fagleg ajourføring, samarbeid og kontakt med føresette og samarbeidsinstansar.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "5.1" }
    - { id: ks-sfs2213-avtaletekst, punkt: "5.2" }
  kontrollert: null
  kontrollsporsmal:
    - "Er listen over hva planfestet tid først og fremst brukes til, gjengitt riktig etter punkt 5.1?"
  stikkord: [bundet tid, bunden tid, tilstedeværelse, "1150"]
  relatert: [selvdisponert-tid, annet-elevrettet-arbeid, andre-arbeidsoppgaver]

- id: selvdisponert-tid
  type: begrep
  tittel: { nb: Tid læreren disponerer selv, nn: Tid læraren disponerer sjølv }
  tekst:
    nb: Den delen av årsverket som ikke er planfestet, disponerer læreren selv til for- og etterarbeid og faglig ajourføring. I videregående skole er det 1687,5 − 1150 = 537,5 timer i en hel stilling uten funksjoner. Den kalles ofte ikke-planfestet tid.
    nn: Den delen av årsverket som ikkje er planfesta, disponerer læraren sjølv til før- og etterarbeid og fagleg ajourføring. I vidaregåande skule er det 1687,5 − 1150 = 537,5 timar i ei heil stilling utan funksjonar. Ho blir ofte kalla ikkje-planfesta tid.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: "5.2" }]
  kontrollert: null
  kontrollsporsmal:
    - "Er 537,5 timer riktig for en hel stilling uten funksjoner, og er «ikke-planfestet tid» en betegnelse som brukes i fylket?"
  stikkord: [ikke-planfestet tid, ubundet tid, egentid]
  relatert: [planfestet-arbeidstid, for-og-etterarbeid]

- id: for-og-etterarbeid
  type: begrep
  tittel: { nb: For- og etterarbeid, nn: Før- og etterarbeid }
  tekst:
    nb: For- og etterarbeid er arbeid med å forberede og følge opp undervisningen. Det gjøres både i planfestet tid, alene og sammen med kolleger, og i tiden læreren disponerer selv.
    nn: Før- og etterarbeid er arbeid med å førebu og følgje opp undervisninga. Det blir gjort både i planfesta tid, åleine og saman med kollegaer, og i tida læraren disponerer sjølv.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "5.1" }
    - { id: ks-sfs2213-avtaletekst, punkt: "5.2" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at for- og etterarbeid gjøres både i planfestet tid og i tiden læreren disponerer selv?"
  stikkord: [forberedelse, vurderingsarbeid, retting]
  relatert: [planfestet-arbeidstid, selvdisponert-tid]

- id: annet-elevrettet-arbeid
  type: begrep
  tittel: { nb: Annet elevrettet arbeid, nn: Anna elevretta arbeid }
  tekst:
    nb: Annet elevrettet arbeid er blant det planfestet tid først og fremst brukes til (punkt 5.1). Annet elevrettet arbeid er ikke definert i avtalen. KS' FoU-rapport fra 2025 viser at begrepet tolkes ulikt, og at hva som regnes med, ofte blir avklart lokalt mellom skoleledelsen og de tillitsvalgte. Ifølge rapporten bruker de mye tid på å bli enige om hvilke elevrettede oppgaver som kan legges til planfestet tid, og hva som hører til tiden læreren disponerer selv. Rapporten viser også at kontaktlærere trenger mer tid til elevrettet arbeid, og at skoleledere ved yrkesfaglige skoler peker på uklarhet om oppfølging av elever og lærlinger utenfor skolen er elevrettet arbeid eller undervisning. I kravet ved forhandlingene om avtalen i 2025 skrev Utdanningsforbundet at begrepet ofte fylles med oppgaver som ikke hører til lærernes kjerneoppgaver, slik at det blir mindre tid til å forberede undervisning sammen, til felles utviklingsarbeid og til å følge opp elevene.
    nn: Anna elevretta arbeid er blant det planfesta tid først og fremst blir brukt til (punkt 5.1). Anna elevretta arbeid er ikkje definert i avtalen. FoU-rapporten til KS frå 2025 viser at omgrepet blir tolka ulikt, og at kva som blir rekna med, ofte blir avklart lokalt mellom skuleleiinga og dei tillitsvalde. Ifølgje rapporten bruker dei mykje tid på å bli samde om kva elevretta oppgåver som kan leggjast til planfesta tid, og kva som høyrer til tida læraren disponerer sjølv. Rapporten viser òg at kontaktlærarar treng meir tid til elevretta arbeid, og at skuleleiarar ved yrkesfaglege skular peikar på uklarleik om oppfølging av elevar og lærlingar utanfor skulen er elevretta arbeid eller undervisning. I kravet ved forhandlingane om avtalen i 2025 skreiv Utdanningsforbundet at omgrepet ofte blir fylt med oppgåver som ikkje høyrer til kjerneoppgåvene til lærarane, slik at det blir mindre tid til å førebu undervisning saman, til felles utviklingsarbeid og til å følgje opp elevane.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "5.1" }
    - { id: ks-fou-sfs2213, punkt: "s. 23, 38–39, 76 og 90" }
    - { id: udf-krav-sfs2213-2025, punkt: "Punkt 5.1 (s. 3)" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det nøytralt nok å si at hva som regnes med, ofte avklares lokalt?"
    - "Er KS-rapporten og Utdanningsforbundets krav fra 2025 gjengitt riktig og balansert?"
    - "Kildene gir få konkrete eksempler på annet elevrettet arbeid. Finnes det en kilde med flere eksempler (f.eks. tilsyn eller elevsamtaler) som bør tas med?"
  stikkord: [elevrettet, planfestet tid, oppfølging av elever, lærlinger, kjerneoppgaver]
  relatert: [planfestet-arbeidstid]

- id: andre-arbeidsoppgaver
  type: begrep
  tittel: { nb: Funksjoner og andre arbeidsoppgaver, nn: Funksjonar og andre arbeidsoppgåver }
  tekst:
    nb: Undervisningen kan reduseres etter avtale mellom læreren og rektor, slik at læreren kan gjøre andre oppgaver knyttet til undervisningen, for eksempel som kontaktlærer. Da reduseres tiden læreren disponerer selv med samme prosentandel, og planfestet tid øker tilsvarende. Går planfestet tid over 37,5 timer i uka, utvides arbeidsåret.
    nn: Undervisninga kan reduserast etter avtale mellom læraren og rektor, slik at læraren kan gjere andre oppgåver knytte til undervisninga, til dømes som kontaktlærar. Då blir tida læraren disponerer sjølv redusert med same prosentdel, og planfesta tid aukar tilsvarande. Går planfesta tid over 37,5 timar i veka, blir arbeidsåret utvida.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "5.3" }
    - { id: ks-sfs2213-avtaletekst, punkt: "7.3" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at tiden læreren disponerer selv, reduseres med samme prosentandel som undervisningen (punkt 5.3)?"
  stikkord: [funksjon, kontaktlærer, rådgiver, redusert undervisning]
  relatert: [planfestet-arbeidstid, arbeidsar]

- id: kalkulert-tid
  type: begrep
  tittel: { nb: Kalkulert tid, nn: Kalkulert tid }
  tekst:
    nb: Kalkulert tid er tiden som regnes for én undervisningstime med for- og etterarbeid når timelønn beregnes. Etter hovedtariffavtalen § 12.4 er det 1400 ÷ årsramme per time på 60 minutter, for eksempel 2,67 timer når årsrammen er 525.
    nn: Kalkulert tid er tida som blir rekna for éin undervisningstime med før- og etterarbeid når timeløn blir berekna. Etter hovudtariffavtalen § 12.4 er det 1400 ÷ årsramme per time på 60 minutt, til dømes 2,67 timar når årsramma er 525.
  kilder:
    - { id: ks-hovedtariffavtalen, punkt: Kap. 1 § 12.4 }
    - { id: inschool-vikartimer }
  kontrollert: null
  kontrollsporsmal:
    - "Er «kalkulert tid» et begrep som brukes i Visma InSchool eller lønnssystemet, eller bør det stå at det er appens navn?"
  stikkord: [timelønn, vikar, timevikar]
  relatert: [arsramme, fast-overtid]

- id: fast-overtid
  type: begrep
  tittel: { nb: Fast overtid, nn: Fast overtid }
  tekst:
    nb: Fast overtid kan avtales for en kortere eller lengre periode ved at årsrammen for undervisning økes. Overtidsbetaling gis for de timene årsrammen er økt med. Pålagt arbeid ut over oversikten over planfestet tid gir også overtidsgodtgjøring.
    nn: Fast overtid kan avtalast for ein kortare eller lengre periode ved at årsramma for undervisning blir auka. Overtidsbetaling blir gitt for dei timane årsramma er auka med. Pålagt arbeid utover oversikta over planfesta tid gir også overtidsgodtgjering.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "5.2" }
    - { id: ks-hovedtariffavtalen, punkt: Kap. 1 § 6 }
  kontrollert: null
  kontrollsporsmal:
    - "Er skillet mellom fast overtid (økt årsramme) og pålagt arbeid ut over oversikten over planfestet tid forklart riktig?"
  stikkord: [overtid, overtidsbetaling, over 100 prosent]
  relatert: [beskjeftigelse, kalkulert-tid, variabel-lonn]

- id: variabel-lonn
  type: begrep
  tittel: { nb: Variabel lønn, nn: Variabel løn }
  tekst:
    nb: Variabel lønn er lønn for undervisning som ikke er en del av en fast stilling. Den betales med timelønn for undervisning etter kalkulert tid (hovedtariffavtalen § 12.4). Timevikarer får variabel lønn for vikartimene. Har en lærer i deltidsstilling mer undervisning og funksjoner enn stillingen, gir det som er over stillingen og opp til hel stilling, også variabel lønn, uten overtidstillegg. Først det som er over hel stilling, er overtid. Om deltidsansatte skal ha overtidstillegg for arbeid ut over avtalt stillingsbrøk, er omstridt mellom partene.
    nn: Variabel løn er løn for undervisning som ikkje er ein del av ei fast stilling. Ho blir betalt med timeløn for undervisning etter kalkulert tid (hovudtariffavtalen § 12.4). Timevikarar får variabel løn for vikartimane. Har ein lærar i deltidsstilling meir undervisning og funksjonar enn stillinga, gir det som er over stillinga og opp til heil stilling, òg variabel løn, utan overtidstillegg. Først det som er over heil stilling, er overtid. Om deltidstilsette skal ha overtidstillegg for arbeid utover avtalt stillingsbrøk, er omstridt mellom partane.
  kilder:
    - { id: ks-hovedtariffavtalen, punkt: Kap. 1 § 6.2 }
    - { id: ks-hovedtariffavtalen, punkt: Kap. 1 § 12.4 }
    - { id: inschool-vikartimer, punkt: Kalkulert tid }
  kontrollert: null
  kontrollsporsmal:
    - "Er det nøytralt å si at overtidstillegg for deltidsansatte er omstridt mellom partene?"
    - "Betaler fylket fortsatt variabel lønn som vikartimer uten overtidstillegg?"
    - "Er det riktig at timevikarer får vikartimene utbetalt som variabel lønn?"
  stikkord: [merarbeid, deltid, deltidsansatt, timelønn, ekstra undervisning, timevikar, vikartimer]
  relatert: [fast-overtid, kalkulert-tid, teknisk-undertid-overtid, beskjeftigelse]

- id: planleggingsdager
  type: begrep
  tittel: { nb: Planleggingsdager, nn: Planleggingsdagar }
  tekst:
    nb: Arbeidsåret for lærere er elevenes skoleår og 6 dager, blant annet til planlegging og kompetanseutvikling. Disse dagene ligger utenom skoleukene og er planfestet tid. For en lærer i hel stilling er de 6 × 7,5 = 45 timer. Hvor mange timer en lærer i deltid eller i en periode skal ha, og hvor ferien for lærere over 60 år legges, avgjøres lokalt.
    nn: Arbeidsåret for lærarar er skuleåret til elevane og 6 dagar, mellom anna til planlegging og kompetanseutvikling. Desse dagane ligg utanom skulevekene og er planfesta tid. For ein lærar i heil stilling er dei 6 × 7,5 = 45 timar. Kor mange timar ein lærar i deltid eller i ein periode skal ha, og kvar ferien for lærarar over 60 år blir lagd, blir avgjort lokalt.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: 4 a }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at timene for deltid og perioder, og plasseringen av ferien for lærere over 60 år, avgjøres lokalt?"
  stikkord: [planleggingsdag, kompetanseutvikling, plandag, arbeidsår, 6 dager]
  relatert: [arbeidsar, planfestet-arbeidstid]

- id: delt-dagsverk
  type: begrep
  tittel: { nb: Delt dagsverk, nn: Delt dagsverk }
  tekst:
    nb: Delt dagsverk er når arbeidsdagen deles opp, slik at dagen med opphold og spisepauser strekker seg over 9 timer eller mer. Etter hovedtariffavtalen skal det bare brukes når det er nødvendig for forsvarlig drift, og det gir et tillegg per arbeidsdag.
    nn: Delt dagsverk er når arbeidsdagen blir delt opp, slik at dagen med opphald og matpausar strekkjer seg over 9 timar eller meir. Etter hovudtariffavtalen skal det berre brukast når det er nødvendig for forsvarleg drift, og det gir eit tillegg per arbeidsdag.
  kilder: [{ id: ks-hovedtariffavtalen, punkt: Kap. 1 § 5.5 }]
  kontrollert: null
  kontrollsporsmal:
    - "Er delt dagsverk (arbeidsdagen strekker seg over 9 timer eller mer) beskrevet riktig etter hovedtariffavtalen § 5.5?"
  stikkord: [oppdelt arbeidsdag]
  relatert: [arbeidstid]

- id: lokale-forhandlinger
  type: begrep
  tittel: { nb: Lokale forhandlinger om arbeidstid, nn: Lokale forhandlingar om arbeidstid }
  tekst:
    nb: SFS 2213 gir rom for at partene på skolen eller i fylkeskommunen avtaler andre ordninger, for eksempel annen planfestet tid, flere dager i arbeidsåret, andre årsrammer eller en mer fleksibel arbeidstidsordning. Protokollen fra 2026 oppfordrer partene til å bruke dette handlingsrommet. Når fylke eller skole er valgt i appen, brukes lokale verdier der de er lagt inn, og de merkes med nivå.
    nn: SFS 2213 gir rom for at partane på skulen eller i fylkeskommunen avtaler andre ordningar, til dømes anna planfesta tid, fleire dagar i arbeidsåret, andre årsrammer eller ei meir fleksibel arbeidstidsordning. Protokollen frå 2026 oppmodar partane til å bruke dette handlingsrommet. Når fylke eller skule er vald i appen, blir lokale verdiar brukte der dei er lagde inn, og dei blir merkte med nivå.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "4 b" }
    - { id: ks-sfs2213-avtaletekst, punkt: "5.1" }
    - { id: ks-sfs2213-avtaletekst, punkt: Protokoll 2026 }
  kontrollert: null
  kontrollsporsmal:
    - "Er protokollen fra 2026 og listen over hva partene kan avtale lokalt, gjengitt riktig?"
  stikkord: [lokal avtale, arbeidstidsavtale, partsenighet]
  relatert: [drofting, planfestet-arbeidstid]

- id: drofting
  type: begrep
  tittel: { nb: Drøftinger, nn: Drøftingar }
  tekst:
    nb: Drøftinger mellom arbeidsgiver og tillitsvalgte er regulert i hovedavtalen. SFS 2213 sier at innholdet i planleggingsdagene skal drøftes lokalt i tråd med hovedavtalen, og at fordelingen av tidsressurspotten drøftes på den enkelte skole.
    nn: Drøftingar mellom arbeidsgivar og tillitsvalde er regulerte i hovudavtalen. SFS 2213 seier at innhaldet i planleggingsdagane skal drøftast lokalt i tråd med hovudavtalen, og at fordelinga av tidsressurspotten blir drøfta på den enkelte skulen.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "4" }
    - { id: ks-sfs2213-avtaletekst, punkt: 7.3 a }
  kontrollert: null
  kontrollsporsmal:
    - "Er planleggingsdagene og tidsressurspotten de viktigste eksemplene på drøftinger i SFS 2213?"
  stikkord: [tillitsvalgte, medbestemmelse, hovedavtalen]
  relatert: [lokale-forhandlinger]

- id: teknisk-undertid-overtid
  type: begrep
  tittel: { nb: Teknisk undertid og teknisk overtid, nn: Teknisk undertid og teknisk overtid }
  tekst:
    nb: Når undervisning og funksjoner i stillingsplanen til sammen er mindre enn stillingsprosenten, har læreren teknisk undertid. Er de mer enn hel stilling, har læreren teknisk overtid for det som er over 100 %. Har læreren en stilling under 100 %, gir det som er over stillingen og opp til hel stilling variabel lønn. Differansen kan regnes om til årsrammetimer i et fag.
    nn: Når undervisning og funksjonar i stillingsplanen til saman er mindre enn stillingsprosenten, har læraren teknisk undertid. Er dei meir enn heil stilling, har læraren teknisk overtid for det som er over 100 %. Har læraren ei stilling under 100 %, gir det som er over stillinga og opp til heil stilling variabel løn. Differansen kan reknast om til årsrammetimar i eit fag.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }]
  kontrollert: null
  kontrollsporsmal:
    - "Er «teknisk undertid» og «teknisk overtid» begrepene fylket bruker?"
    - "Er det tydelig at variabel lønn bare gjelder stillinger under 100 %?"
  stikkord: [stillingsplan, undertid, overtid, differanse, variabel lønn, merarbeid, deltid]
  relatert: [beskjeftigelse, arsramme, variabel-lonn]

- id: livsfasetiltak
  type: begrep
  tittel: { nb: Livsfasetiltak (redusert undervisning), nn: Livsfasetiltak (redusert undervisning) }
  tekst:
    nb: Lærere har rett til å få redusert undervisningen med inntil 6 % det første yrkesåret etter fullført faglig og pedagogisk utdanning, inntil 6 % fra det kalenderåret de fyller 57 år, og inntil 12,5 % fra det kalenderåret de fyller 60 år. For nyutdannede og lærere over 60 år legges den frigjorte tiden i planfestet tid til for- og etterarbeid og faglig ajourføring, med mindre partene blir enige om noe annet. For lærere som er 60 år og eldre er årsverket 1650 timer, og arbeidsåret fem dager kortere.
    nn: Lærarar har rett til å få redusert undervisninga med inntil 6 % det første yrkesåret etter fullført fagleg og pedagogisk utdanning, inntil 6 % frå det kalenderåret dei fyller 57 år, og inntil 12,5 % frå det kalenderåret dei fyller 60 år. For nyutdanna og lærarar over 60 år blir den frigjorde tida lagd i planfesta tid til før- og etterarbeid og fagleg ajourføring, om ikkje partane blir samde om noko anna. For lærarar som er 60 år og eldre er årsverket 1650 timar, og arbeidsåret fem dagar kortare.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "4" }
    - { id: ks-sfs2213-avtaletekst, punkt: "6" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at den frigjorte tiden for nyutdannede og lærere over 60 år legges i planfestet tid, og er det tydelig at 57-åringer ikke er nevnt i den regelen?"
  stikkord: [redusert undervisning, seniorredusering, seniortiltak, nyutdannet, 57 år, 60 år]
  relatert: [arsverk, planfestet-arbeidstid, beskjeftigelse]

- id: kontaktlaerer
  type: begrep
  tittel: { nb: Kontaktlærer, nn: Kontaktlærar }
  tekst:
    nb: En lærer som utfører kontaktlærertjeneste i videregående opplæring, får redusert årsrammen for undervisning med minst 28,5 årsrammetimer (38 i 45-minutters enheter). For lærere med redusert undervisning på grunn av funksjon brukes årsrammen 607,5, så 28,5 årsrammetimer tilsvarer 4,69 % av en hel stilling. I tillegg gis det minst 12 000 kroner i året i godtgjøring for kontaktlærertjenesten.
    nn: Ein lærar som utfører kontaktlærarteneste i vidaregåande opplæring, får redusert årsramma for undervisning med minst 28,5 årsrammetimar (38 i 45-minutts einingar). For lærarar med redusert undervisning på grunn av funksjon blir årsramma 607,5 brukt, så 28,5 årsrammetimar svarar til 4,69 % av ei heil stilling. I tillegg blir det gitt minst 12 000 kroner i året i godtgjering for kontaktlærartenesta.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: 7.3 b }
    - { id: ks-sfs2213-avtaletekst, punkt: "9.1" }
    - { id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å gjøre 28,5 årsrammetimer om til prosent med årsrammen 607,5 (4,69 %)?"
  stikkord: [kontaktlærertjeneste, funksjon, reduksjon, "28,5 årsrammetimer"]
  relatert: [andre-arbeidsoppgaver, funksjonsgodtgjoring, arsramme]

- id: funksjonsgodtgjoring
  type: begrep
  tittel: { nb: Godtgjøring for funksjoner, nn: Godtgjering for funksjonar }
  tekst:
    nb: Lærere som har midlertidige funksjonsoppgaver, kan få et kronetillegg per år eller måned så lenge de har oppgavene. Tillegget kommer i tillegg til lønnen og er pensjonsgivende. Godtgjøringen fastsettes i forhandlinger. Avtalen setter minst 12 000 kroner i året for kontaktlærertjeneste og for rådgiver- eller sosiallærertjeneste. Godtgjøring for andre funksjoner fastsettes lokalt.
    nn: Lærarar som har mellombelse funksjonsoppgåver, kan få eit kronetillegg per år eller månad så lenge dei har oppgåvene. Tillegget kjem i tillegg til løna og er pensjonsgivande. Godtgjeringa blir fastsett i forhandlingar. Avtalen set minst 12 000 kroner i året for kontaktlærarteneste og for rådgivar- eller sosiallærarteneste. Godtgjering for andre funksjonar blir fastsett lokalt.
  kilder: [{ id: ks-sfs2213-avtaletekst, punkt: "9.1" }]
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at tillegget for funksjoner er pensjonsgivende?"
    - "Har fylket egne satser for andre funksjoner som appen bør vise når fylket er valgt?"
  stikkord: [funksjonstillegg, tillegg, kronetillegg, godtgjørelse, rådgiver, sosiallærer]
  relatert: [kontaktlaerer, andre-arbeidsoppgaver, lokale-forhandlinger]
