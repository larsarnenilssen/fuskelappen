# Begreper om læreplanverket: læreplanverket, fag- og timefordelingen, overordnet del, formålsparagrafen, kompetanse, grunnleggende ferdigheter
# og tverrfaglige temaer (pakke 6, avgjørelse 037). Bygger på overordnet del på udir.no. Egne ord, ikke kopiert.
- id: laereplanverket
  type: begrep
  tittel: { nb: Læreplanverket, nn: Læreplanverket }
  tekst:
    nb: Læreplanverket er grunnlaget for opplæringen i grunnskolen og videregående opplæring. Det består av tre deler – overordnet del, fag- og timefordelingen og læreplanene for fag. Overordnet del gir retning for opplæringen i alle fag, fag- og timefordelingen viser hvilke fag elevene skal ha og hvor mange timer, og læreplanene beskriver innholdet og målene i hvert fag. Delene henger sammen og skal brukes sammen. Læreplanverket har status som forskrift. Læreplanverket som gjelder nå, heter Kunnskapsløftet 2020 (LK20). Revisjonen som innføres nå, heter fagfornyelsen og viderefører LK20.
    nn: Læreplanverket er grunnlaget for opplæringa i grunnskulen og vidaregåande opplæring. Det består av tre delar – overordna del, fag- og timefordelinga og læreplanane for fag. Overordna del gir retning for opplæringa i alle fag, fag- og timefordelinga viser kva fag elevane skal ha og kor mange timar, og læreplanane beskriv innhaldet og måla i kvart fag. Delane heng saman og skal brukast saman. Læreplanverket har status som forskrift. Læreplanverket som gjeld no, heiter Kunnskapsløftet 2020 (LK20). Revisjonen som blir innført no, heiter fagfornyinga og vidarefører LK20.
  kilder:
    - { id: udir-lareplanverket, punkt: "Ingressen: «Læreplanverket består av …»", url: "https://www.udir.no/laring-og-trivsel/lareplanverket/" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 1.1 Læreplanverket for Kunnskapsløftet", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/1-hele-grunnopplaringen/1.1-lareplanverket/" }
    - { id: udir-overordnet-del, punkt: Om overordnet del, url: "https://www.udir.no/lk20/overordnet-del/om-overordnet-del/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «Revisjonen som innføres nå, heter fagfornyelsen og viderefører LK20» riktig formulert (eier 02.10.2026)?"
  stikkord: [LK20, Kunnskapsløftet, fagfornyelsen, læreplan, forskrift]
  relatert: [overordnet-del, fag-og-timefordeling, kompetanse, grunnleggende-ferdigheter, tverrfaglige-temaer]

- id: fag-og-timefordeling
  type: begrep
  tittel: { nb: Fag- og timefordelingen, nn: Fag- og timefordelinga }
  lenkeord: { nb: ["fag- og timefordeling"], nn: ["fag- og timefordeling"] }
  tekst:
    nb: Fag- og timefordelingen er en av de tre delene av læreplanverket, sammen med overordnet del og læreplanene for fag. Den viser hvilke fag elevene skal ha, og hvor mange timer hvert fag har. Udir gir den ut som rundskriv. Rundskrivet som gjelder nå, er Udir-1-2026, som erstatter Udir-1-2025. For videregående opplæring viser rundskrivet også tilbudsstrukturen. Udir skriver i rundskrivet at både læreplanene og tabellene med fag- og timefordelingen er forskrifter. Opplæringsløp i appen viser fagene og timene i hvert tilbud.
    nn: Fag- og timefordelinga er ein av dei tre delane av læreplanverket, saman med overordna del og læreplanane for fag. Ho viser kva fag elevane skal ha, og kor mange timar kvart fag har. Udir gir henne ut som rundskriv. Rundskrivet som gjeld no, er Udir-1-2026, som erstattar Udir-1-2025. For vidaregåande opplæring viser rundskrivet også tilbodsstrukturen. Udir skriv i rundskrivet at både læreplanane og tabellane med fag- og timefordelinga er forskrifter. Opplæringsløp i appen viser faga og timane i kvart tilbod.
  kilder:
    - { id: udir-lareplanverket, punkt: "Ingressen: «Læreplanverket består av …»", url: "https://www.udir.no/laring-og-trivsel/lareplanverket/" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 1.1 Læreplanverket for Kunnskapsløftet", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/1-hele-grunnopplaringen/1.1-lareplanverket/" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
    - { id: udir-fag-og-timefordeling-forside, punkt: "Teksten øverst: «Dette rundskrivet erstatter Rundskriv Udir-1-2025.»", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/" }
  kontrollert: null
  kontrollsporsmal:
    - "Udir skriver i punkt 1.1 at tabellene med fag- og timefordelingen er forskrifter, men det finnes ingen egen forskrift i Lovdata (eier 02.10.2026). I Udir-1-2025 varslet Udir at en forskrift om fag- og timefordeling og tilbudsstruktur skulle sendes på høring i 2026. Er det greit å gjengi det som «Udir skriver i rundskrivet at …» til en slik forskrift eventuelt kommer?"
    - "Det kommer som regel endringer hvert år, men det er usikkert om Udir må gi ut et nytt rundskriv hvert år (eier 02.10.2026). Er «Udir gir den ut som rundskriv» og navnet på rundskrivet som gjelder nå, nok?"
  stikkord: [Udir-1, rundskriv, timetall, årstimer, tilbudsstruktur, timefordeling]
  relatert: [laereplanverket, overordnet-del, utdanningsprogram, fellesfag]

- id: overordnet-del
  type: begrep
  tittel: { nb: Overordnet del, nn: Overordna del }
  tekst:
    nb: Overordnet del – verdier og prinsipper for grunnopplæringen – er den delen av læreplanverket som utdyper verdigrunnlaget i formålsparagrafen og prinsippene for opplæringen. Den har tre kapitler om verdigrunnlaget, om læring, utvikling og danning og om skolens praksis. Overordnet del gjelder hele grunnopplæringen, også opplæring i lærebedrift, og alle som arbeider i opplæringen, skal la den prege planleggingen og gjennomføringen. Den er fastsatt ved kongelig resolusjon med hjemmel i opplæringsloven § 1-4.
    nn: Overordna del – verdiar og prinsipp for grunnopplæringa – er den delen av læreplanverket som utdjupar verdigrunnlaget i formålsparagrafen og prinsippa for opplæringa. Ho har tre kapittel om verdigrunnlaget, om læring, utvikling og danning og om praksisen i skolen. Overordna del gjeld heile grunnopplæringa, også opplæring i lærebedrift, og alle som arbeider i opplæringa, skal la henne prege planlegginga og gjennomføringa. Ho er fastsett ved kongeleg resolusjon med heimel i opplæringslova § 1-4.
  kilder:
    - { id: udir-overordnet-del, punkt: Om overordnet del, url: "https://www.udir.no/lk20/overordnet-del/om-overordnet-del/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «alle som arbeider i opplæringen, skal la den prege planleggingen og gjennomføringen» en dekkende gjengivelse av hvem overordnet del retter seg mot?"
  stikkord: [verdier og prinsipper, verdigrunnlag, generell del, forskrift, kongelig resolusjon]
  relatert: [laereplanverket, formalsparagrafen, grunnleggende-ferdigheter, tverrfaglige-temaer]

- id: formalsparagrafen
  type: begrep
  tittel: { nb: Formålsparagrafen, nn: Formålsparagrafen }
  tekst:
    nb: Formålsparagrafen er opplæringsloven § 1-3, som sier hva opplæringen i skole og lærebedrift skal bidra til, blant annet verdier, kulturforståelse, demokrati, kritisk tenkning, medvirkning og at elever og lærlinger skal kunne mestre livene sine. Overordnet del utdyper verdigrunnlaget i formålsparagrafen og gjengir den i sin helhet.
    nn: Formålsparagrafen er opplæringslova § 1-3, som seier kva opplæringa i skule og lærebedrift skal bidra til, mellom anna verdiar, kulturforståing, demokrati, kritisk tenking, medverknad og at elevar og lærlingar skal kunne meistre liva sine. Overordna del utdjupar verdigrunnlaget i formålsparagrafen og gjengir han i heilskap.
  kilder:
    - { id: udir-overordnet-del, punkt: Formålet med opplæringen, url: "https://www.udir.no/lk20/overordnet-del/formalet-med-opplaringen/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er oppsummeringen av hva formålsparagrafen sier, dekkende uten å bli for lang?"
  stikkord: [formål, verdier, opplæringsloven, § 1-3, danning]
  relatert: [overordnet-del, laereplanverket]

- id: kompetanse
  type: begrep
  tittel: { nb: Kompetanse, nn: Kompetanse }
  lenkeord: { nb: [], nn: [] }
  tekst:
    nb: Læreplanene for fag bygger på en felles definisjon av kompetanse i overordnet del. Kompetanse er å kunne tilegne seg og bruke kunnskaper og ferdigheter til å mestre utfordringer og løse oppgaver, både i kjente og ukjente sammenhenger. Kompetanse innebærer også forståelse og evne til refleksjon og kritisk tenkning. Forståelsen av kompetanse skal ligge til grunn for arbeidet med læreplanene og for vurderingen av elevenes faglige kompetanse.
    nn: Læreplanane for fag byggjer på ein felles definisjon av kompetanse i overordna del. Kompetanse er å kunne tileigne seg og bruke kunnskapar og ferdigheiter til å meistre utfordringar og løyse oppgåver, både i kjende og ukjende samanhengar. Kompetanse inneber også forståing og evne til refleksjon og kritisk tenking. Forståinga av kompetanse skal liggje til grunn for arbeidet med læreplanane og for vurderinga av den faglege kompetansen til elevane.
  kilder:
    - { id: udir-overordnet-del, punkt: "2.2 Kompetanse i fagene", url: "https://www.udir.no/lk20/overordnet-del/prinsipper-for-laring-utvikling-og-danning/kompetanse-i-fagene/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det nyttig å nevne at kompetansebegrepet skal ligge til grunn for vurderingen av elevenes faglige kompetanse?"
  stikkord: [kompetansemål, kunnskap, dybdelæring, vurdering, refleksjon, kritisk tenkning]
  relatert: [laereplanverket, grunnleggende-ferdigheter]

- id: grunnleggende-ferdigheter
  type: begrep
  tittel: { nb: Grunnleggende ferdigheter, nn: Grunnleggjande ferdigheiter }
  tekst:
    nb: Læreplanverket har fem grunnleggende ferdigheter – lesing, skriving, regning, muntlige ferdigheter og digitale ferdigheter. De er en del av den faglige kompetansen og redskaper for å lære. Ferdighetene hører hjemme i alle fag, men fagene har ulikt ansvar for dem. Læreplanen i hvert fag beskriver hva ferdighetene innebærer i faget, og lærere i alle fag skal støtte elevene i arbeidet med dem. Fagarket i appen viser teksten fra læreplanen.
    nn: Læreplanverket har fem grunnleggjande ferdigheiter – lesing, skriving, rekning, munnlege ferdigheiter og digitale ferdigheiter. Dei er ein del av den faglege kompetansen og reiskapar for å lære. Ferdigheitene høyrer heime i alle fag, men faga har ulikt ansvar for dei. Læreplanen i kvart fag beskriv kva ferdigheitene inneber i faget, og lærarar i alle fag skal støtte elevane i arbeidet med dei. Fagarket i appen viser teksten frå læreplanen.
  kilder:
    - { id: udir-overordnet-del, punkt: "2.3 Grunnleggende ferdigheter", url: "https://www.udir.no/lk20/overordnet-del/prinsipper-for-laring-utvikling-og-danning/grunnleggende-ferdigheter/" }
    - { id: udir-grep, punkt: "Grunnleggende ferdigheter (GF1–GF5) i læreplanene" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «fagene har ulikt ansvar for dem» en dekkende gjengivelse av at enkelte fag har større ansvar enn andre?"
  stikkord: [lesing, skriving, regning, muntlige ferdigheter, digitale ferdigheter, lese, skrive, regne]
  relatert: [kompetanse, tverrfaglige-temaer, laereplanverket]

- id: tverrfaglige-temaer
  type: begrep
  tittel: { nb: Tverrfaglige temaer, nn: Tverrfaglege tema }
  lenkeord: { nb: ["tverrfaglige temaer", "tverrfaglig tema"], nn: ["tverrfaglege tema", "tverrfagleg tema"] }
  tekst:
    nb: Læreplanverket har tre tverrfaglige temaer – folkehelse og livsmestring, demokrati og medborgerskap, og bærekraftig utvikling. Temaene tar utgangspunkt i aktuelle samfunnsutfordringer, og elevene skal arbeide med dem gjennom problemstillinger fra ulike fag. I motsetning til de grunnleggende ferdighetene er temaene ikke med i alle fag. Målene står i kompetansemål i fagene der temaene er relevante, og læreplanen beskriver hva temaet innebærer i faget.
    nn: Læreplanverket har tre tverrfaglege tema – folkehelse og livsmeistring, demokrati og medborgarskap, og berekraftig utvikling. Temaa tek utgangspunkt i aktuelle samfunnsutfordringar, og elevane skal arbeide med dei gjennom problemstillingar frå ulike fag. I motsetnad til dei grunnleggjande ferdigheitene er temaa ikkje med i alle fag. Måla står i kompetansemål i faga der temaa er relevante, og læreplanen beskriv kva temaet inneber i faget.
  kilder:
    - { id: udir-overordnet-del, punkt: "2.5 Tverrfaglige temaer", url: "https://www.udir.no/lk20/overordnet-del/prinsipper-for-laring-utvikling-og-danning/tverrfaglige-temaer/" }
    - { id: udir-grep, punkt: "Tverrfaglige temaer (TT1–TT3) i læreplanene" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å si at temaene «ikke er med i alle fag», ut fra at målene står i kompetansemål i fagene der det er relevant?"
  stikkord: [folkehelse, livsmestring, demokrati, medborgerskap, bærekraftig utvikling, bærekraft]
  relatert: [grunnleggende-ferdigheter, overordnet-del, laereplanverket]

- id: laereplan
  type: begrep
  tittel: { nb: Læreplan i fag, nn: Læreplan i fag }
  lenkeord: { nb: ["læreplan"], nn: ["læreplan"] }
  tekst:
    nb: En læreplan i fag er forskriften som sier hva opplæringen i et fag skal inneholde. Den begynner med en del om faget, med fagets relevans og sentrale verdier, kjerneelementer, tverrfaglige temaer og grunnleggende ferdigheter. Så kommer kompetansemål og vurdering for hvert trinn, og til slutt vurderingsordningen, fagkodene og timetallet. Læreplanene er en av de tre delene av læreplanverket. Fag og læreplaner i appen viser innholdet fra Grep, med lenke til læreplanen på udir.no.
    nn: Ein læreplan i fag er forskrifta som seier kva opplæringa i eit fag skal innehalde. Han byrjar med ein del om faget, med relevansen og dei sentrale verdiane i faget, kjerneelement, tverrfaglege tema og grunnleggjande ferdigheiter. Så kjem kompetansemål og vurdering for kvart trinn, og til slutt vurderingsordninga, fagkodane og timetalet. Læreplanane er ein av dei tre delane av læreplanverket. Fag og læreplanar i appen viser innhaldet frå Grep, med lenkje til læreplanen på udir.no.
  kilder:
    - { id: udir-lk20, punkt: "Læreplan i norsk (NOR01‑08), innholdsfortegnelsen", url: "https://www.udir.no/lk20/nor01-08/" }
    - { id: opplaeringsforskrifta, punkt: "§ 5-1 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§5-1" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 1.1 Læreplanverket for Kunnskapsløftet", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/1-hele-grunnopplaringen/1.1-lareplanverket/" }
  kontrollert: null
  kontrollsporsmal:
    - "Lenkeordet er «læreplan», så «læreplanen» i en tekst lenker hit. Er det riktig, eller blir det for mange lenker?"
    - "Er rekkefølgen på delene i læreplanen beskrevet riktig, også for læreplaner i programfag og lærefag?"
  stikkord: [læreplanen, LK20, fagfornyelsen, kjerneelementer, om faget, forskrift]
  relatert: [laereplanverket, kompetansemal, vurderingsordning, fagkode, arstimetall]

- id: kompetansemal
  type: begrep
  tittel: { nb: Kompetansemål, nn: Kompetansemål }
  tekst:
    nb: Kompetansemålene i læreplanen sier hva eleven, lærlingen eller kandidaten skal kunne etter et trinn eller når opplæringen i faget er slutt. De er grunnlaget for vurderingen i faget og skal forstås i lys av teksten om faget i læreplanen. Elevene og de som har opplæring i bedrift, skal være kjent med læreplanen. Eksamen skal også være i samsvar med kompetansemålene. Fag og læreplaner i appen viser kompetansemålene for hvert fag.
    nn: Kompetansemåla i læreplanen seier kva eleven, lærlingen eller kandidaten skal kunne etter eit trinn eller når opplæringa i faget er slutt. Dei er grunnlaget for vurderinga i faget og skal forståast i lys av teksten om faget i læreplanen. Elevane og dei som har opplæring i bedrift, skal vere kjende med læreplanen. Eksamen skal også vere i samsvar med kompetansemåla. Fag og læreplanar i appen viser kompetansemåla for kvart fag.
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-1 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-1" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-25 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-25" }
    - { id: udir-lk20, punkt: "Læreplan i norsk (NOR01‑08), Kompetansemål og vurdering", url: "https://www.udir.no/lk20/nor01-08/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «eleven, lærlingen eller kandidaten» en dekkende måte å si hvem kompetansemålene gjelder for?"
    - "Bør begrepet også si at forutsetninger, fravær, orden og oppførsel ikke skal trekkes inn i vurderingen i fag (§ 9-1 tredje ledd)?"
  stikkord: [kompetansemålene, læreplan, vurdering, grunnlag for vurdering, § 9-1]
  relatert: [laereplan, kompetanse, sluttvurdering, vurderingsordning]

- id: fagkode
  type: begrep
  tittel: { nb: Fagkode, nn: Fagkode }
  tekst:
    nb: En fagkode er koden for et fag på et bestemt trinn og nivå, for eksempel NOR1267 for norsk hovedmål skriftlig på Vg3 studieforberedende. Ett fag kan ha flere koder, for eksempel én for skriftlig og én for muntlig. Udir fastsetter fagkodene i Grep, og bare de kan føres på vitnemål og kompetansebevis. Hver læreplan har en liste over fagkodene sine, og under Fag og læreplaner i appen kan du søke på fagkoden.
    nn: Ein fagkode er koden for eit fag på eit bestemt trinn og nivå, til dømes NOR1267 for norsk hovudmål skriftleg på Vg3 studieførebuande. Eitt fag kan ha fleire kodar, til dømes éin for skriftleg og éin for munnleg. Udir fastset fagkodane i Grep, og berre dei kan førast på vitnemål og kompetansebevis. Kvar læreplan har ei liste over fagkodane sine, og under Fag og læreplanar i appen kan du søkje på fagkoden.
  kilder:
    - { id: udir-regbok-oversikt, punkt: "A04 Fagkode (definisjon og utfyllende kommentar)", url: "https://regbok.udir.no/felt/?Id=1014304" }
    - { id: udir-lk20, punkt: "Læreplan i norsk (NOR01‑08), Fagkoder", url: "https://www.udir.no/lk20/nor01-08/fagkoder" }
    - { id: udir-grep, punkt: Fagkoder }
  kontrollert: null
  kontrollsporsmal:
    - "Er eksemplet med NOR1267 og skriftlig og muntlig godt valgt, eller bør eksemplet være et programfag?"
  stikkord: [fagkoder, NOR1267, Grep, VIGO, kode, vitnemål]
  relatert: [laereplan, fagmerknader, vitnemal-og-kompetansebevis]

- id: arstimetall
  type: begrep
  tittel: { nb: Årstimetall, nn: Årstimetal }
  lenkeord: { nb: ["årstimetall", "årstime"], nn: ["årstimetal", "årstimetall", "årstime"] }
  tekst:
    nb: Årstimetallet er antallet timer et fag har i løpet av et skoleår på et trinn, regnet i 60-minutters enheter. Det står i fag- og timefordelingen og under Timetall i læreplanen. Fraværsgrensen på 10 prosent regnes av årstimetallet i faget. Årstimetallet er noe annet enn årsrammen i SFS 2213, som er antallet undervisningstimer i faget som utgjør en hel stilling for læreren.
    nn: Årstimetalet er talet på timar eit fag har i løpet av eit skoleår på eit trinn, rekna i 60-minutts einingar. Det står i fag- og timefordelinga og under Timetal i læreplanen. Fråværsgrensa på 10 prosent blir rekna av årstimetalet i faget. Årstimetalet er noko anna enn årsramma i SFS 2213, som er talet på undervisningstimar i faget som utgjer ei heil stilling for læraren.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 1.2 60-minutters enheter", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/1-hele-grunnopplaringen/1.260-minutters-enheter/" }
    - { id: udir-lk20, punkt: "Læreplan i norsk (NOR01‑08), Timetall", url: "https://www.udir.no/lk20/nor01-08/timetall" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-8 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-8" }
