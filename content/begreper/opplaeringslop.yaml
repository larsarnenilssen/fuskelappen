# Begreper om opplæringsløpet i videregående: utdanningsprogram, programområder, trinn og fagtyper.
# Fagarket viser dem med «i» (pakke 4, OPPDRAG 1.4). Bygger på rundskrivet Udir-1-2026, vedlegg 1, kapittel 3,
# og forskriften om yrkesfaglig fordypning. Egne ord, ikke kopiert.
- id: utdanningsprogram
  type: begrep
  tittel: { nb: Utdanningsprogram, nn: Utdanningsprogram }
  tekst:
    nb: Utdanningsprogrammene er den øverste inndelingen av videregående opplæring. Det er fem studieforberedende utdanningsprogram (studiespesialisering, idrettsfag, musikk, dans og drama, kunst, design og arkitektur, og medier og kommunikasjon) og ti yrkesfaglige. Hvert utdanningsprogram er delt inn i trinn og programområder. Vg3 påbygging til generell studiekompetanse er et tilbud innenfor de yrkesfaglige utdanningsprogrammene, selv om Grep har det som et eget utdanningsprogram.
    nn: Utdanningsprogramma er den øvste inndelinga av vidaregåande opplæring. Det er fem studieførebuande utdanningsprogram (studiespesialisering, idrettsfag, musikk, dans og drama, kunst, design og arkitektur, og medium og kommunikasjon) og ti yrkesfaglege. Kvart utdanningsprogram er delt inn i trinn og programområde. Vg3 påbygging til generell studiekompetanse er eit tilbod innanfor dei yrkesfaglege utdanningsprogramma, sjølv om Grep har det som eit eige utdanningsprogram.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.5 Studieforberedende tilbud innenfor yrkesfaglige utdanningsprogram", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.5studieforberedende-i-yrkesfag/" }
  kontrollert: null
  kontrollsporsmal:
    - "Påbygging regnes som et tilbud innenfor yrkesfag (eier 01.10.2026). Er setningen om dette riktig formulert?"
  stikkord: [studieforberedende, yrkesfaglig, yrkesfag, tilbudsstruktur, Vilbli]
  relatert: [programomrade, trinn-vg, fellesfag, tilbudsstruktur]

- id: programomrade
  type: begrep
  tittel: { nb: Programområde, nn: Programområde }
  tekst:
    nb: Et programområde er et tilbud på ett trinn i et utdanningsprogram, for eksempel vg2 helsearbeiderfag. Tilbudsstrukturen viser hvilke programområder som finnes på vg1, vg2, vg3 og i opplæring i bedrift, og hvilke som bygger på hverandre. Hvert programområde har en kode, for eksempel HSHEA2----. Noen programområder på vg2 tar også inn elever fra vg1 i et annet utdanningsprogram. Det kalles kryssløp.
    nn: Eit programområde er eit tilbod på eitt trinn i eit utdanningsprogram, til dømes vg2 helsearbeidarfag. Tilbodsstrukturen viser kva programområde som finst på vg1, vg2, vg3 og i opplæring i bedrift, og kva som byggjer på kvarandre. Kvart programområde har ein kode, til dømes HSHEA2----. Nokre programområde på vg2 tek også inn elevar frå vg1 i eit anna utdanningsprogram. Det blir kalla kryssløp.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
    - { id: udir-regbok-programomradekode, punkt: "A03 Programområdekode" }
    - { id: udir-grep, punkt: Programområder }
  kontrollert: null
  kontrollsporsmal:
    - "Er «et tilbud på ett trinn i et utdanningsprogram» en dekkende forklaring av programområde?"
  stikkord: [tilbud, programområdekode, kryssløp, vg2, vg3]
  relatert: [utdanningsprogram, trinn-vg, krysslop]

- id: trinn-vg
  type: begrep
  tittel: { nb: "Vg1, vg2 og vg3", nn: "Vg1, vg2 og vg3" }
  lenkeord: { nb: [], nn: [] }
  tekst:
    nb: Opplæringen i skole er normalt delt i videregående trinn 1, 2 og 3 (vg1, vg2 og vg3), og hvert trinn varer normalt ett skoleår. På yrkesfag er hovedmodellen to år i skole (vg1 og vg2) og to år i bedrift, der det ene året er opplæring og det andre verdiskaping. Noen løp avsluttes med vg3 i skole, og noen har bare vg1 i skole og tre års læretid (særløp).
    nn: Opplæringa i skule er normalt delt i vidaregåande trinn 1, 2 og 3 (vg1, vg2 og vg3), og kvart trinn varer normalt eitt skuleår. På yrkesfag er hovudmodellen to år i skule (vg1 og vg2) og to år i bedrift, der det eine året er opplæring og det andre verdiskaping. Nokre løp blir avslutta med vg3 i skule, og nokre har berre vg1 i skule og tre års læretid (særløp).
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4 og 3.4.3 Særløp", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er hovedmodellen for yrkesfag (to år i skole og to år i bedrift, der ett år er verdiskaping) beskrevet riktig?"
  stikkord: [vg1, vg2, vg3, trinn, årstrinn, hovedmodellen, særløp]
  relatert: [programomrade, opplaering-i-bedrift]

- id: fellesfag
  type: begrep
  tittel: { nb: Fellesfag, nn: Fellesfag }
  tekst:
    nb: Fellesfag er obligatoriske fag på både studieforberedende og yrkesfaglige utdanningsprogram, for eksempel norsk, engelsk, matematikk og naturfag. Kravet til fellesfag er større på studieforberedende utdanningsprogram. Elever med opplæring i samisk, tegnspråk, kvensk eller finsk har egne læreplaner eller ordninger i noen fellesfag. Årsrammen for et fellesfag i vedlegg 1 til SFS 2213 kan være ulik på ulike utdanningsprogram og trinn.
    nn: Fellesfag er obligatoriske fag på både studieførebuande og yrkesfaglege utdanningsprogram, til dømes norsk, engelsk, matematikk og naturfag. Kravet til fellesfag er større på studieførebuande utdanningsprogram. Elevar med opplæring i samisk, teiknspråk, kvensk eller finsk har eigne læreplanar eller ordningar i nokre fellesfag. Årsramma for eit fellesfag i vedlegg 1 til SFS 2213 kan vere ulik på ulike utdanningsprogram og trinn.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur (Fellesfag, felles programfag og programfag)", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4.1 Fellesfag", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
    - { id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig og nyttig å nevne at årsrammen for et fellesfag kan være ulik på ulike utdanningsprogram og trinn?"
  stikkord: [obligatorisk, norsk, engelsk, matematikk, naturfag, samfunnskunnskap, kroppsøving]
  relatert: [felles-programfag, programfag, arsramme]

- id: felles-programfag
  type: begrep
  tittel: { nb: Felles programfag, nn: Felles programfag }
  tekst:
    nb: Felles programfag er fag som er obligatoriske på et bestemt utdanningsprogram eller programområde. Alle utdanningsprogram har felles programfag, unntatt studiespesialisering. På yrkesfag har elevene ordinært 954 timer felles programfag fra eget programområde på vg1 og vg2 til sammen.
    nn: Felles programfag er fag som er obligatoriske på eit bestemt utdanningsprogram eller programområde. Alle utdanningsprogram har felles programfag, unnateke studiespesialisering. På yrkesfag har elevane ordinært 954 timar felles programfag frå eige programområde på vg1 og vg2 til saman.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur (Fellesfag, felles programfag og programfag)", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4.2 Vg1 og vg2 i skole", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er 954 timer felles programfag på vg1 og vg2 til sammen riktig for alle yrkesfaglige utdanningsprogram?"
  stikkord: [obligatorisk, programfag, yrkesfag]
  relatert: [fellesfag, programfag, programomrade]

- id: programfag
  type: begrep
  tittel: { nb: Programfag og valgfrie programfag, nn: Programfag og valfrie programfag }
  lenkeord: { nb: ["programfag", "valgfrie programfag"], nn: ["programfag", "valfrie programfag"] }
  tekst:
    nb: Programfag er fag som hører til et bestemt utdanningsprogram. Valgfrie programfag er programfag elevene velger selv, for eksempel matematikk R1 eller biologi 1 på studiespesialisering. Hvilke fag skolen tilbyr, bestemmer fylkeskommunen. Elever på yrkesfag kan også ta programfag fra studieforberedende utdanningsprogram i yrkesfaglig fordypning.
    nn: Programfag er fag som høyrer til eit bestemt utdanningsprogram. Valfrie programfag er programfag elevane vel sjølve, til dømes matematikk R1 eller biologi 1 på studiespesialisering. Kva fag skulen tilbyr, avgjer fylkeskommunen. Elevar på yrkesfag kan også ta programfag frå studieførebuande utdanningsprogram i yrkesfagleg fordjuping.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur (Fellesfag, felles programfag og programfag)", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
    - { id: udir-yff-forskrift, punkt: "3.1.3" }
    - { id: udir-grep, punkt: Fagtype }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å si at fylkeskommunen bestemmer hvilke valgfrie programfag skolen tilbyr?"
  stikkord: [valgfritt, valgfag, programfag, studiespesialisering, R1, fordypning]
  relatert: [felles-programfag, yrkesfaglig-fordypning, utdanningsprogram]

- id: yrkesfaglig-fordypning
  type: begrep
  tittel: { nb: Yrkesfaglig fordypning (YFF), nn: Yrkesfagleg fordjuping (YFF) }
  lenkeord: { nb: ["yrkesfaglig fordypning"], nn: ["yrkesfagleg fordjuping"] }
  tekst:
    nb: >-
      Yrkesfaglig fordypning er et obligatorisk fag på vg1 og vg2 i de yrkesfaglige utdanningsprogrammene, ordinært
      168 timer på vg1 og 253 timer på vg2. Elever med samisk, finsk eller tegnspråk har færre timer. Faget skal gi
      elevene et godt grunnlag for å velge lærefag og mulighet til å knytte kontakt med lærebedrifter.


      Faget har ingen egen nasjonal læreplan. Timene brukes normalt til kompetansemål fra læreplanene for vg3 i skole
      og opplæring i bedrift, i eget eller et annet utdanningsprogram. Skoleeier lager lokale læreplaner som viser
      hvilke nasjonale kompetansemål som ligger til grunn. På vg2 i bygg- og anleggsteknikk, håndverk, design og
      produktutvikling og frisør, blomster, interiør og eksponeringsdesign kan timene ikke brukes til kompetansemål
      fra andre utdanningsprogram.


      Timene kan også brukes til fellesfag fra vg3 påbygging, fellesfag i fremmedspråk
      eller programfag fra de studieforberedende utdanningsprogrammene. Da gjelder læreplanen og timetallet for det
      faget.


      Eleven får standpunktkarakter fra skolen for den delen som følger lokal læreplan, og har ikke eksamen i
      den.
    nn: >-
      Yrkesfagleg fordjuping er eit obligatorisk fag på vg1 og vg2 i dei yrkesfaglege utdanningsprogramma, ordinært
      168 timar på vg1 og 253 timar på vg2. Elevar med samisk, finsk eller teiknspråk har færre timar. Faget skal gi
      elevane eit godt grunnlag for å velje lærefag og moglegheit til å knyte kontakt med lærebedrifter.


      Faget har ingen eigen nasjonal læreplan. Timane blir normalt brukte til kompetansemål frå læreplanane for vg3 i
      skule og opplæring i bedrift, i eige eller eit anna utdanningsprogram. Skuleeigar lagar lokale læreplanar som
      viser kva nasjonale kompetansemål som ligg til grunn. På vg2 i bygg- og anleggsteknikk, handverk, design og
      produktutvikling og frisør, blomster, interiør og eksponeringsdesign kan timane ikkje brukast til kompetansemål
      frå andre utdanningsprogram.


      Timane kan også brukast til fellesfag frå vg3 påbygging, fellesfag i framandspråk
      eller programfag frå dei studieførebuande utdanningsprogramma. Då gjeld læreplanen og timetalet for det faget.


      Eleven får standpunktkarakter frå skulen for den delen som følgjer lokal læreplan, og har ikkje eksamen i han.
  kilder:
    - { id: udir-yff-forskrift, punkt: "1 Formålet, 2 Omfang, 3 Valg av innhold og 4 Vurdering" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4.2 Yrkesfaglig fordypning", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er forklaringen av hva timene kan brukes til, riktig og dekkende etter forskriften punkt 3?"
    - "Rundskrivet sier 421 timer på vg1 og vg2 til sammen, forskriften 168 + 253. Er det riktig å oppgi timene per trinn?"
    - "Er det nyttig å nevne at elever med særskilt rett til eksamen (forskriften punkt 4.1) skal opp til praktisk eksamen, eller er det for detaljert?"
  stikkord: [YFF, fordypning, lokal læreplan, lærefag, lærebedrift, vg3-kompetansemål]
  relatert: [programfag, opplaering-i-bedrift, pabygging]

- id: opplaering-i-bedrift
  type: begrep
  tittel: { nb: Lærefag og opplæring i bedrift, nn: Lærefag og opplæring i bedrift }
  lenkeord: { nb: ["opplæring i bedrift", "lærefag"], nn: ["opplæring i bedrift", "lærefag"] }
  tekst:
    nb: Et lærefag fører fram til fag- eller svennebrev. I hovedmodellen har lærlingen to år i skole (vg1 og vg2) og deretter to års læretid i bedrift, der ett år er opplæring og ett år verdiskaping. Læreplanene for opplæring i bedrift har kompetansemål på vg3-nivå. Noen lærefag har bare vg1 i skole og tre års læretid (særløp), og noen har vg3 i skole før læretiden. Lærlinger som tar opplæring i bedrift som ellers gis i skole, kan være fritatt fra kroppsøving og yrkesfaglig fordypning.
    nn: Eit lærefag fører fram til fag- eller sveinebrev. I hovudmodellen har lærlingen to år i skule (vg1 og vg2) og deretter to års læretid i bedrift, der eitt år er opplæring og eitt år verdiskaping. Læreplanane for opplæring i bedrift har kompetansemål på vg3-nivå. Nokre lærefag har berre vg1 i skule og tre års læretid (særløp), og nokre har vg3 i skule før læretida. Lærlingar som tek opplæring i bedrift som elles blir gitt i skule, kan vere fritekne frå kroppsøving og yrkesfagleg fordjuping.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1, 3.4.3, 3.4.4 og 3.4.5", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det dekkende å si at lærlinger «kan være fritatt» fra kroppsøving og yrkesfaglig fordypning, eller bør vilkårene i 3.4.3 og 3.4.5 stå?"
  stikkord: [lærling, læretid, fagbrev, svennebrev, særløp, verdiskaping, bedrift]
  relatert: [trinn-vg, yrkesfaglig-fordypning, programomrade]

- id: pabygging
  type: begrep
  tittel: { nb: Påbygging til generell studiekompetanse, nn: Påbygging til generell studiekompetanse }
  lenkeord: { nb: ["påbygging"], nn: ["påbygging"] }
  tekst:
    nb: Vg3 påbygging til generell studiekompetanse er et år for elever som har fullført vg1 og vg2 på et yrkesfaglig utdanningsprogram. Det har ordinært minst 841 timer, med 701 timer fellesfag og 140 timer programfag fra studieforberedende utdanningsprogram. Har eleven brukt timer i yrkesfaglig fordypning til fellesfag eller programfag, endres fagene på vg3. Den som har bestått fag- og yrkesopplæring, har rett til påbygging etter fag- eller svennebrevet (vg4). Retten varer ut skoleåret som starter det året vedkommende fyller 24 år. Etter det gjelder reglene for voksne.
    nn: Vg3 påbygging til generell studiekompetanse er eit år for elevar som har fullført vg1 og vg2 på eit yrkesfagleg utdanningsprogram. Det har ordinært minst 841 timar, med 701 timar fellesfag og 140 timar programfag frå studieførebuande utdanningsprogram. Har eleven brukt timar i yrkesfagleg fordjuping til fellesfag eller programfag, blir faga på vg3 endra. Den som har bestått fag- og yrkesopplæring, har rett til påbygging etter fag- eller sveinebrevet (vg4). Retten varer ut skuleåret som tek til det året vedkomande fyller 24 år. Etter det gjeld reglane for vaksne.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.5.2 og 3.5.3", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.5studieforberedende-i-yrkesfag/" }
    - { id: udir-regbok-programomradekode, punkt: "A03 Programområdekode (PBPBY4)" }
    - { id: opplaeringslova, punkt: "§ 5-7 Påbygging til generell studiekompetanse", url: "https://lovdata.no/lov/2023-06-09-30/§5-7" }
  kontrollert: null
  kontrollsporsmal:
    - "Retten til vg4 påbygging følger nå loven (§ 5-7: ut skoleåret som starter det året man fyller 24, og så reglene for voksne), etter eiers svar 06.10.2026. Udir-1 3.5.3 sier «innen utgangen av året». Er teksten riktig, og bør unntakene for praksiskandidater nevnes?"
  stikkord: [påbygg, vg3 påbygging, vg4, generell studiekompetanse, PBPBY4]
  relatert: [yrkesfaglig-fordypning, utdanningsprogram, opplaering-i-bedrift]

- id: krysslop
  type: begrep
  tittel: { nb: Kryssløp, nn: Kryssløp }
  tekst:
    nb: Kryssløp betyr at et programområde på vg2 også tar inn elever fra vg1 i et annet utdanningsprogram, for eksempel fra vg1 studiespesialisering. Hvilke kryssløp som gjelder, står i tilbudsstrukturen. Vg1-fagene gir da et tilstrekkelig grunnlag for vg2-fagene, så eleven trenger ikke yrkesfaglig opphenting. Elever som har tatt vg1 studiespesialisering, har allerede fellesfagene for vg2 på yrkesfag, unntatt kroppsøving, og skal ha andre fag i stedet. Bytter en elev fra vg1 studiespesialisering til et vg2 på yrkesfag som ikke er et kryssløp, brukes timene til faget yrkesfaglig opphenting.
    nn: Kryssløp tyder at eit programområde på vg2 også tek inn elevar frå vg1 i eit anna utdanningsprogram, til dømes frå vg1 studiespesialisering. Kva kryssløp som gjeld, står i tilbodsstrukturen. Vg1-faga gir då eit tilstrekkeleg grunnlag for vg2-faga, så eleven treng ikkje yrkesfagleg opphenting. Elevar som har teke vg1 studiespesialisering, har alt fellesfaga for vg2 på yrkesfag, unnateke kroppsøving, og skal ha andre fag i staden. Byter ein elev frå vg1 studiespesialisering til eit vg2 på yrkesfag som ikkje er eit kryssløp, blir timane brukte til faget yrkesfagleg opphenting.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 og 3.4.2 Tilpassede ordninger", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
  kontrollert: null
  kontrollsporsmal:
    - "Teksten er skrevet om etter eiers svar 01.10.2026: kryssløp krever ikke yrkesfaglig opphenting, som er for elever som bytter fra vg1 studiespesialisering til et vg2 som ikke er et kryssløp. Er den nå riktig?"
  stikkord: [kryssløp, yrkesfaglig opphenting, YFO, studiespesialisering]
  relatert: [programomrade, utdanningsprogram]

# Begreper om skoler, læretid i bedrift og opplæringskontorer (eier 03.10.2026, avgjørelse 053). Bygger på
# opplæringslova kapittel 5 og 7 og Udir-1-2026. Egne ord, ikke kopiert.
- id: opplaeringskontor
  type: begrep
  tittel: { nb: Opplæringskontor, nn: Opplæringskontor }
  tekst:
    nb: Et opplæringskontor er et samarbeidsorgan for lærebedrifter. Lærebedrifter som er knyttet til et opplæringskontor, kan avtale at kontoret inngår lærekontrakten og tar imot tilskuddet til opplæringen på vegne av bedriften. Udirs register for fag- og yrkesopplæring (NOR) viser hvilke fylker hvert opplæringskontor er godkjent i.
    nn: Eit opplæringskontor er eit samarbeidsorgan for lærebedrifter. Lærebedrifter som er knytte til eit opplæringskontor, kan avtale at kontoret inngår lærekontrakten og tek imot tilskotet til opplæringa på vegner av bedrifta. Registeret til Udir for fag- og yrkesopplæring (NOR) viser kva fylke kvart opplæringskontor er godkjent i.
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-12 Samarbeidsorgan for lærebedrifter (opplæringskontor)", url: "https://lovdata.no/lov/2023-06-09-30/§7-12" }
    - { id: udir-nor, punkt: "Relasjonen «Godkjent i fylker struktur»" }
  kontrollert: null
  kontrollsporsmal:
    - "Når opplæringskontoret har inngått lærekontrakten (§ 7-12), hvem har da ansvaret for opplæringen etter § 7-6 første ledd: kontoret eller bedriften der lærlingen arbeider? Bør begrepet si noe om det?"
    - "Loven sier ikke hva opplæringskontorene vanligvis gjør. Bør begrepet likevel si det, for eksempel at de følger opp lærlinger og instruktører?"
  stikkord: [opplæringskontoret, samarbeidsorgan, lærekontrakt, tilskudd, NOR]
  relatert: [laerebedrift, kontrakt-om-opplaering, laerling]

- id: laerebedrift
  type: begrep
  tittel: { nb: Lærebedrift, nn: Lærebedrift }
  tekst:
    nb: En lærebedrift er en bedrift som fylkeskommunen har godkjent til å gi opplæring i bedrift. Før fylkeskommunen godkjenner bedriften, må yrkesopplæringsnemnda vurdere den faglig, og fylkeskommunen skal legge avgjørende vekt på den vurderingen. Lærebedriften skal gi opplæring etter læreplanene i lærefaget og ha minst én faglig kvalifisert person med ansvar for opplæringen og én eller flere instruktører. Den kan avtale at deler av opplæringen skjer i en annen lærebedrift, men ansvaret ligger hos lærebedriften som kontrakten om opplæring er inngått med.
    nn: Ei lærebedrift er ei bedrift som fylkeskommunen har godkjent til å gi opplæring i bedrift. Før fylkeskommunen godkjenner bedrifta, må yrkesopplæringsnemnda vurdere ho fagleg, og fylkeskommunen skal leggje avgjerande vekt på den vurderinga. Lærebedrifta skal gi opplæring etter læreplanane i lærefaget og ha minst éin fagleg kvalifisert person med ansvar for opplæringa og éin eller fleire instruktørar. Ho kan avtale at delar av opplæringa skjer i ei anna lærebedrift, men ansvaret ligg hos lærebedrifta som kontrakten om opplæring er inngått med.
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-5 Godkjenning av lærebedrifter", url: "https://lovdata.no/lov/2023-06-09-30/§7-5" }
    - { id: opplaeringslova, punkt: "§ 7-6 Krav til lærebedrifter", url: "https://lovdata.no/lov/2023-06-09-30/§7-6" }
  kontrollert: null
  kontrollsporsmal:
    - "Godkjennes en lærebedrift for bestemte lærefag? § 7-5 sier det ikke direkte, så begrepet nevner det ikke. Bør det stå?"
  stikkord: [lærebedrifta, godkjenning, yrkesopplæringsnemnd, instruktør, faglig leder]
  relatert: [opplaeringskontor, kontrakt-om-opplaering, laerling, opplaering-i-bedrift]

- id: laerling
  type: begrep
  tittel: { nb: Lærling, nn: Lærling }
  tekst:
    nb: En lærling har skrevet en lærekontrakt med sikte på fagprøve eller svenneprøve i et fag med læretid. Opplæringslova har fire grupper som har læretid i bedrift. I tillegg til lærlingen er det praksisbrevkandidaten, som har en opplæringskontrakt med sikte på praksisbrevprøve, lærekandidaten, som har en opplæringskontrakt med sikte på en mindre omfattende prøve enn fag- eller svenneprøve, og kandidaten for fagbrev på jobb, som har en kontrakt om opplæring på grunnlag av allsidig praksis og realkompetanse, med sikte på fag- eller svenneprøve. Når fylkeskommunen har ansvaret for opplæringen, gjelder reglene for elever også for lærlinger, praksisbrevkandidater og lærekandidater.
    nn: Ein lærling har skrive ein lærekontrakt med sikte på fagprøve eller sveineprøve i eit fag med læretid. Opplæringslova har fire grupper som har læretid i bedrift. I tillegg til lærlingen er det praksisbrevkandidaten, som har ein opplæringskontrakt med sikte på praksisbrevprøve, lærekandidaten, som har ein opplæringskontrakt med sikte på ei mindre omfattande prøve enn fag- eller sveineprøve, og kandidaten for fagbrev på jobb, som har ein kontrakt om opplæring på grunnlag av allsidig praksis og realkompetanse, med sikte på fag- eller sveineprøve. Når fylkeskommunen har ansvaret for opplæringa, gjeld reglane for elevar også for lærlingar, praksisbrevkandidatar og lærekandidatar.
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-1 andre, tredje og fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-1" }
  kontrollert: null
  kontrollsporsmal:
    - "Loven (på nynorsk) skriver «sveineprøve». Er «svenneprøve» riktig på bokmål i appen?"
    - "Er setningen om at reglene for elever gjelder for lærlinger, praksisbrevkandidater og lærekandidater når fylkeskommunen har ansvaret (§ 7-1 tredje ledd), forståelig uten mer forklaring?"
  stikkord: [lærlinger, lærekandidat, praksisbrevkandidat, fagbrev på jobb, læretid, fagprøve, svenneprøve]
  relatert: [kontrakt-om-opplaering, laerebedrift, opplaering-i-bedrift, sluttkompetanse]

- id: kontrakt-om-opplaering
  type: begrep
  tittel: { nb: Kontrakt om opplæring, nn: Kontrakt om opplæring }
  lenkeord: { nb: [lærekontrakt, opplæringskontrakt], nn: [lærekontrakt, opplæringskontrakt] }
  tekst:
    nb: Den som skal ha læretid i bedrift, skal skrive kontrakt om opplæring med en lærebedrift før opplæringen begynner. For lærlingen heter den lærekontrakt, og for praksisbrevkandidaten og lærekandidaten opplæringskontrakt. Kontrakten sier hva som er målet for opplæringen og hvem som har ansvaret for de ulike delene av den, og viser til arbeidsavtalen. Fylkeskommunen skal godkjenne kontrakten, og den kan bare endres når fylkeskommunen samtykker. Kontrakten gjelder fra opplæringen begynner, selv om godkjenningen kommer senere. Fylkeskommunen kan godkjenne kontrakter som avviker fra det fastsatte opplæringsløpet. Kontrakten kan sies opp når partene er enige, og lærebedriften skal da orientere fylkeskommunen skriftlig først. Fylkeskommunen hever kontrakten når den som har læretid, sier skriftlig fra at hen ikke vil fortsette, og kan heve den ved vesentlige brudd på pliktene eller når en av partene ikke kan oppfylle den. Lærebedriften skriver ut en attest for opplæringen som er gjennomført, og arbeidsavtalen faller bort.
    nn: Den som skal ha læretid i bedrift, skal skrive kontrakt om opplæring med ei lærebedrift før opplæringa tek til. For lærlingen heiter han lærekontrakt, og for praksisbrevkandidaten og lærekandidaten opplæringskontrakt. Kontrakten seier kva som er målet for opplæringa og kven som har ansvaret for dei ulike delane av ho, og viser til arbeidsavtalen. Fylkeskommunen skal godkjenne kontrakten, og han kan berre endrast når fylkeskommunen samtykkjer. Kontrakten gjeld frå opplæringa tek til, sjølv om godkjenninga kjem seinare. Fylkeskommunen kan godkjenne kontraktar som avvik frå det fastsette opplæringsløpet. Kontrakten kan seiast opp når partane er samde, og lærebedrifta skal då orientere fylkeskommunen skriftleg først. Fylkeskommunen hevar kontrakten når den som har læretid, seier skriftleg frå at han eller ho ikkje vil halde fram, og kan heve han ved vesentlege brot på pliktene eller når ein av partane ikkje kan oppfylle han. Lærebedrifta skriv ut ein attest for opplæringa som er gjennomført, og arbeidsavtalen fell bort.
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-1 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-1" }
    - { id: opplaeringslova, punkt: "§ 7-2 Inngåing og endring av kontrakt om opplæring", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
    - { id: opplaeringslova, punkt: "§ 7-3 Heving og oppseiing av kontrakt om opplæring", url: "https://lovdata.no/lov/2023-06-09-30/§7-3" }
    - { id: opplaeringslova, punkt: "§ 7-4 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Lagt til etter eiers svar 06.10.2026: Er setningene om oppsigelse og heving (ol. § 7-3 og § 7-4 fjerde ledd) riktige og dekkende?"
    - "Er det dekkende å si at kontrakten heter lærekontrakt for lærlinger og opplæringskontrakt for praksisbrevkandidater og lærekandidater (§ 7-1 fjerde ledd)?"
  stikkord: [lærekontrakt, opplæringskontrakt, kontrakt, godkjenning, arbeidsavtale, oppsigelse, heving, attest]
  relatert: [laerling, laerebedrift, opplaeringskontor]

- id: generell-studiekompetanse
  type: begrep
  tittel: { nb: Generell studiekompetanse, nn: Generell studiekompetanse }
  tekst:
    nb: Generell studiekompetanse er det vanlige grunnlaget for opptak til høyere utdanning. Kravene omfatter disse fagene fra videregående opplæring, med timer per fag, norsk (393), engelsk (140), matematikk (224), naturfag (140), samfunnskunnskap (84) og historie (140). For elever på yrkesfag betyr det normalt norsk 280 timer, matematikk 140, naturfag 84 og historie 140 i tillegg til vg1 og vg2. Den som har bestått fag- og yrkesopplæring, har rett til påbygging ut skoleåret som begynner det året en fyller 24 år, og deretter etter reglene for voksne.
    nn: Generell studiekompetanse er det vanlege grunnlaget for opptak til høgare utdanning. Krava omfattar desse faga frå vidaregåande opplæring, med timar per fag, norsk (393), engelsk (140), matematikk (224), naturfag (140), samfunnskunnskap (84) og historie (140). For elevar på yrkesfag betyr det normalt norsk 280 timar, matematikk 140, naturfag 84 og historie 140 i tillegg til vg1 og vg2. Den som har bestått fag- og yrkesopplæring, har rett til påbygging ut skuleåret som tek til det året ein fyller 24 år, og deretter etter reglane for vaksne.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.5.4 Generell studiekompetanse", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.5studieforberedende-i-yrkesfag/" }
    - { id: opplaeringslova, punkt: "§ 5-7 Påbygging til generell studiekompetanse", url: "https://lovdata.no/lov/2023-06-09-30/§5-7" }
  kontrollert: null
  kontrollsporsmal:
    - "Udir-1 punkt 3.5.4 sier at disse fagene «inngår i kravene». Er listen fullstendig, eller bør begrepet si «blant annet»?"
    - "Er timene for elever på yrkesfag (norsk 280, matematikk 140, naturfag 84 og historie 140 i tillegg til vg1 og vg2) riktig gjengitt etter Udir-1 punkt 3.5.4?"
  stikkord: [studiekompetanse, høyere utdanning, opptak, påbygging, 24 år]
  relatert: [pabygging, sluttkompetanse, utdanningsprogram]

- id: yrkesfaglig-opphenting
  type: begrep
  tittel: { nb: Yrkesfaglig opphenting, nn: Yrkesfagleg opphenting }
  lenkeord: { nb: [yrkesfaglig opphenting, opphentingsfag], nn: [yrkesfagleg opphenting, opphentingsfag] }
  tekst:
    nb: Yrkesfaglig opphenting er et fag på 196 timer på vg2 yrkesfag for elever som kommer fra vg1 studiespesialisering. Disse elevene har allerede hatt alle fellesfagene yrkesfagelevene har på vg2, unntatt kroppsøving, og bruker timene til yrkesfaglig opphenting i stedet. Over de to årene skal omfanget være minst 1 824 timer. Opplæringsløp viser hvilke vg2 yrkesfag elevene kan begynne på etter vg1 studiespesialisering.
    nn: Yrkesfagleg opphenting er eit fag på 196 timar på vg2 yrkesfag for elevar som kjem frå vg1 studiespesialisering. Desse elevane har alt hatt alle fellesfaga yrkesfagelevane har på vg2, unnateke kroppsøving, og bruker timane til yrkesfagleg opphenting i staden. Over dei to åra skal omfanget vere minst 1 824 timar. Opplæringsløp viser kva vg2 yrkesfag elevane kan byrje på etter vg1 studiespesialisering.
  kilder:
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4.2 Vg1 og vg2 i skole", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
    - { id: udir-grep, punkt: "YFO2002 Yrkesfaglig opphenting" }
  kontrollert: null
  kontrollsporsmal:
    - "Gjelder yrkesfaglig opphenting alle vg2 yrkesfag eleven kan tas inn til fra vg1 studiespesialisering etter tilbudsstrukturen?"
  stikkord: [opphenting, opphentingsfag, YFO2002, studiespesialisering, vg2, kryssløp]
  relatert: [krysslop, felles-programfag, programomrade]

# Veiene til fag- og svennebrev, praksisbrev og kompetansebevis, og formidling til læreplass (fase 6). Bygger på
# opplæringslova kapittel 5, 7 og § 23-2 og opplæringsforskrifta kapittel 6, 7 og 9, og på oversikten over veiene i
# docs/arbeidsordrer/fase-6-forslag.md. Egne ord, ikke kopiert.
- id: praksisbrev
  type: begrep
  tittel: { nb: Praksisbrev, nn: Praksisbrev }
  lenkeord: { nb: [praksisbrev, praksisbrevkandidat], nn: [praksisbrev, praksisbrevkandidat] }
  tekst:
    nb: >-
      Praksisbrev er dokumentasjonen på bestått praksisbrevprøve. En praksisbrevkandidat har skrevet en
      opplæringskontrakt med sikte på praksisbrevprøven, og opplæringen følger en lokal læreplan i faget.
      Fylkeskommunen kan godkjenne en slik kontrakt som avviker fra det fastsatte opplæringsløpet. Fylkeskommunen
      lager praksisbrevprøven og sørger for at den blir vurdert, ut fra kompetansemålene i den lokale læreplanen.
      Lærebedriften melder opp kandidaten. Kandidaten må ha bestått alle relevante fag og eksamener, men kan ta prøven
      selv om ett fellesfag ikke er bestått, og må da bestå det etterpå for å få praksisbrevet.
    nn: >-
      Praksisbrev er dokumentasjonen på bestått praksisbrevprøve. Ein praksisbrevkandidat har skrive ein
      opplæringskontrakt med sikte på praksisbrevprøva, og opplæringa følgjer ein lokal læreplan i faget.
      Fylkeskommunen kan godkjenne ein slik kontrakt som vik av frå det fastsette opplæringsløpet. Fylkeskommunen
      lagar praksisbrevprøva og sørgjer for at ho blir vurdert, ut frå kompetansemåla i den lokale læreplanen.
      Lærebedrifta melder opp kandidaten. Kandidaten må ha bestått alle relevante fag og eksamenar, men kan ta prøva
      sjølv om eitt fellesfag ikkje er bestått, og må då bestå det etterpå for å få praksisbrevet.
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-1 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-1" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-3 første ledd bokstav e", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-64", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-64" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-48 første ledd, § 9-56 første ledd og § 9-57", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-57" }
  kontrollert: null
  kontrollsporsmal:
    - "Forskriften sier at praksisbrevprøven bygger på en lokal læreplan (§ 9-64 andre ledd), ikke direkte at opplæringen gjør det. Er det riktig å si at opplæringen følger en lokal læreplan?"
    - "Paragrafene begrepet bygger på, sier ikke hvor lang opplæringen vanligvis er, eller at praksisbrevet kan bygges videre til fag- eller svennebrev. Bør begrepet si det, med en annen kilde?"
    - "Både «praksisbrev» og «praksisbrevkandidat» lenker til begrepet. Er det greit, eller bør praksisbrevkandidat få eget begrep?"
  stikkord: [praksisbrevkandidat, praksisbrevprøve, opplæringskontrakt, lokal læreplan]
  relatert: [kontrakt-om-opplaering, laerling, sluttkompetanse, fag-og-svenneprove, formidling-til-laereplass]

- id: laerekandidat
  type: begrep
  tittel: { nb: Lærekandidat, nn: Lærekandidat }
  tekst:
    nb: >-
      En lærekandidat har skrevet en opplæringskontrakt med sikte på en mindre omfattende prøve enn fag- eller
      svenneprøven. Prøven heter kompetanseprøve, og kandidaten prøves i de målene som er fastsatt for opplæringen
      hans eller hennes. Fylkeskommunen lager prøven og gir kompetansebevis. En elev kan bli lærekandidat etter
      grunnskolen, etter Vg1 eller Vg2, eller ved å endre kontrakten med samtykke fra fylkeskommunen. For å bli
      formidlet som lærekandidat til neste trinn må søkeren ha bestått sitt individuelle opplæringsløp, men også den
      som har gjennomført Vg1 og Vg2 uten å bestå fagene, kan søke. Lærekandidater har rett til individuell
      tilrettelegging.
    nn: >-
      Ein lærekandidat har skrive ein opplæringskontrakt med sikte på ei mindre omfattande prøve enn fag- eller
      sveineprøva. Prøva heiter kompetanseprøve, og kandidaten blir prøvd i dei måla som er fastsette for opplæringa
      hans eller hennar. Fylkeskommunen lagar prøva og gir kompetansebevis. Ein elev kan bli lærekandidat etter
      grunnskolen, etter Vg1 eller Vg2, eller ved å endre kontrakten med samtykke frå fylkeskommunen. For å bli
      formidla som lærekandidat til neste trinn må søkjaren ha bestått sitt individuelle opplæringsløp, men også den
      som har gjennomført Vg1 og Vg2 utan å bestå faga, kan søkje. Lærekandidatar har rett til individuell
      tilrettelegging.
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-1 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-1" }
    - { id: opplaeringslova, punkt: "§ 7-2 andre og fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
    - { id: opplaeringslova, punkt: "§ 7-4 sjette ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-4" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-3 første ledd bokstav c og § 7-3 tredje og fjerde ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-64 og § 9-51 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-64" }
  kontrollert: null
  kontrollsporsmal:
    - "Eier har sagt at en elev «når som helst» kan bli lærekandidat. Det står ikke ordrett i kildene, så begrepet sier «etter grunnskolen, etter Vg1 eller Vg2, eller ved å endre kontrakten» (ol. § 7-2, ofo. § 6-3 bokstav c og § 7-3). Er det dekkende?"
    - "§ 9-64 andre ledd viser til opplæringslova § 7-4 sjette ledd for målene, men det leddet handler om individuell tilrettelegging. Er det greit å si bare at målene er fastsatt for kandidaten?"
    - "Er det riktig at lærekandidaten får kompetansebevis (§ 9-51 tredje ledd), og ikke et eget kompetansebrev?"
    - "Tidligere læretid eller praksis godskrives for lærekandidater etter en konkret vurdering (§ 6-9 tredje ledd). Bør det stå?"
  stikkord: [lærekandidater, kompetanseprøve, kompetansebevis, opplæringskontrakt, opplæringsmål]
  relatert: [kontrakt-om-opplaering, laerling, vitnemal-og-kompetansebevis, individuell-tilrettelegging, formidling-til-laereplass]

- id: praksiskandidat
  type: begrep
  tittel: { nb: Praksiskandidat, nn: Praksiskandidat }
  tekst:
    nb: >-
      En praksiskandidat tar fag- eller svenneprøven på grunnlag av allsidig praksis i lærefaget, uten opplæring i
      skole eller bedrift. Praksisen må være 25 prosent lengre enn det fastsatte opplæringsløpet i faget.
      Fylkeskommunen avgjør om praksisen kan godkjennes, og kan i særlige tilfeller godkjenne kortere praksis.
      Praksis kan også godkjennes etter en samlet vurdering når den dekker de viktigste delene av læreplanen for
      opplæring i bedrift. Kandidaten melder seg selv til fylkeskommunen innen fristen den setter, og betaler
      prøveavgift. Skal kandidaten ha eksamen etter læreplanverket, gjelder reglene for eksamen. Praksiskandidater
      trenger ikke fellesfag for å få fag- eller svennebrev.
    nn: >-
      Ein praksiskandidat tek fag- eller sveineprøva på grunnlag av allsidig praksis i lærefaget, utan opplæring i
      skule eller bedrift. Praksisen må vere 25 prosent lengre enn det fastsette opplæringsløpet i faget.
      Fylkeskommunen avgjer om praksisen kan godkjennast, og kan i særlege tilfelle godkjenne kortare praksis.
      Praksis kan også godkjennast etter ei samla vurdering når han dekkjer dei viktigaste delane av læreplanen for
      opplæring i bedrift. Kandidaten melder seg sjølv til fylkeskommunen innan fristen han set, og betaler
      prøveavgift. Skal kandidaten ha eksamen etter læreplanverket, gjeld reglane for eksamen. Praksiskandidatar
      treng ikkje fellesfag for å få fag- eller sveinebrev.
  kilder:
    - { id: opplaeringslova, punkt: "§ 23-2", url: "https://lovdata.no/lov/2023-06-09-30/§23-2" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-9 første og andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-9" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-25 tredje ledd og § 9-56 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-56" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-48 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-48" }
  kontrollert: null
  kontrollsporsmal:
    - "§ 9-25 tredje ledd sier at eksamensreglene gjelder for praksiskandidater som etter læreplanverket skal ha eksamen. Har praksiskandidater vanligvis en skriftlig eksamen før fag- eller svenneprøven, og bør begrepet si det rett ut?"
    - "Er det riktig å forklare § 6-9 andre ledd (samlet vurdering av praksisen) som en egen vei til godkjenning ved siden av «25 prosent lengre» i loven?"
    - "Bør begrepet nevne forskjellen fra fagbrev på jobb (der kandidaten har kontrakt og opplæring i en lærebedrift)?"
  stikkord: [praksiskandidater, allsidig praksis, praksiskandidatordningen, prøveavgift, fagprøve, svenneprøve]
  relatert: [fagbrev-pa-jobb, fag-og-svenneprove, privatist, realkompetansevurdering]

- id: fagbrev-pa-jobb
  type: begrep
  tittel: { nb: Fagbrev på jobb, nn: Fagbrev på jobb }
  lenkeord: { nb: [fagbrev på jobb], nn: [fagbrev på jobb] }
  tekst:
    nb: >-
      En kandidat for fagbrev på jobb har skrevet en kontrakt om opplæring på grunnlag av allsidig praksis og
      realkompetanse, med sikte på fag- eller svenneprøve. Før kontrakten skrives, må kandidaten ha minst ett års
      allsidig praksis i lærefaget i heltidsstilling. Deltid regnes om til full stilling, og 80 prosent kan godkjennes
      som heltid. Hvor lang praksis kandidaten må ha før prøven, avhenger av lengden på lærefaget, for de fleste fag
      fire år i heltid. Fylkeskommunen trekker fra året med praksis og eventuell realkompetanse, men kontraktstiden må
      være minst ett år. Lærebedriften melder opp kandidaten, og kandidaten trenger ikke fellesfag for å få fag- eller
      svennebrev. Se [opplæringsforskrifta § 9-58](#/lov/opplaeringsforskrifta/9-58).
    nn: >-
      Ein kandidat for fagbrev på jobb har skrive ein kontrakt om opplæring på grunnlag av allsidig praksis og
      realkompetanse, med sikte på fag- eller sveineprøve. Før kontrakten blir skriven, må kandidaten ha minst eitt års
      allsidig praksis i lærefaget i heiltidsstilling. Deltid blir rekna om til full stilling, og 80 prosent kan
      godkjennast som heiltid. Kor lang praksis kandidaten må ha før prøva, avheng av lengda på lærefaget, for dei
      fleste fag fire år i heiltid. Fylkeskommunen trekkjer frå året med praksis og eventuell realkompetanse, men
      kontraktstida må vere minst eitt år. Lærebedrifta melder opp kandidaten, og kandidaten treng ikkje fellesfag for
      å få fag- eller sveinebrev. Sjå [opplæringsforskrifta § 9-58](#/lov/opplaeringsforskrifta/9-58).
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-1 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-1" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-58", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-58" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-48 tredje ledd og § 9-56 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-48" }
  kontrollert: null
  kontrollsporsmal:
    - "§ 9-58 tredje ledd sier «lærekontrakten», mens loven kaller det kontrakt om opplæring (§ 7-1). Er det greit å bruke «kontrakt om opplæring»?"
    - "Opplæringslova § 7-1 tredje ledd nevner ikke kandidater for fagbrev på jobb blant dem reglene for elever gjelder for. Bør begrepet si det?"
    - "Ordningen er i praksis for voksne i arbeid, men det står ikke i loven eller forskriften. Bør det stå?"
  stikkord: [fagbrev på jobb, allsidig praksis, realkompetanse, voksne, kontrakt om opplæring, fagprøve]
  relatert: [praksiskandidat, laerling, kontrakt-om-opplaering, fag-og-svenneprove, realkompetansevurdering]

- id: vg3-i-skole
  type: begrep
  tittel: { nb: Vg3 i skole, nn: Vg3 i skule }
  lenkeord: { nb: [vg3 i skole], nn: [vg3 i skule, vg3 i skole] }
  tekst:
    nb: >-
      Vg3 i skole er opplæring på videregående trinn 3 som elev, ikke som læretid i bedrift. Søkere som oppfyller
      vilkårene for å bli formidlet til læretid, men ikke får læreplass, har rett til et annet opplæringstilbud på
      vg3, bygd på programområdet de har fullført på vg2. Tilbudet skal starte så snart som mulig og senest 1.
      oktober, og fylkeskommunen skal fortsatt prøve å formidle til læreplass dem som ønsker det. Skolen melder opp
      eleven til fag- eller svenneprøven. Noen lærefag har også vg3 i skole som en fast del av opplæringsløpet.
    nn: >-
      Vg3 i skule er opplæring på vidaregåande trinn 3 som elev, ikkje som læretid i bedrift. Søkjarar som oppfyller
      vilkåra for å bli formidla til læretid, men ikkje får læreplass, har rett til eit anna opplæringstilbod på
      vg3, bygd på programområdet dei har fullført på vg2. Tilbodet skal starte så snart som mogleg og seinast 1.
      oktober, og fylkeskommunen skal framleis prøve å formidle til læreplass dei som ønskjer det. Skulen melder opp
      eleven til fag- eller sveineprøva. Nokre lærefag har også vg3 i skule som ein fast del av opplæringsløpet.
  kilder:
    - { id: opplaeringslova, punkt: "§ 5-6", url: "https://lovdata.no/lov/2023-06-09-30/§5-6" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-2", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-2" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-56 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-56" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4 og 3.4.3", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
  kontrollert: null
  kontrollsporsmal:
    - "Loven og forskriften sier «eit anna opplæringstilbod på vidaregåande trinn 3», ikke at det er i skole. Er det riktig å kalle det vg3 i skole, og at det fører til fag- eller svenneprøve som elev (§ 9-56 første ledd)?"
    - "«Vg3 i skole» lenker til begrepet også der det står om lærefag som har vg3 i skole i det vanlige løpet. Er det greit at begrepet dekker begge, eller bør det bare gjelde tilbudet til dem uten læreplass?"
  stikkord: [vg3, alternativ vg3, uten læreplass, læreplass, fagopplæring i skole, fagprøve]
  relatert: [formidling-til-laereplass, opplaering-i-bedrift, trinn-vg, fag-og-svenneprove]

- id: formidling-til-laereplass
  type: begrep
  tittel: { nb: Formidling til læreplass, nn: Formidling til læreplass }
  lenkeord: { nb: [formidling til læreplass, formidling], nn: [formidling til læreplass, formidling] }
  tekst:
    nb: >-
      Formidling til læreplass er fylkeskommunens arbeid med å skaffe søkere en læreplass i bedrift. Den som vil bli
      lærling, lærekandidat eller praksisbrevkandidat, kan søke om formidling på fylkeskommunens skjema og må oppgi
      hvilken av dem. For å bli formidlet som lærling må søkeren oppfylle vilkårene for inntak til neste trinn. De
      som blir formidlet, tas inn til videregående opplæring på trinnet. Fylkeskommunen gir en lokal forskrift om
      formidling, som også sier hvordan søknader etter fristen behandles. Får søkeren ikke læreplass, har søkeren
      rett til et annet tilbud på vg3.
    nn: >-
      Formidling til læreplass er arbeidet fylkeskommunen gjer for å skaffe søkjarar ein læreplass i bedrift. Den som
      vil bli lærling, lærekandidat eller praksisbrevkandidat, kan søkje om formidling på skjemaet til
      fylkeskommunen og må oppgi kva for ein av dei. For å bli formidla som lærling må søkjaren oppfylle vilkåra for
      inntak til neste trinn. Dei som blir formidla, blir tekne inn til vidaregåande opplæring på trinnet.
      Fylkeskommunen gir ei lokal forskrift om formidling, som også seier korleis søknader etter fristen blir
      behandla. Får ikkje søkjaren læreplass, har søkjaren rett til eit anna tilbod på vg3.
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 7-1 til § 7-3", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-1" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-2", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-2" }
    - { id: opplaeringslova, punkt: "§ 5-6", url: "https://lovdata.no/lov/2023-06-09-30/§5-6" }
  kontrollert: null
  kontrollsporsmal:
    - "Forskriften definerer ikke formidling. Er «fylkeskommunens arbeid med å skaffe søkere en læreplass i bedrift» en god forklaring?"
    - "Både «formidling til læreplass» og «formidling» alene lenker til begrepet. Brukes «formidling» om noe annet i appen, så bare den lange formen bør lenke?"
    - "Bør begrepet si at fylkeskommunen skal fortsette å prøve å formidle søkere som har begynt på et annet tilbud (§ 6-2 andre ledd)?"
  stikkord: [formidling, læreplass, søke læreplass, lærling, lærekandidat, praksisbrevkandidat]
  relatert: [laerling, laerekandidat, praksisbrev, laerebedrift, vg3-i-skole]

- id: tilbudsstruktur
  type: begrep
  tittel: { nb: Tilbudsstruktur, nn: Tilbodsstruktur }
  lenkeord: { nb: ["tilbudsstruktur"], nn: ["tilbodsstruktur", "tilbudsstruktur"] }
  tekst:
    nb: Tilbudsstrukturen er oversikten over utdanningsprogrammene, programområdene og lærefagene i videregående opplæring, altså hvilke løp som fører fram til studiekompetanse eller yrkeskompetanse. Departementet fastsetter den med hjemmel i opplæringslova § 1-6, og opplæringen skal være i samsvar med den. Udir gir den ut sammen med fag- og timefordelingen. Fylkeskommunen velger hvilke tilbud skolene i fylket skal ha, og skal legge stor vekt på hvilken kompetanse samfunnet trenger. Opplæringstilbud i appen viser løpene.
    nn: Tilbodsstrukturen er oversikta over utdanningsprogramma, programområda og lærefaga i vidaregåande opplæring, altså kva løp som fører fram til studiekompetanse eller yrkeskompetanse. Departementet fastset han med heimel i opplæringslova § 1-6, og opplæringa skal vere i samsvar med han. Udir gir han ut saman med fag- og timefordelinga. Fylkeskommunen vel kva tilbod skolane i fylket skal ha, og skal leggje stor vekt på kva kompetanse samfunnet treng. Opplæringstilbod i appen viser løpa.
  kilder:
    - { id: opplaeringslova, punkt: "§ 1-6 tredje ledd", url: "https://lovdata.no/lov/2023-06-09-30/§1-6" }
    - { id: opplaeringslova, punkt: "§ 5-3 første ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 5-1 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§5-1" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.1 Tilbudsstruktur", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.1-tilbudsstruktur/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «Fylkeskommunen velger hvilke tilbud skolene i fylket skal ha» en riktig forenkling av § 5-3, som handler om planleggingen og utbyggingen av tilbudet?"
    - "Udir gir ut tilbudsstrukturen i rundskrivet (vedlegg 2), og ingen egen forskrift finnes ennå (som for fag- og timefordelingen). Er det greit å skrive at departementet fastsetter den?"
  stikkord: [tilbud, utdanningsprogram, programområde, lærefag, Udir-1, dimensjonering, Vilbli]
  relatert: [utdanningsprogram, programomrade, fag-og-timefordeling, opplaering-i-bedrift]

- id: instruktor
  type: begrep
  tittel: { nb: Instruktør, nn: Instruktør }
  tekst:
    nb: En instruktør gir opplæringen i lærebedriften. Lærebedriften skal ha en eller flere instruktører, og i tillegg en eller flere faglig kvalifiserte personer som har ansvaret for opplæringen. Instruktøren har jevnlig dialog med lærlingen om hvordan lærlingen utvikler seg, og gir halvårsvurderingen til lærlinger, lærekandidater og praksisbrevkandidater. Det er lærebedriften som har ansvaret for opplæringen, også når deler av den skjer i en annen bedrift.
    nn: Ein instruktør gir opplæringa i lærebedrifta. Lærebedrifta skal ha ein eller fleire instruktørar, og i tillegg ein eller fleire fagleg kvalifiserte personar som har ansvaret for opplæringa. Instruktøren har jamleg dialog med lærlingen om korleis lærlingen utviklar seg, og gir halvårsvurderinga til lærlingar, lærekandidatar og praksisbrevkandidatar. Det er lærebedrifta som har ansvaret for opplæringa, også når delar av ho skjer i ei anna bedrift.
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-6 første og andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-6" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-6 andre ledd (dialog med instruktør)", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-6" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-13 fjerde ledd (halvårsvurderingen)", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-13" }
  kontrollert: null
  kontrollsporsmal:
    - "Eier valgte 08.10.2026 at begrepet bare heter «Instruktør», og at «faglig leder» bare er søkeord. Er det riktig at instruktøren og den som har ansvaret for opplæringen, kan være ulike personer, slik § 7-6 andre ledd leses her?"
  stikkord: [instruktør, instruktørar, faglig leder, fagleg leiar, lærebedrift, opplæringsansvarlig]
  relatert: [laerebedrift, laerling, opplaeringskontor, halvarsvurdering]

- id: radgiving
  type: begrep
  tittel: { nb: Rådgiving, nn: Rådgiving }
  lenkeord: { nb: ["rådgiving", "rådgivning", "rådgiver"], nn: ["rådgiving", "rådgivar", "rådgivning"] }
  tekst:
    nb: Elever har rett til den rådgivingen de trenger, både om utdannings- og yrkesvalg og om sosiale og personlige forhold som kan påvirke hvordan de har det på skolen. Rådgivingen skal gis på skolen eleven går på, og individuelt når eleven ønsker det. Fylkeskommunen skal sørge for at de som har læretid i bedrift, også har tilgang til begge deler. Før opplæringslova fra 2024 het det utdannings- og yrkesrådgiving og sosialpedagogisk rådgiving. Rådgiving på skolen regnes ikke som fravær.
    nn: Elevar har rett til den rådgivinga dei treng, både om utdannings- og yrkesval og om sosiale og personlege forhold som kan påverke korleis dei har det på skolen. Rådgivinga skal givast på skolen eleven går på, og individuelt når eleven ønskjer det. Fylkeskommunen skal sørgje for at dei som har læretid i bedrift, også har tilgang til begge delar. Før opplæringslova frå 2024 heitte det utdannings- og yrkesrådgiving og sosialpedagogisk rådgiving. Rådgiving på skolen blir ikkje rekna som fråvær.
  kilder:
    - { id: opplaeringslova, punkt: "§ 16-1 Rådgiving om utdannings- og yrkesval", url: "https://lovdata.no/lov/2023-06-09-30/§16-1" }
    - { id: opplaeringslova, punkt: "§ 16-2 Rådgiving om sosiale og personlege forhold", url: "https://lovdata.no/lov/2023-06-09-30/§16-2" }
    - { id: udir-ord-og-omgrep, punkt: "Sosialpedagogisk rådgiving og utdannings- og yrkesrådgiving i tabellen", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/ny-opplaringslov/ord-og-omgrep/" }
    - { id: udir-rundskriv-fravarsgrensen, punkt: "3.1 og 3.2 Fravær fra opplæringen som ikke omfattes av fraværsgrensen", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-fravarsgrensen/3.-hva-omfattes-av-fravarsgrensen/" }
  kontrollert: null
  kontrollsporsmal:
    - "Bør begrepet nevne karriereveiledningen fylkeskommunen skal ha for alle som bor i fylket (§ 28-9), eller er det et annet tema?"
    - "Er det riktig at rådgiving på skolen ikke regnes som fravær, slik «Det som ikke er fravær» i Vurdering sier?"
  stikkord: [rådgiver, rådgivar, sosialpedagogisk rådgiving, yrkesrådgiving, utdanningsvalg, karriereveiledning, skolerådgiver]
  relatert: [omvalg, utdanningsprogram, laerling]
