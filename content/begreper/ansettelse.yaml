# Begreper om ansettelse og lønn fra kildene i Regelverk (fase 3, avgjørelse 039): Hovedtariffavtalen, SFS 2213,
# arbeidsmiljøloven og forvaltningsloven. Flyttet hit fra regelverk.yaml så begrepsbanken kan filtreres på tema
# (eier 05.10.2026). Kompetansekravene, kvalifikasjonsprinsippet og politiattest (opplæringslova kapittel 17 og
# opplæringsforskrifta kapittel 12) er lagt til 09.10.2026 etter gjennomgangen av innholdet, godkjent av eier.
# Alle er ukontrollerte (kontrollert: null) til eier har sett på dem.
- id: tariffavtale
  type: begrep
  tittel: { nb: Tariffavtale og særavtale, nn: Tariffavtale og særavtale }
  lenkeord: { nb: ["tariffavtale", "særavtale"], nn: ["tariffavtale", "særavtale"] }
  tekst:
    nb: >-
      En tariffavtale er en avtale mellom en arbeidsgiverorganisasjon og arbeidstakerorganisasjoner om lønn og arbeidsvilkår. For fylkeskommunene er KS arbeidsgiverorganisasjon, og [Hovedtariffavtalen](#/lov/hovedtariffavtalen) gjelder i hele KS-området. En særavtale regulerer et avgrenset tema mer i detalj. [SFS 2213](#/lov/sfs2213) er særavtalen om arbeidstid for undervisningspersonalet. Hovedtariffavtalen gjelder så langt særavtalen ikke sier noe annet.
    nn: >-
      Ein tariffavtale er ein avtale mellom ein arbeidsgivarorganisasjon og arbeidstakarorganisasjonar om lønn og arbeidsvilkår. For fylkeskommunane er KS arbeidsgivarorganisasjon, og [Hovudtariffavtalen](#/lov/hovedtariffavtalen) gjeld i heile KS-området. Ein særavtale regulerer eit avgrensa tema meir i detalj. [SFS 2213](#/lov/sfs2213) er særavtalen om arbeidstid for undervisningspersonalet. Hovudtariffavtalen gjeld så langt særavtalen ikkje seier noko anna.
  kilder:
    - { id: ks-hovedtariffavtalen, punkt: "Kap. 1 § 1", url: "https://www.ks.no/globalassets/fagomrader/lonn-og-tariff/tariff-2024/hovedtariffavtalen-2026-2028---interaktiv-til-nettsiden.pdf#page=8" }
    - { id: ks-sfs2213-avtaletekst, punkt: "1" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig og presist nok å si at Hovedtariffavtalen gjelder «i hele KS-området» for fylkeskommunene?"
    - "Er det riktig at hovedtariffavtalen gjelder så langt særavtalen ikke sier noe annet (SFS 2213 punkt 1)?"
  stikkord: [tariffavtale, særavtale, hovedtariffavtale, KS, HTA]
  relatert: [lokale-forhandlinger, arbeidstid]

- id: garantilonn
  type: begrep
  tittel: { nb: Garantilønn, nn: Garantiløn }
  tekst:
    nb: >-
      Garantilønn er den laveste årslønnen en stillingsgruppe kan ha etter Hovedtariffavtalen kapittel 4. Lønnen øker med faste tillegg etter 6, 8, 10 og 16 års lønnsansiennitet. Lønnen fastsettes lokalt ved ansettelse og kan være høyere. For lærere følger stillingsgruppen av stillingskoden, som følger av utdanningen.
    nn: >-
      Garantiløn er den lågaste årsløna ei stillingsgruppe kan ha etter Hovudtariffavtalen kapittel 4. Løna aukar med faste tillegg etter 6, 8, 10 og 16 års lønnsansiennitet. Løna blir fastsett lokalt ved tilsetjing og kan vere høgare. For lærarar følgjer stillingsgruppa av stillingskoden, som følgjer av utdanninga.
  kilder:
    - { id: ks-hovedtariffavtalen, punkt: "Kap. 4 punkt 4.1", url: "https://www.ks.no/globalassets/fagomrader/lonn-og-tariff/tariff-2024/hovedtariffavtalen-2026-2028---interaktiv-til-nettsiden.pdf#page=49" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at tilleggene gis ved 6, 8, 10 og 16 års ansiennitet i tabellen per 1.5.2026?"
  stikkord: [garantilønn, minstelønn, lønnstabell, kapittel 4]
  relatert: [stillingskode, lonnsansiennitet]

- id: stillingskode
  type: begrep
  tittel: { nb: Stillingskode, nn: Stillingskode }
  tekst:
    nb: >-
      Stillingskoden er et nummer som viser stillingen og hvilken lønnsgruppe den hører til. For undervisningsstillinger følger koden av den godkjente utdanningen, regnet i normert studietid: 7961 lærer, 7962 adjunkt, 7963 adjunkt med tilleggsutdanning, 7965 lektor og 7966 lektor med tilleggsutdanning. Den som underviser uten godkjent utdanning, har kode 7960. Reglene står i vedlegg 2 til Hovedtariffavtalen.
    nn: >-
      Stillingskoden er eit nummer som viser stillinga og kva lønnsgruppe ho høyrer til. For undervisningsstillingar følgjer koden av den godkjende utdanninga, rekna i normert studietid: 7961 lærar, 7962 adjunkt, 7963 adjunkt med tilleggsutdanning, 7965 lektor og 7966 lektor med tilleggsutdanning. Den som underviser utan godkjend utdanning, har kode 7960. Reglane står i vedlegg 2 til Hovudtariffavtalen.
  kilder:
    - { id: ks-hovedtariffavtalen, punkt: "Vedlegg 2", url: "https://www.ks.no/globalassets/fagomrader/lonn-og-tariff/tariff-2024/hovedtariffavtalen-2026-2028---interaktiv-til-nettsiden.pdf#page=64" }
  kontrollert: null
  kontrollsporsmal:
    - "Er listen over stillingskoder for undervisningsstillinger fullstendig for videregående?"
  stikkord: [stillingskode, lektor, adjunkt, lærer, "7965", kompetanselønn]
  relatert: [garantilonn]

- id: lonnsansiennitet
  type: begrep
  tittel: { nb: Lønnsansiennitet, nn: Lønnsansiennitet }
  tekst:
    nb: >-
      Lønnsansiennitet er antall år med tjeneste som gir rett til lønnstillegg etter Hovedtariffavtalen. Den fastsettes ved ansettelse og regnes tidligst fra fylte 18 år. All tidligere tjeneste, privat og offentlig, teller med, og omsorg for barn eller syke og eldre teller med inntil tre år. Ansienniteten beholdes ved overgang til ny stilling hos samme arbeidsgiver.
    nn: >-
      Lønnsansiennitet er talet på år med teneste som gir rett til lønnstillegg etter Hovudtariffavtalen. Han blir fastsett ved tilsetjing og blir rekna tidlegast frå fylte 18 år. All tidlegare teneste, privat og offentleg, tel med, og omsorg for born eller sjuke og eldre tel med inntil tre år. Ansienniteten blir halden ved overgang til ny stilling hos same arbeidsgivar.
  kilder:
    - { id: ks-hovedtariffavtalen, punkt: "Kap. 1 § 12 og kap. 4 punkt 4.0", url: "https://www.ks.no/globalassets/fagomrader/lonn-og-tariff/tariff-2024/hovedtariffavtalen-2026-2028---interaktiv-til-nettsiden.pdf#page=32" }
  kontrollert: null
  kontrollsporsmal:
    - "Avtalen sier at ansienniteten beholdes ved ny stilling hos samme arbeidsgiver «med mindre det er enighet om annet». Bør forbeholdet stå?"
  stikkord: [ansiennitet, lønnsansiennitet, tjenestetid]
  relatert: [garantilonn]

- id: konstituering
  type: begrep
  tittel: { nb: Konstituering, nn: Konstituering }
  tekst:
    nb: >-
      Konstituering er en midlertidig ansettelse i en annen, ofte høyere, stilling, for eksempel som rektor mens rektor har permisjon. Den konstituerte får lønnen for stillingen fra første dag. Står en stilling ledig i mer enn en måned, skal det som hovedregel konstitueres. Kortere vikariater kalles stedfortredertjeneste. Se [§ 13 Stedfortreder og konstituering](#/lov/hovedtariffavtalen/hta-stedfortreder).
    nn: >-
      Konstituering er ei mellombels tilsetjing i ei anna, ofte høgare, stilling, til dømes som rektor medan rektor har permisjon. Den konstituerte får lønna for stillinga frå første dag. Står ei stilling ledig i meir enn ein månad, skal det som hovudregel konstituerast. Kortare vikariat blir kalla stedfortredarteneste. Sjå [§ 13 Stedfortredar og konstituering](#/lov/hovedtariffavtalen/hta-stedfortreder).
  kilder:
    - { id: ks-hovedtariffavtalen, punkt: "Kap. 1 § 13 (13.4)", url: "https://www.ks.no/globalassets/fagomrader/lonn-og-tariff/tariff-2024/hovedtariffavtalen-2026-2028---interaktiv-til-nettsiden.pdf#page=34" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å skille konstituering fra stedfortredertjeneste på denne måten, eller kan det misforstås?"
  stikkord: [konstituering, konstituert, fungerende, stedfortreder]
  relatert: [midlertidig-ansettelse]

- id: tidsressurspott
  type: begrep
  tittel: { nb: Tidsressurspott, nn: Tidsressurspott }
  tekst:
    nb: >-
      Tidsressurspotten er en ressurs i SFS 2213 til lærere og skoleledere med en byrdefull undervisningssituasjon. Den er et fast antall årsrammetimer per elev på skolen. Fordelingen drøftes på skolen, og ressursen brukes som hovedregel til å redusere undervisningen, eller til å øke lærertettheten. Se [punkt 7.3](#/lov/sfs2213/sfs-tidsressurser).
    nn: >-
      Tidsressurspotten er ein ressurs i SFS 2213 til lærarar og skuleleiarar med ein byrdefull undervisningssituasjon. Han er eit fast tal årsrammetimar per elev på skulen. Fordelinga blir drøfta på skulen, og ressursen blir som hovudregel brukt til å redusere undervisninga, eller til å auke lærartettleiken. Sjå [punkt 7.3](#/lov/sfs2213/sfs-tidsressurser).
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "7.3 a" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det dekkende å si at potten også kan brukes til å øke lærertettheten?"
  stikkord: [tidsressurspott, byrdefull, årsrammetimer]
  relatert: [arsramme, drofting]

- id: midlertidig-ansettelse
  type: begrep
  tittel: { nb: Midlertidig ansettelse, nn: Mellombels tilsetjing }
  tekst:
    nb: >-
      Hovedregelen etter arbeidsmiljøloven er fast ansettelse. Midlertidig ansettelse kan bare avtales i bestemte tilfeller, blant annet når arbeidet er av midlertidig karakter og ved vikariat for en eller flere andre. For lærerstillinger har opplæringslova i tillegg egne regler. Finnes det ingen søkere som oppfyller kravene for ansettelse, kan andre ansettes midlertidig på vilkår om at de fullfører en påbegynt lærerutdanning. Hvor lenge, avtaler arbeidsgiveren og arbeidstakeren ut fra stillingsstørrelsen, hvor lang utdanningen er og hvor tilgjengelig utdanningstilbudet er. Uten et slikt vilkår kan de ansettes midlertidig, men ikke lenger enn til 31. juli. Etter forarbeidene bør ansettelse på vilkår vurderes først. Kravet om relevant kompetanse i fagene gjelder ikke for midlertidig ansatte. Hovedtariffavtalen krever at arbeidsgiveren drøfter bruken av midlertidige ansettelser med de tillitsvalgte. Se [arbeidsmiljøloven § 14-9](#/lov/arbeidsmiljoloven/14-9) og [opplæringslova § 17-3](#/lov/opplaeringslova/17-3).
    nn: >-
      Hovudregelen etter arbeidsmiljøloven er fast tilsetjing. Mellombels tilsetjing kan berre avtalast i bestemte tilfelle, mellom anna når arbeidet er av mellombels karakter og ved vikariat for ein eller fleire andre. For lærarstillingar har opplæringslova i tillegg eigne reglar. Finst det ingen søkjarar som oppfyller krava for tilsetjing, kan andre tilsetjast mellombels på vilkår om at dei fullfører ei påbyrja lærarutdanning. Kor lenge, avtaler arbeidsgivaren og arbeidstakaren ut frå stillingsstorleiken, kor lang utdanninga er og kor tilgjengeleg utdanningstilbodet er. Utan eit slikt vilkår kan dei tilsetjast mellombels, men ikkje lenger enn til 31. juli. Etter forarbeida bør tilsetjing på vilkår vurderast først. Kravet om relevant kompetanse i faga gjeld ikkje for mellombels tilsette. Hovudtariffavtalen krev at arbeidsgivaren drøftar bruken av mellombels tilsetjingar med dei tillitsvalde. Sjå [arbeidsmiljøloven § 14-9](#/lov/arbeidsmiljoloven/14-9) og [opplæringslova § 17-3](#/lov/opplaeringslova/17-3).
  kilder:
    - { id: arbeidsmiljoloven, punkt: "§ 14-9 Fast og midlertidig ansettelse", url: "https://lovdata.no/lov/2005-06-17-62/§14-9" }
    - { id: opplaeringslova, punkt: "§ 17-3 andre og tredje ledd", url: "https://lovdata.no/lov/2023-06-09-30/§17-3" }
    - { id: opplaeringslova, punkt: "§ 17-4 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§17-4" }
    - { id: udir-merknader-opplaeringslova, punkt: "§ 17-3 Krav for å bli tilsett i lærarstilling (Prop. 62 L (2023–2024) punkt 2.6)", url: "https://www.udir.no/regelverkstolkninger/opplaring/lov-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringslova/fjerde-del--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-17-personalet-i-skolen-skolefagleg-kompetanse-og-kvalitetsutvikling/-17-3-krav-for-a-bli-tilsett-i-lararstilling/" }
    - { id: ks-hovedtariffavtalen, punkt: "Kap. 1 § 2 (2.3.2)", url: "https://www.ks.no/globalassets/fagomrader/lonn-og-tariff/tariff-2024/hovedtariffavtalen-2026-2028---interaktiv-til-nettsiden.pdf#page=9" }
  kontrollert: null
  kontrollsporsmal:
    - "Udirs tekst nevner bare midlertidig ansatte etter § 17-3 andre ledd og vikarer etter arbeidsmiljøloven. Er det riktig å skrive at kravet om relevant kompetanse ikke gjelder midlertidig ansatte (§ 17-4 andre ledd), også dem som er ansatt uten vilkår til 31. juli (§ 17-3 tredje ledd)?"
    - "Er det riktig at ansettelse på vilkår bør vurderes før annen midlertidig ansettelse (Prop. 62 L (2023–2024) punkt 2.6, gjengitt hos Udir)?"
    - "Bør begrepet si hvordan § 17-3 og arbeidsmiljøloven § 14-9 henger sammen, for eksempel når en lærer uten lærerutdanning ansettes som vikar?"
  stikkord: [midlertidig ansettelse, mellombels tilsetjing, vikariat, fast ansettelse, vikar, "31. juli", ansettelse på vilkår, "17-3"]
  relatert: [konstituering, oppsigelse-og-avskjed, krav-for-ansettelse-som-laerer, relevant-kompetanse]

- id: krav-for-ansettelse-som-laerer
  type: begrep
  tittel: { nb: Krav for ansettelse i lærerstilling, nn: Krav for tilsetjing i lærarstilling }
  lenkeord: { nb: ["krav for ansettelse", "kravene for ansettelse"], nn: ["krav for tilsetjing", "krava for tilsetjing"] }
  tekst:
    nb: >-
      De som ansettes i lærerstilling, skal ha relevant lærerutdanning senest når de begynner i stillingen. Det betyr pedagogisk utdanning etter rammeplanene for lærerutdanningene eller tilsvarende pedagogisk utdanning. I videregående kreves i tillegg for fellesfag og for programfag på studieforberedende minst 240 studiepoeng (med pedagogisk utdanning) eller faglærerutdanning. For programfag på yrkesfag kreves yrkesfaglærerutdanning, minst 180 studiepoeng (med pedagogisk utdanning) eller faglærerutdanning. Med en av disse utdanningene kan de ansettes for å undervise i fag der de har minst 60 studiepoeng relevant utdanning. Fag- eller svennebrev med to års yrkesteoretisk utdanning, fire års yrkespraksis og pedagogisk utdanning kvalifiserer også, i fag som bakgrunnen er relevant for. Lærerutdanning med minst 60 studiepoeng spesialpedagogikk kvalifiserer blant annet for å gi individuelt tilrettelagt opplæring. De som var kvalifisert etter tidligere regler, er det fortsatt. I tillegg gjelder kravet om relevant kompetanse i fagene de skal undervise i. Finnes det ingen kvalifiserte søkere, kan andre ansettes midlertidig. Se [opplæringslova § 17-3](#/lov/opplaeringslova/17-3) og [opplæringsforskrifta §§ 12-1, 12-7 og 12-8](#/lov/opplaeringsforskrifta/12-7).
    nn: >-
      Dei som blir tilsette i lærarstilling, skal ha relevant lærarutdanning seinast når dei byrjar i stillinga. Det tyder pedagogisk utdanning etter rammeplanane for lærarutdanningane eller tilsvarande pedagogisk utdanning. I vidaregåande krevst det i tillegg for fellesfag og for programfag på studieførebuande minst 240 studiepoeng (med pedagogisk utdanning) eller faglærarutdanning. For programfag på yrkesfag krevst yrkesfaglærarutdanning, minst 180 studiepoeng (med pedagogisk utdanning) eller faglærarutdanning. Med ei av desse utdanningane kan dei tilsetjast for å undervise i fag der dei har minst 60 studiepoeng relevant utdanning. Fag- eller sveinebrev med to års yrkesteoretisk utdanning, fire års yrkespraksis og pedagogisk utdanning kvalifiserer også, i fag som bakgrunnen er relevant for. Lærarutdanning med minst 60 studiepoeng spesialpedagogikk kvalifiserer mellom anna for å gi individuelt tilrettelagd opplæring. Dei som var kvalifiserte etter tidlegare reglar, er det framleis. I tillegg gjeld kravet om relevant kompetanse i faga dei skal undervise i. Finst det ingen kvalifiserte søkjarar, kan andre tilsetjast mellombels. Sjå [opplæringslova § 17-3](#/lov/opplaeringslova/17-3) og [opplæringsforskrifta §§ 12-1, 12-7 og 12-8](#/lov/opplaeringsforskrifta/12-7).
  kilder:
    - { id: opplaeringslova, punkt: "§ 17-3 Krav for å bli tilsett i lærarstilling", url: "https://lovdata.no/lov/2023-06-09-30/§17-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 12-1 Krav til pedagogisk utdanning for å bli tilsett i lærarstilling", url: "https://lovdata.no/forskrift/2024-06-03-900/§12-1" }
    - { id: opplaeringsforskrifta, punkt: "§ 12-7 Krav for å bli tilsett i lærarstilling i fellesfag på alle utdanningsprogram, og i programfag på studieførebuande utdanningsprogram i den vidaregåande opplæringa", url: "https://lovdata.no/forskrift/2024-06-03-900/§12-7" }
    - { id: opplaeringsforskrifta, punkt: "§ 12-8 Krav for å bli tilsett i lærarstilling i programfag på yrkesfaglege utdanningsprogram i den vidaregåande opplæringa", url: "https://lovdata.no/forskrift/2024-06-03-900/§12-8" }
    - { id: opplaeringsforskrifta, punkt: "§ 12-13 Tidlegare godkjend lærarutdanning og overgangsordningar", url: "https://lovdata.no/forskrift/2024-06-03-900/§12-13" }
    - { id: udir-merknader-ofo-kap12, punkt: "Merknad til § 12-13", url: "https://www.udir.no/regelverkstolkninger/opplaring/forskrift-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringsforskrifta/tredje-delen--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-12-personalet-i-skolen/i.-krav-til-kompetanse-for-tilsetjing-og-undervisning/-12-13-tidlegare-godkjend-lararutdanning-og-overgangsordningar/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er sammendraget av kravene i opplæringsforskrifta §§ 12-1, 12-7 og 12-8 riktig og passe detaljert for videregående, eller bør begrepet bare vise til forskriften?"
    - "Er det riktig at «en av disse utdanningene» (240 eller 180 studiepoeng, faglærer- og yrkesfaglærerutdanning) gir rett til å undervise i fag der læreren har 60 studiepoeng, mens fag- eller svennebrev gjelder fag som bakgrunnen er relevant for (§ 12-8 bokstav d)?"
    - "Bør overgangsregelen i § 12-13 fjerde ledd (fast ansatte lærere per 1. august 2024 uten pedagogisk utdanning) nevnes?"
    - "Privatskolelova § 4-2 sier at de samme kravene gjelder i privatskoler, med mulighet for andre krav ved alternative læreplaner. Bør begrepet si det, siden begrepene ikke viser privatskoletekst?"
  stikkord: [kompetansekrav, lærerutdanning, pedagogisk utdanning, PPU, studiepoeng, ansettelse, tilsetjing, lærerstilling, "17-3", "12-7", "12-8"]
  relatert: [relevant-kompetanse, midlertidig-ansettelse, kvalifikasjonsprinsippet, politiattest, stillingskode]

- id: relevant-kompetanse
  type: begrep
  tittel: { nb: Relevant kompetanse i undervisningsfag, nn: Relevant kompetanse i undervisningsfag }
  lenkeord: { nb: ["relevant kompetanse"], nn: ["relevant kompetanse"] }
  tekst:
    nb: >-
      Lærere som underviser i videregående, skal ha minst 60 studiepoeng som er relevante for faget. Kravet kommer i tillegg til kravene for ansettelse. Det gjelder ikke i yrkesfaglig fordypning. Det gjelder heller ikke for lærere som er ansatt med fag- eller svennebrev og yrkesteoretisk utdanning, når ett av de to årene med yrkesteoretisk utdanning er relevant for faget. Loven unntar dessuten dem som kunne ansettes i lærerstilling før 1. januar 2014, også om de ikke arbeidet som lærer da. Allmennlærere og midlertidig ansatte er også unntatt. Har skolen ikke nok lærere som oppfyller kravet, kan fylkeskommunen fravike det. Det gjøres for hver lærer og hvert fag og skal vurderes på nytt hvert skoleår. En slik avgjørelse er ikke et enkeltvedtak. I et vedtak om individuelt tilrettelagt opplæring kan det også gjøres unntak. Se [opplæringslova § 17-4](#/lov/opplaeringslova/17-4) og [opplæringsforskrifta § 12-9](#/lov/opplaeringsforskrifta/12-9).
    nn: >-
      Lærarar som underviser i vidaregåande, skal ha minst 60 studiepoeng som er relevante for faget. Kravet kjem i tillegg til krava for tilsetjing. Det gjeld ikkje i yrkesfagleg fordjuping. Det gjeld heller ikkje for lærarar som er tilsette med fag- eller sveinebrev og yrkesteoretisk utdanning, når eitt av dei to åra med yrkesteoretisk utdanning er relevant for faget. Lova unntek dessutan dei som kunne tilsetjast i lærarstilling før 1. januar 2014, også om dei ikkje arbeidde som lærar då. Allmennlærarar og mellombels tilsette er også unntekne. Har skulen ikkje nok lærarar som oppfyller kravet, kan fylkeskommunen fråvike det. Det blir gjort for kvar lærar og kvart fag og skal vurderast på nytt kvart skuleår. Ei slik avgjerd er ikkje eit enkeltvedtak. I eit vedtak om individuelt tilrettelagd opplæring kan det også gjerast unntak. Sjå [opplæringslova § 17-4](#/lov/opplaeringslova/17-4) og [opplæringsforskrifta § 12-9](#/lov/opplaeringsforskrifta/12-9).
  kilder:
    - { id: opplaeringslova, punkt: "§ 17-4 Krav om relevant kompetanse i undervisningsfag", url: "https://lovdata.no/lov/2023-06-09-30/§17-4" }
    - { id: opplaeringsforskrifta, punkt: "§ 12-9 Krav om relevant kompetanse i undervisningsfaga i den vidaregåande opplæringa", url: "https://lovdata.no/forskrift/2024-06-03-900/§12-9" }
    - { id: opplaeringslova, punkt: "§ 11-9 Kompetansekrav for den som skal gi individuelt tilrettelagd opplæring", url: "https://lovdata.no/lov/2023-06-09-30/§11-9" }
    - { id: udir-merknader-opplaeringslova, punkt: "§ 17-4 Krav om relevant kompetanse i undervisningsfag (Prop. 57 L (2022–2023) punkt 50)", url: "https://www.udir.no/regelverkstolkninger/opplaring/lov-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringslova/fjerde-del--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-17-personalet-i-skolen-skolefagleg-kompetanse-og-kvalitetsutvikling/-17-4-krav-om-relevant-kompetanse-i-undervisningsfag/" }
    - { id: udir-merknader-ofo-kap12, punkt: "Merknad til § 12-9", url: "https://www.udir.no/regelverkstolkninger/opplaring/forskrift-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringsforskrifta/tredje-delen--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-12-personalet-i-skolen/i.-krav-til-kompetanse-for-tilsetjing-og-undervisning/-12-9-krav-om-relevant-kompetanse-i-undervisningsfaga-i-den-vidaregaande-opplaringa/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at unntaket etter § 17-4 tredje ledd må gjøres for hver lærer og hvert fag, og ikke er et enkeltvedtak (forarbeidene, gjengitt hos Udir)? Bør begrepet si hvem i fylkeskommunen som avgjør det?"
    - "Er unntaket i § 12-9 andre ledd for lærere ansatt etter § 12-8 bokstav d gjengitt riktig, og bør alternativet med realkompetanse nevnes?"
    - "Er «Relevant kompetanse i undervisningsfag» et godt navn, eller bruker skolene et annet ord, for eksempel «undervisningskompetanse» eller «kompetansekravet»?"
  stikkord: [relevant kompetanse, undervisningskompetanse, kompetansekrav, 60 studiepoeng, fagfordeling, unntak, allmennlærer, "17-4", "12-9"]
  relatert: [krav-for-ansettelse-som-laerer, midlertidig-ansettelse, individuelt-tilrettelagt-opplaering]

- id: kvalifikasjonsprinsippet
  type: begrep
  tittel: { nb: Kvalifikasjonsprinsippet, nn: Kvalifikasjonsprinsippet }
  tekst:
    nb: >-
      Kvalifikasjonsprinsippet betyr at den best kvalifiserte søkeren skal ansettes i en ledig stilling, med mindre lov eller forskrift gjør unntak. Når fylkeskommunen vurderer hvem som er best kvalifisert, skal den legge vekt på utdanning, erfaring og hvor personlig egnet søkeren er, holdt opp mot kvalifikasjonskravene i utlysningen. Prinsippet gjelder alle stillinger på skolen. For lærerstillinger gjelder i tillegg kravene for ansettelse. Alle ledd i ansettelsen må dokumenteres godt nok til at det kan kontrolleres at prinsippet er fulgt. Se [opplæringslova § 17-5](#/lov/opplaeringslova/17-5).
    nn: >-
      Kvalifikasjonsprinsippet tyder at den best kvalifiserte søkjaren skal tilsetjast i ei ledig stilling, med mindre lov eller forskrift gjer unntak. Når fylkeskommunen vurderer kven som er best kvalifisert, skal han leggje vekt på utdanning, erfaring og kor personleg eigna søkjaren er, halde opp mot kvalifikasjonskrava i utlysinga. Prinsippet gjeld alle stillingar på skulen. For lærarstillingar gjeld i tillegg krava for tilsetjing. Alle ledd i tilsetjinga må dokumenterast godt nok til at det kan kontrollerast at prinsippet er følgt. Sjå [opplæringslova § 17-5](#/lov/opplaeringslova/17-5).
  kilder:
    - { id: opplaeringslova, punkt: "§ 17-5 Kvalifikasjonsprinsippet", url: "https://lovdata.no/lov/2023-06-09-30/§17-5" }
    - { id: udir-merknader-opplaeringslova, punkt: "§ 17-5 Kvalifikasjonsprinsippet (Prop. 57 L (2022–2023) punkt 50)", url: "https://www.udir.no/regelverkstolkninger/opplaring/lov-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringslova/fjerde-del--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-17-personalet-i-skolen-skolefagleg-kompetanse-og-kvalitetsutvikling/-17-5-kvalifikasjonsprinsippet/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at kvalifikasjonsprinsippet i § 17-5 gjelder alle stillinger på skolen, ikke bare lærerstillinger (forarbeidene, gjengitt hos Udir)?"
    - "Fortrinnsrett, for eksempel for deltidsansatte, kan gå foran den best kvalifiserte søkeren. Bør begrepet nevne slike unntak, og med hvilke kilder?"
    - "Privatskolelova har ingen tilsvarende paragraf. Bør begrepet si noe om privatskoler?"
  stikkord: [kvalifikasjonsprinsippet, best kvalifisert, ansettelse, tilsetjing, utlysning, personlig egnethet, "17-5"]
  relatert: [krav-for-ansettelse-som-laerer, politiattest]

- id: politiattest
  type: begrep
  tittel: { nb: Politiattest, nn: Politiattest }
  tekst:
    nb: >-
      Fylkeskommunen skal kreve politiattest av alle som skal ansettes fast eller midlertidig i videregående skole, i alle typer stillinger. Utlysningen skal si at søkerne må legge fram politiattest. Attesten kreves bare av den som får tilbud om stillingen, og tilbudet skal ta forbehold om at merknader på attesten kan endre det. Attesten skal foreligge før søkeren ansettes. Den som er dømt for eller har vedtatt forelegg for seksuelle overgrep mot mindreårige, skal ikke ansettes eller ha praksis på skolen. Andre merknader skal vurderes konkret. Fylkeskommunen kan også kreve politiattest av dem som skal ha praksis eller utføre oppgaver på skolen, men ikke av dem som allerede er ansatt. Se [opplæringslova § 17-11](#/lov/opplaeringslova/17-11) og [opplæringsforskrifta § 12-15](#/lov/opplaeringsforskrifta/12-15).
    nn: >-
      Fylkeskommunen skal krevje politiattest av alle som skal tilsetjast fast eller mellombels i vidaregåande skule, i alle typar stillingar. Utlysinga skal seie at søkjarane må leggje fram politiattest. Attesten blir berre kravd av den som får tilbod om stillinga, og tilbodet skal ta atterhald om at merknader på attesten kan endre det. Attesten skal liggje føre før søkjaren blir tilsett. Den som er dømd for eller har vedteke førelegg for seksuelle overgrep mot mindreårige, skal ikkje tilsetjast eller ha praksis på skulen. Andre merknader skal vurderast konkret. Fylkeskommunen kan også krevje politiattest av dei som skal ha praksis eller utføre oppgåver på skulen, men ikkje av dei som alt er tilsette. Sjå [opplæringslova § 17-11](#/lov/opplaeringslova/17-11) og [opplæringsforskrifta § 12-15](#/lov/opplaeringsforskrifta/12-15).
  kilder:
    - { id: opplaeringslova, punkt: "§ 17-11 Politiattest og forbod mot tilsetjing", url: "https://lovdata.no/lov/2023-06-09-30/§17-11" }
    - { id: opplaeringsforskrifta, punkt: "§ 12-15 Politiattest ved tilsetjing", url: "https://lovdata.no/forskrift/2024-06-03-900/§12-15" }
    - { id: udir-merknader-opplaeringslova, punkt: "§ 17-11 Politiattest og forbod mot tilsetjing (Prop. 57 L (2022–2023) punkt 52)", url: "https://www.udir.no/regelverkstolkninger/opplaring/lov-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringslova/fjerde-del--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-17-personalet-i-skolen-skolefagleg-kompetanse-og-kvalitetsutvikling/-17-11-politiattest-og-forbod-mot-tilsetjing/" }
    - { id: udir-merknader-ofo-kap12, punkt: "Merknad til § 12-15", url: "https://www.udir.no/regelverkstolkninger/opplaring/forskrift-om-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-opplaringsforskrifta/tredje-delen--fellesreglar-for-grunnskoleopplaringa-og-den-vidaregaande-opplaringa-for-barn-og-unge/kapittel-12-personalet-i-skolen/ii.-politiattest-og-yrkesforbod/-12-15-politiattest-ved-tilsetjing/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at politiattest ikke kan kreves av dem som allerede er ansatt (forarbeidene, gjengitt hos Udir), og bør unntaket om ny vandelsvurdering (politiregisterloven § 43) nevnes?"
    - "Bør begrepet nevne at vikarer fra bemanningsbyrå regnes som midlertidig ansatte og selv må levere politiattest (forarbeidene)?"
    - "Privatskoler: Etter privatskolelova § 4-3 er det skolen som skal kreve attesten. Bør begrepet si det, siden begrepene ikke viser privatskoletekst?"
  stikkord: [politiattest, vandelskontroll, ansettelse, tilsetjing, seksuelle overgrep, tilsetjingsforbod, "17-11", "12-15"]
  relatert: [krav-for-ansettelse-som-laerer, kvalifikasjonsprinsippet]

- id: oppsigelse-og-avskjed
  type: begrep
  tittel: { nb: Oppsigelse og avskjed, nn: Oppseiing og avskil }
  lenkeord: { nb: ["oppsigelse", "avskjed"], nn: ["oppseiing", "avskil"] }
  tekst:
    nb: >-
      Ved oppsigelse slutter arbeidsforholdet etter en oppsigelsesfrist, og oppsigelsen må være saklig begrunnet i virksomhetens, arbeidsgiverens eller arbeidstakerens forhold. Avskjed betyr at arbeidstakeren må gå med en gang, og krever grovt pliktbrudd eller annet vesentlig mislighold av arbeidsavtalen. Begge deler skal være skriftlig. Se [arbeidsmiljøloven § 15-7](#/lov/arbeidsmiljoloven/15-7) og [§ 15-14](#/lov/arbeidsmiljoloven/15-14).
    nn: >-
      Ved oppseiing sluttar arbeidsforholdet etter ein oppseiingsfrist, og oppseiinga må vere sakleg grunngitt i tilhøva til verksemda, arbeidsgivaren eller arbeidstakaren. Avskil tyder at arbeidstakaren må gå med ein gong, og krev grovt pliktbrot eller anna vesentleg misleghald av arbeidsavtalen. Begge delar skal vere skriftleg. Sjå [arbeidsmiljøloven § 15-7](#/lov/arbeidsmiljoloven/15-7) og [§ 15-14](#/lov/arbeidsmiljoloven/15-14).
  kilder:
    - { id: arbeidsmiljoloven, punkt: "§ 15-7 Vern mot usaklig oppsigelse", url: "https://lovdata.no/lov/2005-06-17-62/§15-7" }
    - { id: arbeidsmiljoloven, punkt: "§ 15-14 Avskjed", url: "https://lovdata.no/lov/2005-06-17-62/§15-14" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «avskil» riktig nynorsk for avskjed i denne sammenhengen?"
    - "Bør forklaringen nevne at oppsigelsesfristen etter Hovedtariffavtalen som hovedregel er tre måneder?"
  stikkord: [oppsigelse, avskjed, saklig grunn, oppsigelsesfrist]
  relatert: [midlertidig-ansettelse]
