    til: privatskoleforskrifta/3-3
    tittel: "Meir opplæring for elevar i fag som ikkje er bestått"
    lik: false
    merknad: "Opplæringsforskrifta har «som er gjennomført, men ikkje bestått». Privatskoleforskrifta har «som ikkje er bestått»."
