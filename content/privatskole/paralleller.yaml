# Privatskoler (avgjørelse 075): paragrafene i opplæringsforskrifta som har en parallell i privatskoleforskrifta.
# Når brukeren har valgt «Privatskole», viser kortene paragrafen i privatskoleforskrifta i stedet (kildene og
# «I regelverket»). Bare paragrafer som appen bruker som kilde, og der privatskoleforskrifta har en paragraf om det
# samme. Titlene er lest hos Lovdata 06.10.2026 (innholdslisten i forskrift 2024-06-03-901). `lik` er om tittelen er
# den samme. Ikke med, fordi privatskoleforskrifta ikke har en paragraf med samme tittel: inntaksfristene og
# fordelingen av plassene (ofo. §§ 4-9 og 4-18 til 4-28), fag- og sveineprøva (ofo. §§ 9-48 og 9-54 til 9-69) og
# klage på prøvene (ofo. §§ 10-9 og 10-10). Listen er til eiers kontroll (docs/arkiv/arbeidsordrer/fase-7-forslag.md).
