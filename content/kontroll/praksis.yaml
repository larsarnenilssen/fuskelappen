# Praksis og tolkninger som appen bygger på, men som ikke står i kildene. Eier bekrefter dem i kontrollrundene
# i mai og august (avgjørelse 019). Listen vises i kontrolloversikten (docs/KONTROLL.md), ikke i appen.
# berorer: regelverdier («regelsett/nøkkel») og innhold (id). bekreftet: { dato } settes bare av eier.
praksis:
  - id: lonn-brutte-maneder
    tittel: Lønn i brutte måneder
    sporsmal: Regnes lønn for deler av en måned fortsatt som arbeidsdagene ÷ 21,67 av månedslønnen, med offentlige fridager som arbeidsdager?
    appen: Hele måneder gir hel månedslønn. I brutte måneder gir hver arbeidsdag (mandag–fredag, også fridager) 1/21,67 av månedslønnen.
    grunnlag: Eier 30.09.2026. Praksis i lønnssystemet og i Vestland fylkeskommune.
    berorer: [hta-2026-2028/arbeidsdager_per_maned, metode-arbeidsplan]
    bekreftet: null

  - id: variabel-lonn-deltid
    tittel: Variabel lønn for deltidsansatte
    sporsmal: Gjelder det fortsatt at beskjeftigelse over en stilling under 100 %, opp til hel stilling, gir variabel lønn uten overtidstillegg? Er dommen om overtid for deltidsansatte blitt rettskraftig?
    appen: Det som er over stillingen og opp til 100 %, er variabel lønn med vanlig timelønn. Bare det som er over 100 %, er overtid.
    grunnlag: Eier 30.09.2026, inntil dommen om overtid for deltidsansatte er rettskraftig.
    berorer: [variabel-lonn, teknisk-undertid-overtid, metode-arbeidsplan]
    bekreftet: null

  - id: variabel-lonn-timevikar
    tittel: Variabel lønn for timevikarer
    sporsmal: Får timevikarer fortsatt vikartimene utbetalt som variabel lønn, med timelønn etter kalkulert tid?
    appen: Begrepet «variabel lønn» sier at timevikarer får variabel lønn for vikartimene.
    grunnlag: Eier 01.10.2026.
    berorer: [variabel-lonn]
    bekreftet: null

  - id: overtid-undervisning
    tittel: Overtidsbetaling for undervisning
    sporsmal: Betales overtid for undervisning fortsatt som kalkulert tid × timelønn × 1,5?
    appen: Overtidsbetaling = kalkulert tid × timelønn for undervisning × 1,5.
    grunnlag: Eier 29.09.2026. Hovedtariffavtalen § 6.4 og § 6.5.3.
    berorer: [hta-2026-2028/overtidstillegg_prosent, metode-overtid, metode-arbeidsplan]
    bekreftet: null

  - id: planleggingsdager-45
    tittel: Planleggingsdager
    sporsmal: Brukes fortsatt 45 timer planleggingsdager for alle, tatt fra annen planfestet tid, slik Visma InSchool gjør?
    appen: Planleggingsdagene er 6 × 7,5 = 45 timer for alle, tatt fra annen planfestet tid. Tallet kan endres for den enkelte.
    grunnlag: Eier 30.09.2026. Visma InSchool.
    berorer: [planleggingsdager, bruk-planleggingsdager, metode-arbeidsplan]
    bekreftet: null

  - id: skolear-38-uker
    tittel: Skoleåret og timer per uke
    sporsmal: Er elevenes skoleår fortsatt 190 dager og 38 uker, og skal timene per uke fordeles på 38 skoleuker?
    appen: Skoleåret er 190 dager og 38 uker. Møtetid regnes for 38 uker, og timer per uke er timene utenom planleggingsdagene ÷ 38.
    grunnlag: Opplæringslova. Paragrafen er ikke lagt inn i kilderegisteret ennå, så tallene sjekkes ikke automatisk.
    berorer: [sfs2213-2026-2027/skolear_uker, sfs2213-2026-2027/skolear_dager, bruk-motetid, metode-arbeidsplan]
    bekreftet: null

  - id: planfestet-60
    tittel: Planfestet tid fra 60 år
    sporsmal: Regnes planfestet tid for lærere som er 60 år og eldre fortsatt som samme andel av årsverket (1150 × 1650 ÷ 1687,5 = 1124,44 timer)?
    appen: Ferien tas like mye fra planfestet tid og tiden læreren disponerer selv.
    grunnlag: Eier 30.09.2026.
    berorer: [sfs2213-2026-2027/arsverk_timer_60_ar, arsverk, metode-arbeidsplan]
    bekreftet: null

  - id: periodenokkel
    tittel: Periodenøkkel
    sporsmal: Regnes periodebeskjeftigelse fortsatt med undervisningsdager i perioden ÷ undervisningsdager i skoleåret, slik Visma InSchool gjør?
    appen: Perioderamme = årsramme × periodenøkkel. Beskjeftigelse i perioden = timene i perioden ÷ perioderammen × 100.
    grunnlag: Eier 30.09.2026. Visma InSchool.
    berorer: [periodebeskjeftigelse, metode-arbeidsplan]
    bekreftet: null

  - id: frigjort-tid-57
    tittel: Frigjort tid for 57-åringer
    sporsmal: Skal redusert undervisning for lærere som har fylt 57 år, fortsatt regnes som for nyutdannede og lærere over 60 år, selv om avtaleteksten ikke sier det uttrykkelig?
    appen: Livsfasetiltak regnes som funksjoner som ikke utvider planfestet tid, også for 57-åringer. Den frigjorte tiden fordeles som undervisningen.
    grunnlag: Eier 30.09.2026.
    berorer: [livsfasetiltak, metode-arbeidsplan]
    bekreftet: null

  - id: funksjon-arsramme-607
    tittel: Funksjoner i årsrammetimer
    sporsmal: Gjøres funksjoner som er oppgitt i årsrammetimer, fortsatt om til prosent med årsrammen 607,5?
    appen: Prosent = årsrammetimer ÷ 607,5 × 100. Kontaktlærer med 28,5 årsrammetimer gir 4,69 %.
    grunnlag: Tolkning av vedlegg 1 til SFS 2213 (årsramme ved redusert undervisning på grunn av funksjon).
    berorer: [sfs2213-2026-2027/arsramme_funksjon, kontaktlaerer, metode-arbeidsplan]
    bekreftet: null

  - id: utvidet-arbeidsar
    tittel: Utvidet arbeidsår
    sporsmal: Regnes utvidelsen av arbeidsåret fortsatt som timene over 37,5 × 38 + 45 = 1470 planfestede timer, delt på 7,5 timer per dag?
    appen: 100 % funksjon gir 29 dager, i alt 225 dager. For lærere som er 60 år og eldre er arbeidsåret fem dager kortere.
    grunnlag: Eier 30.09.2026.
    berorer: [arbeidsar, metode-arbeidsplan]
    bekreftet: null

  - id: tillegg-standard
    tittel: Tillegg for funksjoner
    sporsmal: Er 12 000 kroner fortsatt riktig standardbeløp når navnet på en funksjon ikke kjennes igjen, og har fylket egne satser for andre funksjoner?
    appen: Tillegget fylles inn med minstegodtgjøringen i punkt 9.1. Kjennes navnet ikke igjen, brukes beløpet for kontaktlærer.
    grunnlag: Appens valg, med utgangspunkt i SFS 2213 punkt 9.1.
    berorer: [sfs2213-2026-2027/godtgjoring_kontaktlaerer, funksjonsgodtgjoring, metode-arbeidsplan]
    bekreftet: null

  - id: yff-arsramme
    tittel: Årsramme for yrkesfaglig fordypning
    sporsmal: Skal yrkesfaglig fordypning (YFF) ha årsrammen for felles programfag på utdanningsprogrammet og trinnet, slik vedlegg 1 sier om prosjekt til fordypning?
    appen: Fagkoder for yrkesfaglig fordypning (YFF4101 osv.) kobles til raden for felles programfag på programmet og trinnet, f.eks. 607,5 på helse- og oppvekstfag vg2.
    grunnlag: Claude 30.09.2026, ut fra vedlegg 1 til SFS 2213 («Prosjekt til fordypning»). Prosjekt til fordypning ble yrkesfaglig fordypning med fagfornyelsen i 2020.
    berorer: [sfs2213-2026-2027/kobling_yff]
    bekreftet: null

  - id: fagfornyelsen
    tittel: Fagfornyelsen og LK20
    sporsmal: Heter revisjonen av læreplanverket som innføres nå, fortsatt fagfornyelsen, og viderefører den LK20?
    appen: Begrepet «læreplanverket» sier at læreplanverket som gjelder nå, heter Kunnskapsløftet 2020 (LK20), og at revisjonen som innføres nå, heter fagfornyelsen og viderefører LK20.
    grunnlag: Eier 02.10.2026. Står ikke i overordnet del på udir.no, som appen bruker som kilde.
    berorer: [laereplanverket]
    bekreftet: null

  - id: forelopig-svar-sakkyndig
    tittel: Foreløpig svar i saker om individuelt tilrettelagt opplæring
    sporsmal: Regnes fristen på én måned for foreløpig svar (forvaltningsloven § 11 a tredje ledd) fra den sakkyndige vurderingen er mottatt?
    appen: Vedtakssteget i veiviseren sier at eleven eller foreldrene skal få et foreløpig svar hvis det ikke er fattet vedtak innen en måned etter at den sakkyndige vurderingen er mottatt.
    grunnlag: Eier 03.10.2026. Forvaltningsloven § 11 a sier «innen en måned etter at den er mottatt» om henvendelsen, ikke om den sakkyndige vurderingen.
    berorer: [ti-vedtak]
    bekreftet: null

  - id: samtykke-innforingsopplaering
    tittel: Samtykke til innføringsopplæring
    sporsmal: Samtykker eleven selv til innføringsopplæring så lenge eleven er samtykkekompetent, og ellers foreldrene?
    appen: Steget «Innføringsopplæring» sier at eleven samtykker selv når eleven er i stand til det, ellers foreldrene.
    grunnlag: Eier 03.10.2026. Opplæringslova § 6-6 sier at eleven må samtykke, og Udir skriver «eleven eller foreldrene».
    berorer: [sp-innforing]
    bekreftet: null

  - id: kompetansegivende-laereplaner
    tittel: Kompetansegivende læreplaner i særskilt språkopplæring
    sporsmal: Er en læreplan kompetansegivende når den gir karakter, og ikke kompetansegivende når det ikke gis vurdering med karakter?
    appen: Steget «Læreplanene i særskilt språkopplæring» merker grunnleggende norsk og morsmål for språklige minoriteter som ikke kompetansegivende, og norsk for kort botid som kompetansegivende. Læreplanen for voksne i norsk og samfunnskunnskap for språklige minoriteter (GNS02-01) har ikke noe merke.
    grunnlag: Eier 03.10.2026 ba om at det står om læreplanene er kompetansegivende. Ordet står ikke i kildene. Vurderingsordningene i Grep sier at det ikke gis karakter etter NOR07-03 og NOR08-03, og at NOR09-05 gir standpunktkarakter. GNS02-01 har bare en midtveisvurdering med godkjent eller ikke godkjent, og eier valgte 03.10.2026 at den står uten merke.
    berorer: [sp-laereplan]
    bekreftet: null

  - id: klage-inntak-inntakskontoret
    tittel: Hvem klagen på inntak sendes til
    sporsmal: Sendes klagen på et vedtak om inntak vanligvis til inntakskontoret i fylkeskommunen?
    appen: Steget «Søknad, svar og klage» i veiviseren «Rett, inntak og søknad» sier at klagen sendes til den som fattet vedtaket, vanligvis inntakskontoret i fylkeskommunen.
    grunnlag: Eier 03.10.2026. Forvaltningsloven § 32 første ledd bokstav a sier at klagen settes fram for organet som har truffet vedtaket. At det vanligvis er inntakskontoret, står ikke i kildene.
    berorer: [sk-soknad]
    bekreftet: null

  - id: poeng-avrunding
    tittel: Avrunding i poengberegningen ved inntak
    sporsmal: Regnes gjennomsnittet først med to desimaler (vanlig avrunding) og så ganges med ti, slik at 62 ÷ 14 gir 44,3 poeng?
    appen: Poengberegningen avrunder gjennomsnittet til to desimaler etter vanlige regler (4,428… blir 4,43, og 4,125 blir 4,13) og ganger så med ti.
    grunnlag: >-
      Eier 03.10.2026 (44,3 i F1). Forskriften (§ 4-19 og § 4-25) sier gjennomsnitt med to desimaler, ganget med ti.
      Udirs merknad sier «vanlige avrundingsregler», men beskriver rekkefølgen som sum × 10 ÷ antall fag, som gir 44,29
      for F1. Appen følger forskriften.
    berorer: [inntak-2024/snitt_desimaler, inntak-2024/poeng_faktor, po-vg1]
    bekreftet: null

  - id: poeng-vg3-vestland
    tittel: Karakterene som teller ved inntak til Vg3 i Vestland
    sporsmal: Teller karakterene fra både Vg1 og Vg2 ved inntak til Vg3 i Vestland, selv om den lokale forskriften bare nevner Vg2?
    appen: Poengberegningen bruker karakterene fra Vg1 og Vg2 til Vg3, også når Vestland er valgt.
    grunnlag: Eier 03.10.2026. Opplæringsforskrifta § 4-25 sier Vg1 og eventuelt Vg2. Vestlands forskrift § 2-3 andre ledd nevner bare Vg2.
    berorer: [po-vl-vg3]
    bekreftet: null

  - id: poeng-halvar-vg1-standpunkt-vg2
    tittel: Halvår på Vg1 og standpunkt på Vg2 i samme fag, ved inntak til Vg3
    sporsmal: >-
      Teller halvårsvurderingen fra Vg1 ved inntak til Vg3 når faget har standpunkt på Vg2, f.eks. kroppsøving på
      yrkesfag og fremmedspråk på studieforberedende?
    appen: >-
      Kalkulatoren lar begge telle, som ordlyden i § 4-25 («alle ... halvårsvurderingar med karakter i faga på vg1
      og eventuelt vg2»). Bare når faget også har halvår på Vg2 (f.eks. norsk og kroppsøving på studieforberedende),
      teller halvåret fra Vg1 ikke, som Udirs merknad sier.
    grunnlag: >-
      Udirs merknad til § 4-25 nevner bare fag der standpunkt settes etter Vg3. Om et standpunkt på Vg2 også
      erstatter halvåret fra Vg1, står ikke i kildene.
    berorer: [po-vg2-vg3]
    bekreftet: null
