    nb: "Praksisbrev: må være bestått, men prøven kan tas med ett fellesfag som ikke er bestått. Fag- eller svennebrev: som for lærlinger."
    nn: "Praksisbrev: må vere bestått, men prøva kan takast med eitt fellesfag som ikkje er bestått. Fag- eller sveinebrev: som for lærlingar."
  dokumentasjon: { nb: "Praksisbrev, og så fag- eller svennebrev", nn: "Praksisbrev, og så fag- eller sveinebrev" }
  etter: fra-ferdig-fagbrev
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 6-3 første ledd bokstav e", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-9 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-9" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-57", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-57" }
    - { id: udir-retten-til-vgo, punkt: "Rett til videregående opplæring, Fram til studie- eller yrkeskompetanse", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-videregaende-opplaring/" }
  kontrollert: null
  kontrollsporsmal:
    - "Udir skriver at den som har praksisbrev, har retten til videregående opplæring i behold. Er det riktig å si at praksisbrevkandidaten kan skrive lærekontrakt etterpå, og at læretiden godskrives etter ofo. § 6-9 første ledd?"
  stikkord: [praksisbrev, praksisbrevkandidat, praksisbrevprøve, godskriving]

