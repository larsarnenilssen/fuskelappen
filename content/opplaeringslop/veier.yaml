- id: fra-ferdig-fagbrev
  type: utgangspunkt
  rekkefolge: 80
  tittel: { nb: "Ferdig fag- eller svennebrev", nn: "Ferdig fag- eller sveinebrev" }
  tekst:
    nb: "Veiene videre etter fag- eller svennebrev."
    nn: "Vegane vidare etter fag- eller sveinebrev."
  overganger:
    - side: { tittel: { nb: "Vg4 påbygging etter fag- eller svennebrev", nn: "Vg4 påbygging etter fag- eller sveinebrev" }, rute: /opplaeringslop/PB }
      vilkar:
        nb: "Retten varer ut skoleåret som starter det året man fyller 24, og forutsetter at alle fagene som gir vitnemål, er bestått. Etter det, og for den som ikke har bestått fellesfagene, gjelder reglene for voksne."
        nn: "Retten varer ut skuleåret som tek til det året ein fyller 24, og føreset at alle faga som gir vitnemål, er bestått. Etter det, og for den som ikkje har bestått fellesfaga, gjeld reglane for vaksne."
      kilder:
        - { id: opplaeringslova, punkt: "§ 5-7", url: "https://lovdata.no/lov/2023-06-09-30/§5-7" }
        - { id: opplaeringslova, punkt: "§ 18-7", url: "https://lovdata.no/lov/2023-06-09-30/§18-7" }
        - { id: udir-retten-til-vgo, punkt: "Rett til påbygging", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-pabygging/" }
        - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.5.3", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.5studieforberedende-i-yrkesfag/" }
