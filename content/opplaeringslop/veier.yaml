- id: vei-laerekandidat-laerling
  type: vei
  rekkefolge: 60
  mal: fagbrev
  tittel: { nb: "Lærekandidat som blir lærling", nn: "Lærekandidat som blir lærling" }
  kortnavn: { nb: "lærekandidat til lærling", nn: "lærekandidat til lærling" }
  kort: { nb: "Kontrakten endres underveis", nn: "Kontrakten blir endra undervegs" }
  tekst:
    nb: "En lærekandidat som oppfyller kravene for fag- eller svennebrev, kan bli lærling ved å endre kontrakten. Kontrakten kan bare endres med samtykke fra fylkeskommunen."
    nn: "Ein lærekandidat som oppfyller krava for fag- eller sveinebrev, kan bli lærling ved å endre kontrakten. Kontrakten kan berre endrast med samtykke frå fylkeskommunen."
  steg:
    - { del: bedrift, tekst: { nb: "Lærekandidat", nn: "Lærekandidat" }, rute: /begreper/laerekandidat }
    - { del: bedrift, tekst: { nb: "Lærling", nn: "Lærling" }, tid: { nb: "Etter godskriving", nn: "Etter godskriving" }, rute: /begreper/laerling }
    - { del: prove, tekst: { nb: "Fag- eller svenneprøve", nn: "Fag- eller sveineprøve" }, rute: /vurdering/fag-og-svenneproven }
  kontrakt: { nb: "Opplæringskontrakt som endres til lærekontrakt", nn: "Opplæringskontrakt som blir endra til lærekontrakt" }
  prove: { nb: "Fag- eller svenneprøve", nn: "Fag- eller sveineprøve" }
  melderOpp: { nb: "Lærebedriften", nn: "Lærebedrifta" }
  fellesfag: ja
  fellesfagTekst:
    nb: "Som for lærlinger, når kandidaten er blitt lærling. Må være bestått. Med ett eller to fellesfag som ikke er bestått, kan prøven tas, men fagene må bestås etterpå."
    nn: "Som for lærlingar, når kandidaten har blitt lærling. Må vere bestått. Med eitt eller to fellesfag som ikkje er bestått, kan prøva takast, men faga må bestå etterpå."
  dokumentasjon: { nb: "Fag- eller svennebrev", nn: "Fag- eller sveinebrev" }
  etter: fra-ferdig-fagbrev
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-2 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-9 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-9" }
    - { id: udir-laerekandidatordningen, punkt: "Hva får du som lærekandidat?" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-57", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-57" }
  kontrollert: null
  kontrollsporsmal:
    - "Forskriften har ingen uttrykkelig regel om godskriving når en lærekandidat blir lærling. § 6-9 tredje ledd sier at tidligere læretid for lærekandidater godskrives etter en konkret vurdering. Er det riktig å bruke den her?"
  stikkord: [lærekandidat, lærling, endre kontrakten, godskriving]

- id: vei-fagbrev-pa-jobb
  type: vei
