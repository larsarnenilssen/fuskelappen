# Tekster som står på flere av veiene (eier 06.10.2026, svar 3 og 4).
- id: lk-kontrakt-slutt
  type: forklaring
  tittel: { nb: "Når kontrakten sies opp eller heves", nn: "Når kontrakten blir sagd opp eller heva" }
  tekst:
    nb: "Kontrakten kan sies opp når partene er enige. Fylkeskommunen hever den når den som har læretid, sier skriftlig fra at hen ikke vil fortsette, og kan heve den ved vesentlige brudd på pliktene. Lærebedriften skriver ut en attest for opplæringen som er gjennomført, og arbeidsavtalen faller bort."
    nn: "Kontrakten kan seiast opp når partane er samde. Fylkeskommunen hevar han når den som har læretid, seier skriftleg frå at han eller ho ikkje vil halde fram, og kan heve han ved vesentlege brot på pliktene. Lærebedrifta skriv ut ein attest for opplæringa som er gjennomført, og arbeidsavtalen fell bort."
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-3", url: "https://lovdata.no/lov/2023-06-09-30/§7-3" }
    - { id: opplaeringslova, punkt: "§ 7-4 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Teksten står i «Om veien» på veiene med kontrakt i bedrift, ikke som en overgang (eier 06.10.2026). Er den riktig og dekkende?"
  stikkord: [oppsigelse, heving, heve kontrakten, attest, arbeidsavtale]

- id: lk-kompetansebevis-elever
  type: forklaring
  tittel: { nb: "Kompetansebevis for elever", nn: "Kompetansebevis for elevar" }
  tekst:
    nb: "Kompetansebevis er også dokumentasjonen for elever som ikke har bestått alt som trengs til vitnemål eller fag- eller svennebrev, og for elever som bare har hatt opplæring i deler av et fag."
    nn: "Kompetansebevis er også dokumentasjonen for elevar som ikkje har bestått alt som trengst til vitnemål eller fag- eller sveinebrev, og for elevar som berre har hatt opplæring i delar av eit fag."
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 9-51 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-51" }
  kontrollert: null
  kontrollsporsmal:
    - "Står under målet «Kompetansebevis» på fanen «Veiene» (eier 06.10.2026). Er gjengivelsen av § 9-51 første ledd riktig?"
