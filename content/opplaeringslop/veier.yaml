# Veiene for lærlinger og kandidater til fag- og svennebrev, praksisbrev og kompetansebevis, og overgangene mellom
# dem (fase 6, pakke 6, avgjørelse 069). Siden «Lærlinger og kandidater» i Opplæringstilbud viser dem. Bygger på
# opplæringslova kapittel 5, 7, 18 og § 23-2, opplæringsforskrifta kapittel 6, 7 og 9, Udir-1-2026 og Udirs sider om
# retten til videregående opplæring og lærekandidatordningen. Egne ord. Ingen påstand uten belegg i kildene (eier
# 06.10.2026): det kildene ikke sier, står ikke her, eller står som at kilden ikke har en egen regel.
#
# Veiene (type vei). Adressen er id-en uten «vei-»: #/opplaeringslop/laerlinger-og-kandidater/laerling.

- id: vei-laerling
  type: vei
  rekkefolge: 10
  mal: fagbrev
  tittel: { nb: "Lærling", nn: "Lærling" }
  kortnavn: { nb: "lærling", nn: "lærling" }
  kort: { nb: "Hovedmodellen: to år i skole og to år i bedrift", nn: "Hovudmodellen: to år i skule og to år i bedrift" }
  tekst:
    nb: "Den vanlige veien: Vg1 og Vg2 på et yrkesfaglig utdanningsprogram, og så læretid i bedrift med lærekontrakt."
    nn: "Den vanlege vegen: Vg1 og Vg2 på eit yrkesfagleg utdanningsprogram, og så læretid i bedrift med lærekontrakt."
  steg:
    - { del: skole, tekst: { nb: "Vg1 yrkesfag", nn: "Vg1 yrkesfag" }, tid: { nb: "1 år", nn: "1 år" }, rute: /opplaeringslop/lop }
    - { del: skole, tekst: { nb: "Vg2 yrkesfag", nn: "Vg2 yrkesfag" }, tid: { nb: "1 år", nn: "1 år" }, rute: /opplaeringslop/lop }
    - { del: bedrift, tekst: { nb: "Lærling", nn: "Lærling" }, tid: { nb: "Vanligvis 2 år", nn: "Vanlegvis 2 år" }, rute: /begreper/laerling }
    - { del: prove, tekst: { nb: "Fag- eller svenneprøve", nn: "Fag- eller sveineprøve" }, rute: /vurdering/fag-og-svenneproven }
  kontrakt: { nb: "Lærekontrakt med lærebedriften", nn: "Lærekontrakt med lærebedrifta" }
  prove: { nb: "Fag- eller svenneprøve", nn: "Fag- eller sveineprøve" }
  melderOpp: { nb: "Lærebedriften", nn: "Lærebedrifta" }
  fellesfag: ja
  fellesfagTekst:
    nb: "Må være bestått. Med ett eller to fellesfag som ikke er bestått, kan prøven tas, men fagene må bestås etterpå."
    nn: "Må vere bestått. Med eitt eller to fellesfag som ikkje er bestått, kan prøva takast, men faga må bestå etterpå."
  dokumentasjon: { nb: "Fag- eller svennebrev", nn: "Fag- eller sveinebrev" }
  voksne:
    nb: "Voksne med rett til videregående opplæring skal få et tilbud som fører fram til sluttkompetansen de har søkt på."
    nn: "Vaksne med rett til vidaregåande opplæring skal få eit tilbod som fører fram til sluttkompetansen dei har søkt på."
  etter: fra-ferdig-fagbrev
  kilder:
    - { id: opplaeringslova, punkt: "§ 5-2 tredje ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-2" }
    - { id: opplaeringslova, punkt: "§ 7-1 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-1" }
    - { id: opplaeringslova, punkt: "§ 18-3 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§18-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-48", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-48" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-56 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-56" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-57", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-57" }
  kontrollert: null
  kontrollsporsmal:
    - "«To år i skole og to år i bedrift» bygger på ol. § 5-2 tredje ledd («til vanleg»). Er «Vanligvis 2 år» for læretiden riktig å vise ved steget?"
  stikkord: [lærling, lærekontrakt, hovedmodellen, 2+2, fagbrev, svennebrev]

- id: vei-laerling-tidlig
  type: vei
  rekkefolge: 20
  mal: fagbrev
  tittel: { nb: "Lærling rett etter grunnskolen eller Vg1", nn: "Lærling rett etter grunnskulen eller Vg1" }
  kortnavn: { nb: "tidlig lærekontrakt", nn: "tidleg lærekontrakt" }
  kort: { nb: "0+4, 1+3 og særløp", nn: "0+4, 1+3 og særløp" }
  tekst:
    nb: "Fylkeskommunen kan godkjenne kontrakter som avviker fra opplæringsløpet, f.eks. med opplæringen i skole og bedrift i en annen rekkefølge. Noen lærefag har bare Vg1 i skole og tre års læretid (særløp)."
    nn: "Fylkeskommunen kan godkjenne kontraktar som vik av frå opplæringsløpet, til dømes med opplæringa i skule og bedrift i ei anna rekkjefølgje. Nokre lærefag har berre Vg1 i skule og tre års læretid (særløp)."
  steg:
    - { del: skole, tekst: { nb: "Vg1 yrkesfag", nn: "Vg1 yrkesfag" }, tid: { nb: "0 eller 1 år", nn: "0 eller 1 år" }, rute: /opplaeringslop/lop }
    - { del: bedrift, tekst: { nb: "Lærling", nn: "Lærling" }, tid: { nb: "3 eller 4 år", nn: "3 eller 4 år" }, rute: /begreper/laerling }
    - { del: prove, tekst: { nb: "Fag- eller svenneprøve", nn: "Fag- eller sveineprøve" }, rute: /vurdering/fag-og-svenneproven }
  kontrakt: { nb: "Lærekontrakt der organiseringen går klart fram", nn: "Lærekontrakt der organiseringa går klart fram" }
  prove: { nb: "Fag- eller svenneprøve", nn: "Fag- eller sveineprøve" }
  melderOpp: { nb: "Lærebedriften", nn: "Lærebedrifta" }
  fellesfag: ja
  fellesfagTekst:
    nb: "Må være bestått. Med ett eller to fellesfag som ikke er bestått, kan prøven tas, men fagene må bestås etterpå. Kontrakten sier hvem som har ansvaret for de ulike delene av opplæringen."
    nn: "Må vere bestått. Med eitt eller to fellesfag som ikkje er bestått, kan prøva takast, men faga må bestå etterpå. Kontrakten seier kven som har ansvaret for dei ulike delane av opplæringa."
  dokumentasjon: { nb: "Fag- eller svennebrev", nn: "Fag- eller sveinebrev" }
  etter: fra-ferdig-fagbrev
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-2 første og fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-3 første ledd bokstav a–c og tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-3" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4.3 og 3.4.4", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
    - { id: opplaeringsforskrifta, punkt: "§ 9-57", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-57" }
  kontrollert: null
  kontrollsporsmal:
    - "Merknaden til ofo. § 7-6 omtaler særløp med læreplass etter Vg3, mens Udir-1 (3.4.3) sier bare Vg1 i skole og tre års læretid. Appen følger Udir-1 (eier 06.10.2026). Er det riktig?"
    - "Er «0 eller 1 år» i skole og «3 eller 4 år» læretid en dekkende beskrivelse av 0+4, 1+3 og særløp?"
  stikkord: [0+4, 1+3, særløp, annen organisering, vekslingsmodell]

- id: vei-praksisbrev-fagbrev
  type: vei
  rekkefolge: 30
  mal: fagbrev
  tittel: { nb: "Praksisbrevkandidat som blir lærling", nn: "Praksisbrevkandidat som blir lærling" }
  kortnavn: { nb: "praksisbrev til fagbrev", nn: "praksisbrev til fagbrev" }
