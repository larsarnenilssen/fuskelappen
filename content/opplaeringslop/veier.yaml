        - { id: opplaeringsforskrifta, punkt: "§ 7-3 fjerde ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
        - { id: opplaeringsforskrifta, punkt: "§ 7-5 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-5" }
  kilder:
    - { id: opplaeringslova, punkt: "§ 5-1 sjette ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-1" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-3 første ledd bokstav c", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-3" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.4.3 Særløp", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.4-yrkesfaglig/" }
    - { id: opplaeringsforskrifta, punkt: "§ 7-3 fjerde ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 7-5 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-5" }
  kontrollert: null
  kontrollsporsmal:
    - "ofo. § 7-3 fjerde ledd gjelder den som har gjennomført, men ikke bestått fagene på Vg1 og Vg2. Er det riktig å vise lærekandidat og praksisbrevkandidat også etter Vg1?"

- id: fra-vg2-yf
  type: utgangspunkt
  rekkefolge: 40
  tittel: { nb: "Vg2 yrkesfag", nn: "Vg2 yrkesfag" }
  tekst:
    nb: "Veiene videre etter Vg2 yrkesfag."
    nn: "Vegane vidare etter Vg2 yrkesfag."
  overganger:
    - til: vei-laerling
      vilkar:
        nb: "Søk formidling til læreplass innen 1. mars. Vilkårene for inntak til neste trinn må være oppfylt."
        nn: "Søk formidling til læreplass innan 1. mars. Vilkåra for inntak til neste trinn må vere oppfylte."
      kilder:
        - { id: opplaeringsforskrifta, punkt: "§ 7-3 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
        - { id: opplaeringsforskrifta, punkt: "§ 7-5 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-5" }
    - til: vei-vg3-i-skole
      vilkar:
        nb: "Når søkeren ikke får læreplass. Tilbudet starter så snart som mulig og senest 1. oktober."
        nn: "Når søkjaren ikkje får læreplass. Tilbodet startar så snart som mogleg og seinast 1. oktober."
      kilder:
        - { id: opplaeringslova, punkt: "§ 5-6", url: "https://lovdata.no/lov/2023-06-09-30/§5-6" }
        - { id: opplaeringsforskrifta, punkt: "§ 6-2", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-2" }
    - til: vei-laerekandidat
      vilkar:
        nb: "Også når fagene på Vg1 og Vg2 ikke er bestått. Søk innen 1. februar."
        nn: "Også når faga på Vg1 og Vg2 ikkje er bestått. Søk innan 1. februar."
      kilder:
        - { id: opplaeringsforskrifta, punkt: "§ 7-3 fjerde ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
        - { id: opplaeringsforskrifta, punkt: "§ 7-5 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-5" }
    - til: vei-praksisbrevkandidat
      vilkar:
        nb: "Også når fagene på Vg1 og Vg2 ikke er bestått. Søk innen 1. februar."
        nn: "Også når faga på Vg1 og Vg2 ikkje er bestått. Søk innan 1. februar."
      kilder:
        - { id: opplaeringsforskrifta, punkt: "§ 7-3 fjerde ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
        - { id: opplaeringsforskrifta, punkt: "§ 7-5 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-5" }
    - side: { tittel: { nb: "Vg3 påbygging til generell studiekompetanse", nn: "Vg3 påbygging til generell studiekompetanse" }, rute: /opplaeringslop/PB }
      vilkar:
        nb: "Gir generell studiekompetanse, ikke yrkeskompetanse. Retten til videregående opplæring varer til man har studie- eller yrkeskompetanse, så etter bestått påbygging er den brukt. Et fag- eller svennebrev etterpå blir yrkesfaglig rekvalifisering."
        nn: "Gir generell studiekompetanse, ikkje yrkeskompetanse. Retten til vidaregåande opplæring varer til ein har studie- eller yrkeskompetanse, så etter bestått påbygging er han brukt. Eit fag- eller sveinebrev etterpå blir yrkesfagleg rekvalifisering."
      kilder:
        - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.5.2", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.5studieforberedende-i-yrkesfag/" }
        - { id: opplaeringslova, punkt: "§ 5-1 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-1" }
        - { id: udir-retten-til-vgo, punkt: "Rett til videregående opplæring, Fram til studie- eller yrkeskompetanse", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-videregaende-opplaring/" }
        - { id: opplaeringslova, punkt: "§ 18-4", url: "https://lovdata.no/lov/2023-06-09-30/§18-4" }
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 7-3 andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
    - { id: opplaeringsforskrifta, punkt: "§ 7-5 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-5" }
    - { id: opplaeringslova, punkt: "§ 5-6", url: "https://lovdata.no/lov/2023-06-09-30/§5-6" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-2", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-2" }
    - { id: opplaeringsforskrifta, punkt: "§ 7-3 fjerde ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§7-3" }
    - { id: udir-fag-og-timefordeling, punkt: "Vedlegg 1, 3.5.2", url: "https://www.udir.no/regelverkstolkninger/opplaring/Innhold-i-opplaringen/udir-1-2026/vedlegg-1/3vgo/3.5studieforberedende-i-yrkesfag/" }
    - { id: opplaeringslova, punkt: "§ 5-1 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-1" }
    - { id: udir-retten-til-vgo, punkt: "Rett til videregående opplæring, Fram til studie- eller yrkeskompetanse", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-videregaende-opplaring/" }
    - { id: opplaeringslova, punkt: "§ 18-4", url: "https://lovdata.no/lov/2023-06-09-30/§18-4" }
  kontrollert: null
  kontrollsporsmal:
    - "At Vg3 påbygging bruker retten, bygger nå på ol. § 5-1 andre ledd og Udirs side om retten (retten varer til studie- eller yrkeskompetanse), ikke på eiers svar 04.10.2026. Er teksten riktig?"

- id: fra-laerling
  type: utgangspunkt
  rekkefolge: 50
  tittel: { nb: "Lærling", nn: "Lærling" }
  tekst:
    nb: "Bytte underveis for den som er lærling."
    nn: "Byte undervegs for den som er lærling."
  overganger:
    - til: vei-laerekandidat
      vilkar:
        nb: "Kontrakten kan bare endres med samtykke fra fylkeskommunen."
        nn: "Kontrakten kan berre endrast med samtykke frå fylkeskommunen."
      kilder:
        - { id: opplaeringslova, punkt: "§ 7-2 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
    - til: vei-vg3-i-skole
      vilkar:
        nb: "Når kontrakten er sagt opp eller hevet. Den som oppfyller vilkårene for læretid, men ikke får læreplass, har rett til et annet tilbud på Vg3 bygd på Vg2. Retten til videregående opplæring varer til man har studie- eller yrkeskompetanse."
        nn: "Når kontrakten er sagd opp eller heva. Den som oppfyller vilkåra for læretid, men ikkje får læreplass, har rett til eit anna tilbod på Vg3 bygd på Vg2. Retten til vidaregåande opplæring varer til ein har studie- eller yrkeskompetanse."
      kilder:
        - { id: opplaeringslova, punkt: "§ 7-3", url: "https://lovdata.no/lov/2023-06-09-30/§7-3" }
        - { id: opplaeringslova, punkt: "§ 5-6", url: "https://lovdata.no/lov/2023-06-09-30/§5-6" }
        - { id: opplaeringsforskrifta, punkt: "§ 6-2", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-2" }
        - { id: opplaeringslova, punkt: "§ 5-1 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-1" }
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-2 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
    - { id: opplaeringslova, punkt: "§ 7-3", url: "https://lovdata.no/lov/2023-06-09-30/§7-3" }
    - { id: opplaeringslova, punkt: "§ 5-6", url: "https://lovdata.no/lov/2023-06-09-30/§5-6" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-2", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-2" }
    - { id: opplaeringslova, punkt: "§ 5-1 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-1" }
  kontrollert: null
  kontrollsporsmal:
    - "Oppsigelse og heving står under «Om veien», ikke som overgang (eier 06.10.2026). Er endring til lærekandidat og Vg3 i skole de overgangene som bør vises for lærlinger?"
    - "Gjelder retten til et annet tilbud på Vg3 (ol. § 5-6 og ofo. § 6-2) også for en lærling som har mistet læreplassen fordi kontrakten er sagt opp eller hevet, når kildene ikke sier det direkte?"

- id: fra-laerekandidat
  type: utgangspunkt
  rekkefolge: 60
  tittel: { nb: "Lærekandidat", nn: "Lærekandidat" }
  tekst:
    nb: "Bytte underveis for den som er lærekandidat."
    nn: "Byte undervegs for den som er lærekandidat."
  overganger:
    - til: vei-laerekandidat-laerling
      vilkar:
        nb: "Når kandidaten oppfyller kravene for fag- eller svennebrev, kan kontrakten endres til lærekontrakt, med samtykke fra fylkeskommunen. For lærekandidater godskrives tidligere læretid etter en konkret vurdering."
        nn: "Når kandidaten oppfyller krava for fag- eller sveinebrev, kan kontrakten endrast til lærekontrakt, med samtykke frå fylkeskommunen. For lærekandidatar blir tidlegare læretid godskriven etter ei konkret vurdering."
      kilder:
        - { id: opplaeringslova, punkt: "§ 7-2 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
        - { id: opplaeringsforskrifta, punkt: "§ 6-9 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-9" }
        - { id: udir-laerekandidatordningen, punkt: "Hva får du som lærekandidat?" }
    - side: { tittel: { nb: "Elev i videregående skole", nn: "Elev i vidaregåande skule" }, rute: /inntak }
      vilkar:
        nb: "Løpet kan gå i lærebedrift, i skole eller begge deler. Fylkeskommunen kan godkjenne at skolen tar en større del av opplæringen, eller at skole og bedrift kommer i en annen rekkefølge, og kontrakten endres med samtykke fra fylkeskommunen. Den som slutter som lærekandidat, kan søke inntak som elev. Retten til videregående opplæring varer til man har studie- eller yrkeskompetanse."
        nn: "Løpet kan gå i lærebedrift, i skule eller begge delar. Fylkeskommunen kan godkjenne at skulen tek ein større del av opplæringa, eller at skule og bedrift kjem i ei anna rekkjefølgje, og kontrakten blir endra med samtykke frå fylkeskommunen. Den som sluttar som lærekandidat, kan søkje inntak som elev. Retten til vidaregåande opplæring varer til ein har studie- eller yrkeskompetanse."
      kilder:
        - { id: udir-retten-til-vgo, punkt: "Hvordan bli lærekandidat", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/hvordan-bli-larekandidat/" }
        - { id: opplaeringsforskrifta, punkt: "§ 6-3 første ledd bokstav b og c", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-3" }
        - { id: opplaeringslova, punkt: "§ 7-2 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
        - { id: opplaeringslova, punkt: "§ 7-3", url: "https://lovdata.no/lov/2023-06-09-30/§7-3" }
        - { id: opplaeringslova, punkt: "§ 5-1 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-1" }
  kilder:
    - { id: opplaeringslova, punkt: "§ 7-2 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-9 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-9" }
    - { id: udir-laerekandidatordningen, punkt: "Hva får du som lærekandidat?" }
    - { id: udir-retten-til-vgo, punkt: "Hvordan bli lærekandidat", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/hvordan-bli-larekandidat/" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-3 første ledd bokstav b og c", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-3" }
    - { id: opplaeringslova, punkt: "§ 7-3", url: "https://lovdata.no/lov/2023-06-09-30/§7-3" }
    - { id: opplaeringslova, punkt: "§ 5-1 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§5-1" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «når kandidaten oppfyller kravene for fag- eller svennebrev» (Udirs side om lærekandidatordningen) riktig gjengitt?"
    - "At en lærekandidat kan ha hele eller deler av løpet i skole, bygger på Udirs side «Hvordan bli lærekandidat» og ofo. § 6-3 bokstav b og c. At den som slutter, kan søke inntak som elev, bygger på at retten varer til studie- eller yrkeskompetanse (ol. § 5-1 andre ledd). Er dette riktig?"

- id: fra-praksisbrevkandidat
  type: utgangspunkt
  rekkefolge: 70
  tittel: { nb: "Praksisbrevkandidat", nn: "Praksisbrevkandidat" }
  tekst:
    nb: "Veien videre etter praksisbrev."
    nn: "Vegen vidare etter praksisbrev."
  overganger:
    - til: vei-praksisbrev-fagbrev
      vilkar:
        nb: "Lærekontrakt etter praksisbrevet. Den som har praksisbrev, har fortsatt retten til videregående opplæring, og tidligere læretid i lærefaget skal godskrives fullt ut."
        nn: "Lærekontrakt etter praksisbrevet. Den som har praksisbrev, har framleis retten til vidaregåande opplæring, og tidlegare læretid i lærefaget skal godskrivast fullt ut."
      kilder:
        - { id: udir-retten-til-vgo, punkt: "Rett til videregående opplæring, Fram til studie- eller yrkeskompetanse", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-videregaende-opplaring/" }
        - { id: opplaeringsforskrifta, punkt: "§ 6-9 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-9" }
  kilder:
    - { id: udir-retten-til-vgo, punkt: "Rett til videregående opplæring, Fram til studie- eller yrkeskompetanse", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-videregaende-opplaring/" }
    - { id: opplaeringsforskrifta, punkt: "§ 6-9 første ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§6-9" }
  kontrollert: null
  kontrollsporsmal:
    - "Gjelder ofo. § 6-9 første ledd (tidligere læretid godskrives fullt ut for lærlinger) læretiden som praksisbrevkandidat?"

- id: fra-prove-ikke-bestatt
  type: utgangspunkt
  rekkefolge: 75
  tittel: { nb: "Fag- eller svenneprøven ikke bestått", nn: "Fag- eller sveineprøva ikkje bestått" }
  tekst:
    nb: "Veiene videre når fag- eller svenneprøven ikke er bestått."
    nn: "Vegane vidare når fag- eller sveineprøva ikkje er bestått."
  overganger:
    - side: { tittel: { nb: "Mer opplæring på Vg3", nn: "Meir opplæring på Vg3" }, rute: /inntak/mer-opplaering }
      vilkar:
        nb: "Rett til mer opplæring på et tilbud på Vg3 som bygger på Vg2, så langt det er mulig i samme lærefag. Gjelder også en eksamen som må være bestått før prøven. Ikke for særløp (1+3), der Vg2 ikke er gjennomført. Søk når som helst."
        nn: "Rett til meir opplæring på eit tilbod på Vg3 som byggjer på Vg2, så langt det er mogleg i same lærefag. Gjeld også ein eksamen som må vere bestått før prøva. Ikkje for særløp (1+3), der Vg2 ikkje er gjennomført. Søk når som helst."
      kilder:
        - { id: opplaeringsforskrifta, punkt: "§ 5-2 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§5-2" }
        - { id: opplaeringsforskrifta, punkt: "§ 4-9 femte ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§4-9" }
        - { id: udir-mer-opplaering, punkt: "3. Mer opplæring når fag- eller svenneprøven ikke er bestått", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-mer-opplaring/mer-opplaring--nar-fag--eller-svenneproven-ikke-er-bestatt/" }
    - side: { tittel: { nb: "Ny eller utsatt prøve", nn: "Ny eller utsett prøve" }, rute: /vurdering/fag-og-svenneproven }
      vilkar:
        nb: "Rett til å bli meldt opp til én ny prøve. Lærebedriften melder opp den som har hatt læretid i bedrift, og fylkeskommunen den som har hatt opplæring i skole. Med dokumentert fravær er det utsatt prøve, så snart som mulig."
        nn: "Rett til å bli meld opp til éi ny prøve. Lærebedrifta melder opp den som har hatt læretid i bedrift, og fylkeskommunen den som har hatt opplæring i skole. Med dokumentert fråvær er det utsett prøve, så snart som mogleg."
      kilder:
        - { id: opplaeringsforskrifta, punkt: "§ 9-66 første og andre ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-66" }
        - { id: opplaeringsforskrifta, punkt: "§ 9-67", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-67" }
    - til: vei-laerling
      vilkar:
        nb: "Lengre eller ny lærekontrakt etter avtale med lærebedriften. Det er ingen rett til det. Da gjelder ikke grensen på én ny prøve."
        nn: "Lengre eller ny lærekontrakt etter avtale med lærebedrifta. Det er ingen rett til det. Då gjeld ikkje grensa på éi ny prøve."
      kilder:
        - { id: opplaeringsforskrifta, punkt: "§ 9-66 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§9-66" }
        - { id: udir-mer-opplaering, punkt: "3. Mer opplæring når fag- eller svenneprøven ikke er bestått", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/retten-til-videregaende-opplaring/rett-til-mer-opplaring/mer-opplaring--nar-fag--eller-svenneproven-ikke-er-bestatt/" }
    - til: vei-laerekandidat
      vilkar:
        nb: "Lærekontrakten kan bare endres til en opplæringskontrakt som lærekandidat med samtykke fra fylkeskommunen, som kan godkjenne kontrakter som avviker fra det fastsatte løpet. Lov og forskrift har ingen egen regel om å bytte etter en prøve som ikke er bestått."
        nn: "Lærekontrakten kan berre endrast til ein opplæringskontrakt som lærekandidat med samtykke frå fylkeskommunen, som kan godkjenne kontraktar som vik av frå det fastsette løpet. Lov og forskrift har inga eiga regel om å byte etter ei prøve som ikkje er bestått."
      kilder:
        - { id: opplaeringslova, punkt: "§ 7-2 andre og fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§7-2" }
  kilder:
    - { id: opplaeringsforskrifta, punkt: "§ 5-2 tredje ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§5-2" }
    - { id: opplaeringsforskrifta, punkt: "§ 4-9 femte ledd", url: "https://lovdata.no/forskrift/2024-06-03-900/§4-9" }
