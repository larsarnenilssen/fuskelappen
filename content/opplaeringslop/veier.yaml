    nn: "Må vere bestått. Med eitt eller to fellesfag som ikkje er bestått, kan eleven ta prøva, men må bestå faga etterpå."
  dokumentasjon: { nb: "Fag- eller svennebrev", nn: "Fag- eller sveinebrev" }
  voksne:
