  stikkord: [timelønn, timevikar, kalkulert tid, feriepenger]

- id: metode-overtid
  type: forklaring
  tittel: { nb: Slik regnes overtiden ut, nn: Slik blir overtida rekna ut }
  tekst:
    nb: |
      Fast overtid kan avtales ved at årsrammen for undervisning økes. Overtidsbetaling gis for det antallet timer årsrammen er økt med (SFS 2213 punkt 5.2). Kalkulatoren regner beskjeftigelse ut over 100 % som overtid:

      1. **Overtidstimer** = (beskjeftigelse − 100) × årsramme ÷ 100, med årsrammen for faget overtiden gjelder.
      2. **Kalkulert tid** = overtidstimer × 1400 ÷ årsramme, og **timelønn** = årslønn ÷ 1687,5 × 100 ÷ 112, som for timevikarer (hovedtariffavtalen § 12.4).
      3. **Overtidsbetaling** = kalkulert tid × timelønn × 1,5. For undervisning regnes overtidstillegget ut fra timelønnen for undervisning (§ 6.4), og tillegget er 50 % (§ 6.5.3). Dette er beløpet som utbetales.
      4. **Feriepenger** regnes som vanlig i prosent av det som utbetales: 12 %, eller 14,3 % for arbeidstakere over 60 år (§ 7.4.2). De vises som en ekstraopplysning og er ikke med i overtidsbetalingen.

      Overtid for deltidsansatte er ikke med ennå.
    nn: |
      Fast overtid kan avtalast ved at årsramma for undervisning blir auka. Overtidsbetaling blir gitt for talet på timar årsramma er auka med (SFS 2213 punkt 5.2). Kalkulatoren reknar sysselsetjing utover 100 % som overtid:

      1. **Overtidstimar** = (sysselsetjing − 100) × årsramme ÷ 100, med årsramma for faget overtida gjeld.
      2. **Kalkulert tid** = overtidstimar × 1400 ÷ årsramme, og **timeløn** = årsløn ÷ 1687,5 × 100 ÷ 112, som for timevikarar (hovudtariffavtalen § 12.4).
      3. **Overtidsbetaling** = kalkulert tid × timeløn × 1,5. For undervisning blir overtidstillegget rekna ut frå timeløna for undervisning (§ 6.4), og tillegget er 50 % (§ 6.5.3). Dette er beløpet som blir utbetalt.
      4. **Feriepengar** blir rekna som vanleg i prosent av det som blir utbetalt: 12 %, eller 14,3 % for arbeidstakarar over 60 år (§ 7.4.2). Dei blir viste som ei ekstraopplysning og er ikkje med i overtidsbetalinga.

      Overtid for deltidstilsette er ikkje med enno.
