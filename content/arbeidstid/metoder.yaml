# Metodebeskrivelser for kalkulatorene i arbeidstidsmodulen («Slik regnes det ut»).
# Tallene i beregningene står i rules/. Her står metoden med ord, slik at den kan kontrolleres og rettes uten kodeendring.
- id: metode-arbeidsplan
  type: forklaring
  tittel: { nb: Slik regnes arbeidsplanen ut, nn: Slik blir arbeidsplanen rekna ut }
  tekst:
    nb: |
      Arbeidsplanen sammenligner det læreren skal gjøre, med stillingen læreren er ansatt i:

      1. **Undervisning** = summen av beskjeftigelsen i hvert fag, årstimer ÷ årsramme × 100 (se beskjeftigelse).
      2. **Funksjoner** oppgis i prosent av full stilling eller i årsrammetimer. Årsrammetimer gjøres om til prosent med årsrammen 607,5, som gjelder for lærere med redusert undervisning på grunn av funksjon (vedlegg 1). Kontaktlærertjenesten gir minst 28,5 årsrammetimer (punkt 7.3 b), altså 4,69 %.
      3. **Redusert undervisning** etter punkt 6 (livsfasetiltak): inntil 6 % det første yrkesåret etter fullført utdanning, inntil 6 % fra det kalenderåret læreren fyller 57 år, og inntil 12,5 % fra det kalenderåret læreren fyller 60 år. Reduksjonen regnes som en del av stillingen, som en funksjon.
      4. **Samlet beskjeftigelse** = undervisning + funksjoner + redusert undervisning.
      5. **Differanse** = samlet beskjeftigelse − stillingsprosent. Er differansen negativ, har læreren **teknisk undertid**. Er den positiv og stillingen under 100 %, får læreren **variabel lønn** for delen opp til hel stilling, og **teknisk overtid** for det som er over 100 %. Er stillingen hel, er hele differansen teknisk overtid. Differansen kan regnes om til **årsrammetimer** i et fag: differanse × årsramme ÷ 100.

      Mellomregningene avrundes ikke. Svaret vises med to desimaler.

      **Fordelingen av arbeidstiden** vises også før noe er fylt ut. Årsverket er 1687,5 timer, eller 1650 timer for lærere som er 60 år og eldre (punkt 4). De 37,5 timene er fem arbeidsdager ekstra ferie, og planfestet tid er samme andel av årsverket som for andre lærere: 1150 × 1650 ÷ 1687,5 = 1124,44 timer. Da tas ferien like mye fra planfestet tid og tiden læreren disponerer selv. I videregående er 1150 timer planfestet, og resten disponerer læreren selv (punkt 5.1 og 5.2).

      - **Undervisning** er årstimene i fagene. **Møtetid** er møtetimene per uke × 38 uker.
      - For undervisningsdelen er planfestet tid 1150 × prosent (1124,44 × prosent fra 60 år). Det som ikke går til undervisning og møter, er **annen planfestet tid**. Tiden læreren **disponerer selv**, er (årsverk − 1150) × prosent.
      - **Funksjoner som utvider planfestet tid** gir funksjonstid = årsverk × prosent, all planfestet. For hel stilling gir det samme planfestede tid som punkt 5.3: tiden læreren disponerer selv, reduseres med samme prosent som undervisningen, og planfestet tid øker like mye.
      - **Funksjoner som ikke utvider planfestet tid**, og **redusert undervisning**, fordeles som undervisningen: 1150 × prosent planfestet tid og resten til tid læreren disponerer selv. For nyutdannede og lærere over 60 år sier punkt 6 at den frigjorte tiden legges i planfestet tid, der den erstatter undervisning. Appen bruker den samme regelen for 57-åringer, uten at det står uttrykkelig i avtaleteksten.
      - Den delen av stillingen som ikke er fylt med fag og funksjoner, fordeles som undervisningsdelen. En hel stilling uten fag og funksjoner gir 1150 timer annen planfestet tid og 537,5 timer tid læreren disponerer selv.
      - Får ikke møtetiden plass i den planfestede tiden for undervisningsdelen, for eksempel når stillingen bare er funksjon, legges resten i funksjonstiden.
      - **Planleggingsdager:** Arbeidsåret er elevenes skoleår (190 dager) og 6 dager, altså 196 dager (punkt 4 a). De 6 dagene står på egen linje som planleggingsdager: 6 × 7,5 = 45 timer for en lærer i hel stilling, tatt fra annen planfestet tid. Samme antall brukes for alle, slik Visma InSchool gjør, og det kan endres for den enkelte, for eksempel ved deltid eller for en periode.
      - **Timer per uke** er timene utenom planleggingsdagene delt på de 38 skoleukene. Hel stilling uten funksjoner gir (1150 − 45) ÷ 38 = 29,1 timer planfestet tid per uke.
      - **Utvidelse:** Planfestet tid kan være høyst 37,5 timer per uke (punkt 5.1), altså 37,5 × 38 + 45 = 1470 timer i et arbeidsår på 196 dager. Blir den mer, utvides arbeidsåret: timene over grensen ÷ 7,5 gir dagene arbeidsåret utvides med. 100 % funksjon gir 29 dager, i alt 225 dager = 1687,5 ÷ 7,5. For lærere som er 60 år og eldre er arbeidsåret fem dager kortere (191 dager), og grensen 37,5 timer mindre.

      For stillinger under 100 % er tiden regnet forholdsmessig. Diagrammet er en illustrasjon. Hvordan tiden fordeles, avtales på skolen.

      **Lønn i året** = årslønn i stillingen + tillegg + variabel lønn + overtidsbetaling.

      - **Årslønn i stillingen** = årslønn i hel stilling × stillingsprosent ÷ 100. Årslønnen i hel stilling er garantilønnen for stillingsgruppe og ansiennitet i hovedtariffavtalen, eller lønnen du skriver inn.
      - **Tillegg** velges ved hver funksjon. Feltet fylles inn med minstegodtgjøringen i SFS 2213 punkt 9.1: 12 000 kr i året for kontaktlærer og 12 000 kr for rådgiver eller sosiallærer, etter navnet på funksjonen. Kjennes navnet ikke igjen, brukes beløpet for kontaktlærer. En funksjon kan ha bare tillegg (0 %), og da endrer den ikke fordelingen av tiden. Godtgjøring for andre funksjoner fastsettes lokalt, og du kan skrive inn et annet beløp.
      - **Variabel lønn** betales for beskjeftigelse ut over en stilling under 100 %, opp til hel stilling. Den regnes som vikartimer: prosenten gjøres om til timer i faget (prosent × årsramme ÷ 100), timene × 1400 ÷ årsramme gir kalkulert tid, og kalkulert tid ganges med timelønnen for undervisning. Overtidsbetalingen regnes på samme måte, men med 50 % tillegg.
      - **Overtidsbetaling** regnes som i kalkulatoren for overtid når samlet beskjeftigelse er over 100 %, med årsrammen i faget som er valgt for årsrammetimer.
      - **Feriepenger** regnes som vanlig i prosent av det som utbetales: 12 %, eller 14,3 % for arbeidstakere over 60 år (hovedtariffavtalen § 7.4.2). De kommer i tillegg og er ikke med i lønn i året.

      **En periode.** Arbeidsplanen kan gjelde en del av skoleåret, for eksempel et vikariat. Årsrammene gjelder et helt skoleår, så de gjøres om til en ramme for perioden:

      1. **Periodenøkkel** = undervisningsdager i perioden ÷ undervisningsdager i skoleåret (190 om du ikke skriver inn et annet antall). Dagene telles etter skoleruta.
      2. **Perioderamme** = årsramme × periodenøkkel.
      3. **Beskjeftigelse i perioden** = timene læreren underviser i perioden ÷ perioderammen × 100. Samme metode brukes i Visma InSchool.

      - Skriver du inn økter per uke, trengs antall uker i perioden. Står feltet tomt, regnes ukene ut fra dagene: dager ÷ 5 skoledager per uke. Ukene kan ha ulikt antall skoledager eller ulik timeplan, så skriv inn antall uker eller timene i perioden om det avviker.
      - **Stillingen og funksjonene** gjelder perioden: en funksjon på 10 % er 10 % i perioden.
      - **På årsbasis** er prosenten i perioden × periodenøkkelen. 100 % gjennom halve skoleåret er 50 % for hele året. Timer og kroner er de samme i begge visningene.
      - **Differansen** regnes om til timer i perioden med perioderammen.
      - **Fordelingen** viser timene i perioden: timene for et helt år med de samme prosentene × periodenøkkelen. Planleggingsdagene er timene som er skrevet inn (45 om feltet er tomt), og timene per uke er resten delt på skoleukene i perioden (dager ÷ 5).
      - **Lønn i perioden** = årslønn i stillingen × periodenøkkel + tillegg × periodenøkkel + variabel lønn + overtidsbetaling. Variabel lønn og overtid regnes som vikartimer med timene i perioden.
    nn: |
      Arbeidsplanen samanliknar det læraren skal gjere, med stillinga læraren er tilsett i:

      1. **Undervisning** = summen av sysselsetjinga i kvart fag, årstimar ÷ årsramme × 100 (sjå sysselsetjing).
      2. **Funksjonar** blir oppgitt i prosent av full stilling eller i årsrammetimar. Årsrammetimar blir gjorde om til prosent med årsramma 607,5, som gjeld for lærarar med redusert undervisning på grunn av funksjon (vedlegg 1). Kontaktlærartenesta gir minst 28,5 årsrammetimar (punkt 7.3 b), altså 4,69 %.
      3. **Redusert undervisning** etter punkt 6 (livsfasetiltak): inntil 6 % det første yrkesåret etter fullført utdanning, inntil 6 % frå det kalenderåret læraren fyller 57 år, og inntil 12,5 % frå det kalenderåret læraren fyller 60 år. Reduksjonen blir rekna som ein del av stillinga, som ein funksjon.
      4. **Samla sysselsetjing** = undervisning + funksjonar + redusert undervisning.
      5. **Differanse** = samla sysselsetjing − stillingsprosent. Er differansen negativ, har læraren **teknisk undertid**. Er han positiv og stillinga under 100 %, får læraren **variabel løn** for delen opp til heil stilling, og **teknisk overtid** for det som er over 100 %. Er stillinga heil, er heile differansen teknisk overtid. Differansen kan reknast om til **årsrammetimar** i eit fag: differanse × årsramme ÷ 100.

      Mellomrekningane blir ikkje avrunda. Svaret blir vist med to desimalar.

      **Fordelinga av arbeidstida** blir vist også før noko er fylt ut. Årsverket er 1687,5 timar, eller 1650 timar for lærarar som er 60 år og eldre (punkt 4). Dei 37,5 timane er fem arbeidsdagar ekstra ferie, og planfesta tid er same del av årsverket som for andre lærarar: 1150 × 1650 ÷ 1687,5 = 1124,44 timar. Då blir ferien teken like mykje frå planfesta tid og tida læraren disponerer sjølv. I vidaregåande er 1150 timar planfesta, og resten disponerer læraren sjølv (punkt 5.1 og 5.2).

      - **Undervisning** er årstimane i faga. **Møtetid** er møtetimane per veke × 38 veker.
      - For undervisningsdelen er planfesta tid 1150 × prosent (1124,44 × prosent frå 60 år). Det som ikkje går til undervisning og møte, er **anna planfesta tid**. Tida læraren **disponerer sjølv**, er (årsverk − 1150) × prosent.
      - **Funksjonar som utvidar planfesta tid** gir funksjonstid = årsverk × prosent, all planfesta. For heil stilling gir det same planfesta tid som punkt 5.3: tida læraren disponerer sjølv, blir redusert med same prosent som undervisninga, og planfesta tid aukar like mykje.
      - **Funksjonar som ikkje utvidar planfesta tid**, og **redusert undervisning**, blir fordelte som undervisninga: 1150 × prosent planfesta tid og resten til tid læraren disponerer sjølv. For nyutdanna og lærarar over 60 år seier punkt 6 at den frigjorde tida blir lagd i planfesta tid, der ho erstattar undervisning. Appen bruker den same regelen for 57-åringar, utan at det står uttrykkeleg i avtaleteksten.
      - Den delen av stillinga som ikkje er fylt med fag og funksjonar, blir fordelt som undervisningsdelen. Ei heil stilling utan fag og funksjonar gir 1150 timar anna planfesta tid og 537,5 timar tid læraren disponerer sjølv.
      - Får ikkje møtetida plass i den planfesta tida for undervisningsdelen, til dømes når stillinga berre er funksjon, blir resten lagd i funksjonstida.
      - **Planleggingsdagar:** Arbeidsåret er skuleåret til elevane (190 dagar) og 6 dagar, altså 196 dagar (punkt 4 a). Dei 6 dagane står på eiga linje som planleggingsdagar: 6 × 7,5 = 45 timar for ein lærar i heil stilling, tekne frå anna planfesta tid. Same talet blir brukt for alle, slik Visma InSchool gjer, og det kan endrast for den einskilde, til dømes ved deltid eller for ein periode.
      - **Timar per veke** er timane utanom planleggingsdagane delte på dei 38 skulevekene. Heil stilling utan funksjonar gir (1150 − 45) ÷ 38 = 29,1 timar planfesta tid per veke.
      - **Utviding:** Planfesta tid kan vere høgst 37,5 timar per veke (punkt 5.1), altså 37,5 × 38 + 45 = 1470 timar i eit arbeidsår på 196 dagar. Blir ho meir, blir arbeidsåret utvida: timane over grensa ÷ 7,5 gir dagane arbeidsåret blir utvida med. 100 % funksjon gir 29 dagar, i alt 225 dagar = 1687,5 ÷ 7,5. For lærarar som er 60 år og eldre er arbeidsåret fem dagar kortare (191 dagar), og grensa 37,5 timar mindre.

      For stillingar under 100 % er tida rekna forholdsmessig. Diagrammet er ein illustrasjon. Korleis tida blir fordelt, blir avtalt på skulen.

      **Løn i året** = årsløn i stillinga + tillegg + variabel løn + overtidsbetaling.

      - **Årsløn i stillinga** = årsløn i heil stilling × stillingsprosent ÷ 100. Årsløna i heil stilling er garantiløna for stillingsgruppe og ansiennitet i hovudtariffavtalen, eller løna du skriv inn.
      - **Tillegg** blir valt ved kvar funksjon. Feltet blir fylt inn med minstegodtgjeringa i SFS 2213 punkt 9.1: 12 000 kr i året for kontaktlærar og 12 000 kr for rådgivar eller sosiallærar, etter namnet på funksjonen. Blir namnet ikkje kjent att, blir beløpet for kontaktlærar brukt. Ein funksjon kan ha berre tillegg (0 %), og då endrar han ikkje fordelinga av tida. Godtgjering for andre funksjonar blir fastsett lokalt, og du kan skrive inn eit anna beløp.
      - **Variabel løn** blir betalt for sysselsetjing ut over ei stilling under 100 %, opp til heil stilling. Ho blir rekna som vikartimar: prosenten blir gjord om til timar i faget (prosent × årsramme ÷ 100), timane × 1400 ÷ årsramme gir kalkulert tid, og kalkulert tid blir gonga med timeløna for undervisning. Overtidsbetalinga blir rekna på same måte, men med 50 % tillegg.
      - **Overtidsbetaling** blir rekna som i kalkulatoren for overtid når samla sysselsetjing er over 100 %, med årsramma i faget som er valt for årsrammetimar.
      - **Feriepengar** blir rekna som vanleg i prosent av det som blir utbetalt: 12 %, eller 14,3 % for arbeidstakarar over 60 år (hovudtariffavtalen § 7.4.2). Dei kjem i tillegg og er ikkje med i løn i året.

      **Ein periode.** Arbeidsplanen kan gjelde ein del av skuleåret, til dømes eit vikariat. Årsrammene gjeld eit heilt skuleår, så dei blir gjorde om til ei ramme for perioden:

      1. **Periodenøkkel** = undervisningsdagar i perioden ÷ undervisningsdagar i skuleåret (190 om du ikkje skriv inn eit anna tal). Dagane blir talde etter skuleruta.
      2. **Perioderamme** = årsramme × periodenøkkel.
      3. **Sysselsetjing i perioden** = timane læraren underviser i perioden ÷ perioderamma × 100. Same metode blir brukt i Visma InSchool.

      - Skriv du inn økter per veke, trengst talet på veker i perioden. Står feltet tomt, blir vekene rekna ut frå dagane: dagar ÷ 5 skuledagar per veke. Vekene kan ha ulikt tal på skuledagar eller ulik timeplan, så skriv inn talet på veker eller timane i perioden om det avvik.
      - **Stillinga og funksjonane** gjeld perioden: ein funksjon på 10 % er 10 % i perioden.
      - **På årsbasis** er prosenten i perioden × periodenøkkelen. 100 % gjennom halve skuleåret er 50 % for heile året. Timar og kroner er dei same i begge visingane.
      - **Differansen** blir rekna om til timar i perioden med perioderamma.
      - **Fordelinga** viser timane i perioden: timane for eit heilt år med dei same prosentane × periodenøkkelen. Planleggingsdagane er timane som er skrivne inn (45 om feltet er tomt), og timane per veke er resten delt på skulevekene i perioden (dagar ÷ 5).
      - **Løn i perioden** = årsløn i stillinga × periodenøkkel + tillegg × periodenøkkel + variabel løn + overtidsbetaling. Variabel løn og overtid blir rekna som vikartimar med timane i perioden.
