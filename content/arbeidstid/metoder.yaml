- id: metode-beskjeftigelse
  type: forklaring
  tittel: { nb: Slik regnes beskjeftigelsen ut, nn: Slik blir sysselsetjinga rekna ut }
  tekst:
    nb: |
      Beskjeftigelsen er hvor stor del av en hel stilling undervisningen i et fag utgjør:

      **årstimer ÷ årsramme × 100**

      - **Årstimer** er timene gruppen skal ha i faget i løpet av skoleåret, i 60-minutters timer. Skriver du inn økter per uke, regnes de om: økter × minutter ÷ 60 × antall uker (38 uker for hele skoleåret).
      - **Årsrammen** er antallet undervisningstimer i faget som utgjør en hel stilling. Den står i vedlegg 1 til SFS 2213, i 60- og 45-minutters enheter. Kalkulatoren regner i 60-minutters timer.
      - **Fag merket \*** i vedlegget får årsrammen økt med 52,5 timer (70 i 45-minutters enheter) når det faktiske antallet elever i klassen er 1–15.
      - **Blandede grupper:** Har læreren elever fra ulike utdanningsprogram, programfag eller nivåer med ulike årsrammer i samme time, brukes laveste årsramme.
      - **Flere fag:** Beskjeftigelsen regnes for hver gruppe og summeres. Mellomregningene avrundes ikke. Svaret vises med to desimaler.
    nn: |
      Sysselsetjinga er kor stor del av ei heil stilling undervisninga i eit fag utgjer:

      **årstimar ÷ årsramme × 100**

      - **Årstimar** er timane gruppa skal ha i faget i løpet av skuleåret, i 60-minutts timar. Skriv du inn økter per veke, blir dei rekna om: økter × minutt ÷ 60 × tal på veker (38 veker for heile skuleåret).
      - **Årsramma** er talet på undervisningstimar i faget som utgjer ei heil stilling. Ho står i vedlegg 1 til SFS 2213, i 60- og 45-minutts einingar. Kalkulatoren reknar i 60-minutts timar.
      - **Fag merkte \*** i vedlegget får årsramma auka med 52,5 timar (70 i 45-minutts einingar) når det faktiske talet på elevar i klassen er 1–15.
      - **Blanda grupper:** Har læraren elevar frå ulike utdanningsprogram, programfag eller nivå med ulike årsrammer i same time, blir den lågaste årsramma brukt.
      - **Fleire fag:** Sysselsetjinga blir rekna for kvar gruppe og summert. Mellomrekningane blir ikkje avrunda. Svaret blir vist med to desimalar.
  kilder:
    - { id: ks-sfs2213-avtaletekst, punkt: "5.2" }
    - { id: ks-sfs2213-avtaletekst, punkt: Vedlegg 1 }
