# Veiviser: aktivitetsplikten trinn for trinn (fase 7, avgjørelse 041). Egne ord. Bygger på opplæringslova kapittel 12
# og Udirs rundskriv om skolemiljø (sist endret 17.08.2026). For privatskoler gjelder kapittel 12 etter
# privatskolelova § 2-4, med «dagleg leiar» for rektor og «skolens styre» eller «skolen» for kommunen og
# fylkeskommunen (avgjørelse 075).
- id: aktivitetsplikten
  type: veiviser
  tittel:
    nb: Aktivitetsplikten
    nn: Aktivitetsplikta
  tekst:
    nb: Alle elever har rett til et trygt og godt skolemiljø. Når en elev ikke har det, har skolen en aktivitetsplikt. Her er hva skolen gjør steg for steg, hvem som har ansvaret, hva som skal dokumenteres og når eleven kan melde saken til statsforvalteren.
    nn: Alle elevar har rett til eit trygt og godt skulemiljø. Når ein elev ikkje har det, har skulen ei aktivitetsplikt. Her er kva skulen gjer steg for steg, kven som har ansvaret, kva som skal dokumenterast og når eleven kan melde saka til statsforvaltaren.
  start: am-start
  farge: indigo
  rekkefolge: 40
  faser:
    - { id: hverdagen, tittel: { nb: Når du ser noe, nn: Når du ser noko } }
    - { id: melde, tittel: { nb: Melde fra, nn: Melde frå } }
    - { id: saken, tittel: { nb: Skolen følger opp, nn: Skulen følgjer opp } }
    - { id: statsforvalteren, tittel: { nb: Eleven og statsforvalteren, nn: Eleven og statsforvaltaren } }
  kilder:
    - { id: opplaeringslova, punkt: "Kapittel 12 Skolemiljø", url: "https://lovdata.no/lov/2023-06-09-30/kap12" }
    - { id: udir-rundskriv-skolemiljo, punkt: "6. Skolen har en aktivitetsplikt", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er de tre veiene (den som arbeider på skolen, rektor og ledelsen, eleven og foreldrene) og de fire fasene en dekkende og ikke misvisende inndeling av aktivitetsplikten?"
  stikkord: [veiviser, aktivitetsplikt, skolemiljø, mobbing, krenkelser, tiltaksplan, aktivitetsplan, statsforvalteren]

- id: am-start
  type: steg
  veiviser: aktivitetsplikten
  tittel:
    nb: Hvem er du i saken?
    nn: Kven er du i saka?
  tekst:
    nb: Aktivitetsplikten gjelder alle som arbeider på skolen, også de som er fast på skolen uten å være ansatt der, for eksempel i renhold og kantine, helsesykepleier, lærlinger og praksisstudenter. De skal følge med, gripe inn og melde fra til rektor. Rektor og skolen undersøker saken og setter inn tiltak. Eleven og foreldrene kan melde saken til statsforvalteren når skolen ikke gjør nok.
    nn: Aktivitetsplikta gjeld alle som arbeider på skulen, også dei som er fast på skulen utan å vere tilsette der, til dømes i reinhald og kantine, helsesjukepleiar, lærlingar og praksisstudentar. Dei skal følgje med, gripe inn og melde frå til rektor. Rektor og skulen undersøkjer saka og set inn tiltak. Eleven og foreldra kan melde saka til statsforvaltaren når skulen ikkje gjer nok.
  sporsmal:
    tekst:
      nb: Hvem er du i saken?
      nn: Kven er du i saka?
    svar:
      - { id: ansatt, tekst: { nb: "Jeg arbeider på skolen og har sett, hørt eller fått vite noe", nn: "Eg arbeider på skulen og har sett, høyrt eller fått vite noko" }, neste: am-folge-med }
      - { id: rektor, tekst: { nb: "Jeg er rektor eller i ledelsen, og skolen har fått vite om saken", nn: "Eg er rektor eller i leiinga, og skulen har fått vite om saka" }, neste: am-undersoke }
      - { id: elev, tekst: { nb: "Jeg er elev eller forelder og mener skolen ikke gjør nok", nn: "Eg er elev eller forelder og meiner skulen ikkje gjer nok" }, neste: am-elev }
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.2.1 Hvem er «alle som arbeider på skolen»?", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.2.1-hvem-er-alle-som-arbeider-pa-skolen" }
    - { id: opplaeringslova, punkt: "§ 12-2 Retten til eit trygt og godt skolemiljø", url: "https://lovdata.no/lov/2023-06-09-30/§12-2" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å dele veiviseren i tre veier etter hvem brukeren er (den som arbeider på skolen, rektor og ledelsen, eleven og foreldrene)?"
    - "Er oppramsingen av hvem som regnes som «alle som arbeider på skolen» riktig sammenfattet fra rundskrivet 6.2.1?"

- id: am-folge-med
  type: steg
  veiviser: aktivitetsplikten
  fase: hverdagen
  tittel:
    nb: Følge med
    nn: Følgje med
  tekst:
    nb: Alle som arbeider på skolen, skal følge med på hvordan elevene har det, hele skoledagen, både i timene og i friminuttene. Det betyr å observere aktivt og ha lav terskel for å bry seg. Skolen har et særlig ansvar for elever som er sårbare.
    nn: Alle som arbeider på skulen, skal følgje med på korleis elevane har det, heile skuledagen, både i timane og i friminutta. Det tyder å observere aktivt og ha låg terskel for å bry seg. Skulen har eit særleg ansvar for elevar som er sårbare.
  ansvar:
    nb: Alle som arbeider på skolen.
    nn: Alle som arbeider på skulen.
  dokumentasjon:
    nb: Det skolen gjør for å følge med, for eksempel inspeksjonslogger og rutiner.
    nn: Det skulen gjer for å følgje med, til dømes inspeksjonsloggar og rutinar.
  frist:
    nb: Hele tiden.
    nn: Heile tida.
  paragrafer: [opplaeringslova/12-4, opplaeringslova/12-3]
  sporsmal:
    tekst:
      nb: Hva har du sett, hørt eller fått vite?
      nn: Kva har du sett, høyrt eller fått vite?
    svar:
      - { id: krenker, tekst: { nb: "Noen krenker en elev nå", nn: "Nokon krenkjer ein elev no" }, neste: am-gripe-inn }
      - { id: mistanke, tekst: { nb: "Jeg mistenker eller vet at en elev ikke har det trygt og godt, eller eleven har sagt det selv", nn: "Eg mistenkjer eller veit at ein elev ikkje har det trygt og godt, eller eleven har sagt det sjølv" }, neste: am-melde }
      - { id: ansatt-krenker, tekst: { nb: "Jeg mistenker at en som arbeider på skolen, krenker en elev", nn: "Eg mistenkjer at ein som arbeider på skulen, krenkjer ein elev" }, neste: am-skjerpet }
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.1 Plikt til å følge med", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.1-plikt-til-a-folge-med" }
    - { id: opplaeringslova, punkt: "§ 12-4 første ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Er inspeksjonslogger og rutiner gode eksempler på dokumentasjon av plikten til å følge med?"

- id: am-gripe-inn
  type: steg
  veiviser: aktivitetsplikten
  fase: hverdagen
  tittel:
    nb: Gripe inn
    nn: Gripe inn
  tekst:
    nb: Ser du at noen krenker en elev, skal du gripe inn når det er mulig. Plikten gjelder krenkelser som skjer mens du er der. Den gir ikke i seg selv rett til å gripe inn fysisk. Fysisk inngripen er siste utvei og krever at vilkårene i opplæringslova § 13-4 er oppfylt.
    nn: Ser du at nokon krenkjer ein elev, skal du gripe inn når det er mogleg. Plikta gjeld krenkingar som skjer medan du er der. Ho gir ikkje i seg sjølv rett til å gripe inn fysisk. Fysisk inngripen er siste utveg og krev at vilkåra i opplæringslova § 13-4 er oppfylte.
  ansvar:
    nb: Den som ser krenkelsen.
    nn: Den som ser krenkinga.
  frist:
    nb: Med en gang, når det er mulig.
    nn: Med ein gong, når det er mogleg.
  fristKort: { nb: "Med en gang", nn: "Med ein gong" }
  paragrafer: [opplaeringslova/12-4, opplaeringslova/13-4]
  neste: am-melde
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.2 Plikt til å gripe inn", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.2-plikt-til-a-gripe-inn" }
    - { id: opplaeringslova, punkt: "§ 12-4 første ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-4" }
    - { id: opplaeringslova, punkt: "§ 13-4 Fysiske inngrep for å avverje skade m.m.", url: "https://lovdata.no/lov/2023-06-09-30/§13-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Er setningen om fysisk inngripen riktig og ikke for kort, sett opp mot rundskrivet 6.3.2 slik det ble endret 16.04.2026?"

- id: am-melde
  type: steg
  veiviser: aktivitetsplikten
  fase: melde
  tittel:
    nb: Melde fra til rektor
    nn: Melde frå til rektor
  tekst:
    nb: Har du mistanke om eller vet at en elev ikke har det trygt og godt, skal du melde fra til rektor. Det gjelder også når eleven sier det selv. Terskelen er lav. Hvor raskt du må melde fra, avhenger av hvor alvorlig saken er, og skolen skal ha rutiner for det. I alvorlige tilfeller melder rektor fra til fylkeskommunen. Når du har meldt fra, undersøker skolen saken og setter inn tiltak. [Slik følger skolen opp saken](#/skolemiljo/aktivitetsplikten?steg=am-undersoke&svar=rektor).
    nn: Har du mistanke om eller veit at ein elev ikkje har det trygt og godt, skal du melde frå til rektor. Det gjeld også når eleven seier det sjølv. Terskelen er låg. Kor raskt du må melde frå, avheng av kor alvorleg saka er, og skulen skal ha rutinar for det. I alvorlege tilfelle melder rektor frå til fylkeskommunen. Når du har meldt frå, undersøkjer skulen saka og set inn tiltak. [Slik følgjer skulen opp saka](#/skolemiljo/aktivitetsplikten?steg=am-undersoke&svar=rektor).
  ansvar:
    nb: Alle som arbeider på skolen, melder fra. Rektor kan la andre ta imot meldingene, men har ansvaret.
    nn: Alle som arbeider på skulen, melder frå. Rektor kan la andre ta imot meldingane, men har ansvaret.
  dokumentasjon:
    nb: At det er meldt fra, og at rektor har meldt fra til fylkeskommunen i alvorlige tilfeller.
    nn: At det er meldt frå, og at rektor har meldt frå til fylkeskommunen i alvorlege tilfelle.
  frist:
    nb: Etter hvor alvorlig saken er, i noen saker straks.
    nn: Etter kor alvorleg saka er, i nokre saker straks.
  fristKort: { nb: "Etter alvor", nn: "Etter alvor" }
  forklaring:
    nb: Meldeplikten til rektor er noe annet enn meldeplikten til barnevernet. Se [Hvem melder hva til hvem](#/skolemiljo/trygt-og-godt-skolemiljo?del=k12-meldeplikter). Skolen skal også gi foreldrene informasjon. Helsesykepleieren kan være bundet av taushetsplikten etter helsepersonelloven.
    nn: Meldeplikta til rektor er noko anna enn meldeplikta til barnevernet. Sjå [Kven melder kva til kven](#/skolemiljo/trygt-og-godt-skolemiljo?del=k12-meldeplikter). Skulen skal også gi foreldra informasjon. Helsesjukepleiaren kan vere bunden av teieplikta etter helsepersonellova.
  paragrafer: [opplaeringslova/12-4, opplaeringslova/10-8]
  privatskole:
    tekst:
      nb: "For privatskoler gjelder opplæringslova kapittel 12 etter privatskolelova § 2-4. Der loven sier rektor, gjelder det daglig leder. Daglig leder skal melde fra til skolens styre i alvorlige tilfeller, ikke til fylkeskommunen."
      nn: "For privatskular gjeld opplæringslova kapittel 12 etter privatskolelova § 2-4. Der lova seier rektor, gjeld det dagleg leiar. Dagleg leiar skal melde frå til styret ved skulen i alvorlege tilfelle, ikkje til fylkeskommunen."
    kilder:
      - { id: privatskolelova, punkt: "§ 2-4 Krav til skoleanlegg og skolemiljø", url: "https://lovdata.no/lov/2003-07-04-84/§2-4" }
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.3 Plikt til å melde fra", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.3-plikt-til-a-melde-fra" }
    - { id: opplaeringslova, punkt: "§ 12-4 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-4" }
    - { id: opplaeringslova, punkt: "§ 10-8 Informasjon til elevane og foreldra", url: "https://lovdata.no/lov/2023-06-09-30/§10-8" }
  kontrollert: null
  kontrollsporsmal:
    - "Rundskrivet sier at det avhenger av alvoret hvor raskt det må meldes fra (straks, ved slutten av dagen eller ukentlig). Er «etter hvor alvorlig saken er» en god nok kortform?"
    - "Er det riktig at foreldrene skal få informasjon i saken (§ 10-8), og bør steget si når?"
    - "Privatskoler (pl. § 2-4): Er det riktig lest at «skolens styre» erstatter fylkeskommunen i § 12-4 andre ledd, slik at daglig leder melder til styret?"

- id: am-skjerpet
  type: steg
  veiviser: aktivitetsplikten
  fase: melde
  tittel:
    nb: Når en som arbeider på skolen, krenker en elev
    nn: Når ein som arbeider på skulen, krenkjer ein elev
  tekst:
    nb: Har du mistanke om eller vet at en som arbeider på skolen, krenker en elev, skal du melde fra til rektor straks. Rektor melder videre til fylkeskommunen, med mindre meldingen er åpenbart grunnløs. Gjelder det noen i ledelsen, melder du fra direkte til fylkeskommunen. Aktivitetsplikten gjelder som ellers, så lenge eleven ikke har det trygt og godt. [Slik følger skolen opp saken](#/skolemiljo/aktivitetsplikten?steg=am-undersoke&svar=rektor).
    nn: Har du mistanke om eller veit at ein som arbeider på skulen, krenkjer ein elev, skal du melde frå til rektor straks. Rektor melder vidare til fylkeskommunen, med mindre meldinga er openbert grunnlaus. Gjeld det nokon i leiinga, melder du frå direkte til fylkeskommunen. Aktivitetsplikta gjeld som elles, så lenge eleven ikkje har det trygt og godt. [Slik følgjer skulen opp saka](#/skolemiljo/aktivitetsplikten?steg=am-undersoke&svar=rektor).
  ansvar:
    nb: Den som får mistanke eller kjennskap, og rektor.
    nn: Den som får mistanke eller kjennskap, og rektor.
  dokumentasjon:
    nb: Meldingen til rektor og rektors melding til fylkeskommunen.
    nn: Meldinga til rektor og meldinga frå rektor til fylkeskommunen.
  frist:
    nb: Straks, senest i neste pause eller friminutt.
    nn: Straks, seinast i neste pause eller friminutt.
  fristKort: { nb: "Straks", nn: "Straks" }
  forklaring:
    nb: Terskelen for at en melding er åpenbart grunnløs, er høy, og rektor skal ikke undersøke saken grundig før han eller hun melder videre. At eleven opplever noe som krenkende, avgjør ikke alene om en ansatt har krenket. Irettesettelser og uenighet om vurdering er ikke krenkelser i seg selv.
    nn: Terskelen for at ei melding er openbert grunnlaus, er høg, og rektor skal ikkje undersøkje saka grundig før han eller ho melder vidare. At eleven opplever noko som krenkjande, avgjer ikkje åleine om ein tilsett har krenkt. Irettesetjingar og usemje om vurdering er ikkje krenkingar i seg sjølve.
  paragrafer: [opplaeringslova/12-5]
  privatskole:
    tekst:
      nb: "For privatskoler gjelder dette etter privatskolelova § 2-4. Daglig leder har rektors plikter, og meldingen går til skolens styre i stedet for fylkeskommunen."
      nn: "For privatskular gjeld dette etter privatskolelova § 2-4. Dagleg leiar har pliktene til rektor, og meldinga går til styret ved skulen i staden for fylkeskommunen."
    kilder:
      - { id: privatskolelova, punkt: "§ 2-4 Krav til skoleanlegg og skolemiljø", url: "https://lovdata.no/lov/2003-07-04-84/§2-4" }
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.4 Skjerpet plikt til å melde fra hvis en som arbeider på skolen, krenker elever", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.4-skjerpet-plikt-til-a-melde-fra-hvis-en-som-arbeider-pa-skolen-krenker-elever" }
    - { id: opplaeringslova, punkt: "§ 12-5 Skjerpa plikt til å melde frå dersom ein som arbeider på skolen, krenkjer ein elev", url: "https://lovdata.no/lov/2023-06-09-30/§12-5" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «senest i neste pause eller friminutt» riktig gjengitt fra rundskrivet 6.3.4?"
    - "Privatskoler (pl. § 2-4): Er det riktig at meldingen etter § 12-5 går til skolens styre, også når det gjelder noen i ledelsen?"

- id: am-undersoke
  type: steg
  veiviser: aktivitetsplikten
  fase: saken
  tittel:
    nb: Undersøke saken
    nn: Undersøkje saka
  tekst:
    nb: Skolen skal undersøke saken snarest. Målet er å få fram hva som har skjedd, hvordan eleven opplever situasjonen og hva i omgivelsene som påvirker den. Skolen skal høre eleven og de andre som er involvert, men skal ikke føre bevis for eller mot noen. Utsetter skolen undersøkelsen, må den ha en god grunn.
    nn: Skulen skal undersøkje saka snarast. Målet er å få fram kva som har skjedd, korleis eleven opplever situasjonen og kva i omgivnadene som påverkar han. Skulen skal høyre eleven og dei andre som er involverte, men skal ikkje føre bevis for eller mot nokon. Utset skulen undersøkinga, må han ha ein god grunn.
  ansvar:
    nb: Skolen. Rektor har ansvaret.
    nn: Skulen. Rektor har ansvaret.
  dokumentasjon:
    nb: Hva skolen har gjort for å undersøke saken, og at eleven er hørt.
    nn: Kva skulen har gjort for å undersøkje saka, og at eleven er høyrd.
  frist:
    nb: Snarest, så fort det lar seg gjøre.
    nn: Snarast, så fort det let seg gjere.
  fristKort: { nb: "Snarest", nn: "Snarast" }
  paragrafer: [opplaeringslova/12-4]
  neste: am-tiltak
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.5 Plikt til å undersøke", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.5-plikt-til-a-undersoke" }
    - { id: udir-rundskriv-skolemiljo, punkt: "6.5 Elevens rett til å bli hørt og plikten til å ta hensyn til elevens beste", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.5-elevens-rett-til-a-bli-hort-og-plikten-til-a-ta-hensyn-til-elevens-beste" }
    - { id: opplaeringslova, punkt: "§ 12-4 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «Rektor har ansvaret» riktig, eller bør ansvaret for undersøkelsen beskrives som skolens?"

- id: am-tiltak
  type: steg
  veiviser: aktivitetsplikten
  fase: saken
  tittel:
    nb: Tiltak og tiltaksplan
    nn: Tiltak og tiltaksplan
  tekst:
    nb: "Skolen skal rette opp situasjonen med egnede tiltak. Det er elevens egen opplevelse som utløser plikten, og skolen skal ikke bagatellisere den. Tiltakene skal bygge på en pedagogisk og faglig vurdering og være lovlige. Samtidig lager skolen en skriftlig plan, en tiltaksplan (ofte kalt aktivitetsplan). Den skal minst si:\n\n- hvilket problem tiltakene skal løse\n- hvilke tiltak skolen har planlagt\n- når tiltakene skal gjennomføres\n- hvem som skal gjennomføre dem\n- når de skal evalueres"
    nn: "Skulen skal rette opp situasjonen med eigna tiltak. Det er den eigne opplevinga til eleven som utløyser plikta, og skulen skal ikkje bagatellisere henne. Tiltaka skal byggje på ei pedagogisk og fagleg vurdering og vere lovlege. Samtidig lagar skulen ein skriftleg plan, ein tiltaksplan (ofte kalla aktivitetsplan). Han skal minst seie:\n\n- kva problem tiltaka skal løyse\n- kva tiltak skulen har planlagt\n- når tiltaka skal gjennomførast\n- kven som skal gjennomføre dei\n- når dei skal evaluerast"
  ansvar:
    nb: Skolen. Rektor har ansvaret.
    nn: Skulen. Rektor har ansvaret.
  dokumentasjon:
    nb: Tiltaksplanen. Planen er et levende dokument som oppdateres når tiltakene endres.
    nn: Tiltaksplanen. Planen er eit levande dokument som blir oppdatert når tiltaka blir endra.
  frist:
    nb: Snarest. Planen lages samtidig med at tiltakene settes inn.
    nn: Snarast. Planen blir laga samtidig med at tiltaka blir sette inn.
  fristKort: { nb: "Snarest", nn: "Snarast" }
  forklaring:
    nb: Skolen kan ikke bruke ulovlig makt, tvang eller isolasjon. Skolen kan for eksempel flytte en elev til en annen klasse uten enkeltvedtak. En plan kan også gjelde en situasjon som berører flere elever.
    nn: Skulen kan ikkje bruke ulovleg makt, tvang eller isolasjon. Skulen kan til dømes flytte ein elev til ein annan klasse utan enkeltvedtak. Ein plan kan også gjelde ein situasjon som rører ved fleire elevar.
  paragrafer: [opplaeringslova/12-4]
  neste: am-dokumentere
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.6 Plikt til å sette inn tiltak", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.6-plikt-til-a-sette-inn-tiltak" }
    - { id: udir-rundskriv-skolemiljo, punkt: "6.4.3 Skriftlig tiltaksplan når skolen setter inn tiltak", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.4.3-skriftlig-tiltaksplan-nar-skolen-setter-inn-tiltak" }
    - { id: opplaeringslova, punkt: "§ 12-4 andre og tredje ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Rundskrivet kaller planen «tiltaksplan». Er det riktig å nevne at den ofte kalles aktivitetsplan, og bør appen bruke ett av ordene?"
    - "Er eksemplet om å flytte en elev til en annen klasse uten enkeltvedtak riktig og ikke misvisende?"

- id: am-dokumentere
  type: steg
  veiviser: aktivitetsplikten
  fase: saken
  tittel:
    nb: Dokumentere
    nn: Dokumentere
  tekst:
    nb: Skolen skal dokumentere det den gjør for å oppfylle aktivitetsplikten, i den formen og det omfanget som er nødvendig. Det eneste formkravet er at dokumentasjonen er skriftlig. Skolen trenger ikke et eget system. Det skal gå fram at eleven er hørt, og at hensynet til elevens beste er vurdert.
    nn: Skulen skal dokumentere det han gjer for å oppfylle aktivitetsplikta, i den forma og det omfanget som er nødvendig. Det einaste formkravet er at dokumentasjonen er skriftleg. Skulen treng ikkje eit eige system. Det skal gå fram at eleven er høyrd, og at omsynet til det beste for eleven er vurdert.
  ansvar:
    nb: Skolen. Rektor har ansvaret.
    nn: Skulen. Rektor har ansvaret.
  dokumentasjon:
    nb: For eksempel meldeskjemaer, samtalereferater, inspeksjonslogger og tiltaksplanen.
    nn: Til dømes meldeskjema, samtalereferat, inspeksjonsloggar og tiltaksplanen.
  frist:
    nb: Løpende, mens saken pågår.
    nn: Løpande, medan saka går føre seg.
  paragrafer: [opplaeringslova/12-4]
  neste: am-evaluere
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.4 Dokumentasjonskravene", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.4-dokumentasjonskravene" }
    - { id: opplaeringslova, punkt: "§ 12-4 fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Er eksemplene på dokumentasjon dekkende, og bør fylkets eget system (f.eks. et fagsystem) nevnes som fylkesinnhold?"

- id: am-evaluere
  type: steg
  veiviser: aktivitetsplikten
  fase: saken
  tittel:
    nb: Følge opp og evaluere
    nn: Følgje opp og evaluere
  tekst:
    nb: Skolen skal følge opp tiltakene og evaluere dem når planen sier. Virker de ikke, justerer skolen tiltakene eller setter inn nye. Plikten varer til eleven har det trygt og godt.
    nn: Skulen skal følgje opp tiltaka og evaluere dei når planen seier. Verkar dei ikkje, justerer skulen tiltaka eller set inn nye. Plikta varer til eleven har det trygt og godt.
  ansvar:
    nb: Skolen. Rektor har ansvaret.
    nn: Skulen. Rektor har ansvaret.
  dokumentasjon:
    nb: Evalueringen og endringene i tiltaksplanen.
    nn: Evalueringa og endringane i tiltaksplanen.
  frist:
    nb: Når planen sier at tiltakene skal evalueres.
    nn: Når planen seier at tiltaka skal evaluerast.
  paragrafer: [opplaeringslova/12-4]
  sporsmal:
    tekst:
      nb: Har eleven det trygt og godt nå?
      nn: Har eleven det trygt og godt no?
    svar:
      - { id: ja, tekst: { nb: "Ja", nn: "Ja" }, neste: am-trygt }
      - { id: nei, tekst: { nb: "Nei, tiltakene virker ikke godt nok", nn: "Nei, tiltaka verkar ikkje godt nok" }, neste: am-tiltak }
      - { id: statsforvalteren, tekst: { nb: "Eleven eller foreldrene har meldt saken til statsforvalteren", nn: "Eleven eller foreldra har meldt saka til statsforvaltaren" }, neste: am-sf-skolen }
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.6 Plikt til å sette inn tiltak", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.6-plikt-til-a-sette-inn-tiltak" }
    - { id: opplaeringslova, punkt: "§ 12-4 tredje ledd bokstav e", url: "https://lovdata.no/lov/2023-06-09-30/§12-4" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å skrive at plikten varer til eleven har det trygt og godt?"

- id: am-trygt
  type: steg
  veiviser: aktivitetsplikten
  fase: saken
  tittel:
    nb: Eleven har det trygt og godt
    nn: Eleven har det trygt og godt
  tekst:
    nb: Når eleven har det trygt og godt, er aktivitetsplikten oppfylt i saken. Skolen fortsetter å følge med på eleven, som på alle elever. Dokumentasjonen tas vare på.
    nn: Når eleven har det trygt og godt, er aktivitetsplikta oppfylt i saka. Skulen held fram med å følgje med på eleven, som på alle elevar. Dokumentasjonen blir teken vare på.
  paragrafer: [opplaeringslova/12-4]
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.6 Plikt til å sette inn tiltak", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.6-plikt-til-a-sette-inn-tiltak" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «dokumentasjonen tas vare på» riktig og nok, eller bør steget vise til arkivlova og fylkets arkivplan?"

- id: am-statsforvalteren
  type: steg
  veiviser: aktivitetsplikten
  fase: statsforvalteren
  tittel:
    nb: Melde saken til statsforvalteren
    nn: Melde saka til statsforvaltaren
  tekst:
    nb: Mener eleven eller foreldrene at skolen ikke gjør nok, kan de melde saken til statsforvalteren. Saken må være tatt opp med rektor for minst en uke siden. Eleven kan melde selv, uansett alder. Statsforvalteren vurderer bare om skolen har satt inn egnede tiltak og laget en tiltaksplan. Har skolen ikke gjort det, pålegger statsforvalteren som hovedregel fylkeskommunen å rette det, med en frist. I særlige tilfeller bestemmer statsforvalteren selv hva skolen skal gjøre.
    nn: Meiner eleven eller foreldra at skulen ikkje gjer nok, kan dei melde saka til statsforvaltaren. Saka må vere teken opp med rektor for minst ei veke sidan. Eleven kan melde sjølv, uansett alder. Statsforvaltaren vurderer berre om skulen har sett inn eigna tiltak og laga ein tiltaksplan. Har skulen ikkje gjort det, pålegg statsforvaltaren som hovudregel fylkeskommunen å rette det, med ein frist. I særlege tilfelle bestemmer statsforvaltaren sjølv kva skulen skal gjere.
  ansvar:
    nb: Eleven eller foreldrene melder. Fylkeskommunen gir statsforvalteren opplysningene som trengs.
    nn: Eleven eller foreldra melder. Fylkeskommunen gir statsforvaltaren opplysningane som trengst.
  frist:
    nb: Saken må være tatt opp med rektor minst en uke, altså fem arbeidsdager, før. Statsforvalteren kan gjøre unntak når det er særlige grunner.
    nn: Saka må vere teken opp med rektor minst ei veke, altså fem arbeidsdagar, før. Statsforvaltaren kan gjere unntak når det er særlege grunnar.
  fristKort: { nb: "Etter en uke", nn: "Etter ei veke" }
  forklaring:
    nb: Statsforvalterens avgjørelse er et enkeltvedtak. Eleven og foreldrene kan klage til Utdanningsdirektoratet innen tre uker. Skolen og fylkeskommunen kan ikke klage. Statsforvalteren kan ilegge tvangsmulkt hvis vedtaket ikke følges.
    nn: Avgjerda til statsforvaltaren er eit enkeltvedtak. Eleven og foreldra kan klage til Utdanningsdirektoratet innan tre veker. Skulen og fylkeskommunen kan ikkje klage. Statsforvaltaren kan påleggje tvangsmulkt dersom vedtaket ikkje blir følgt.
  paragrafer: [opplaeringslova/12-6, opplaeringslova/12-8]
  privatskole:
    tekst:
      nb: "Elever ved privatskoler kan også melde saken til statsforvalteren (privatskolelova § 2-4). Der opplæringslova § 12-6 tredje og fjerde ledd sier kommunen og fylkeskommunen, gjelder det skolen. Heller ikke privatskoler kan klage på statsforvalterens vedtak."
      nn: "Elevar ved privatskular kan også melde saka til statsforvaltaren (privatskolelova § 2-4). Der opplæringslova § 12-6 tredje og fjerde ledd seier kommunen og fylkeskommunen, gjeld det skulen. Heller ikkje privatskular kan klage på vedtaket til statsforvaltaren."
    kilder:
      - { id: privatskolelova, punkt: "§ 2-4 Krav til skoleanlegg og skolemiljø", url: "https://lovdata.no/lov/2003-07-04-84/§2-4" }
      - { id: udir-rundskriv-skolemiljo, punkt: "8. Klage til Utdanningsdirektoratet", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/8.-klage-til-utdanningsdirektoratet/" }
  kilder:
    - { id: udir-rundskriv-skolemiljo-statsforvalteren, punkt: "7.2.2 Saken må være tatt opp med rektor for en uke siden eller mer", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/7.-a-melde-saken-til-statsforvalteren-handhevingsordningen/#7.2.2-saken-ma-vare-tatt-opp-med-rektor-for-en-uke-siden-eller-mer" }
    - { id: udir-rundskriv-skolemiljo-statsforvalteren, punkt: "7. Å melde saken til statsforvalteren", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/7.-a-melde-saken-til-statsforvalteren-handhevingsordningen/" }
    - { id: udir-rundskriv-skolemiljo, punkt: "8. Klage til Utdanningsdirektoratet", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/8.-klage-til-utdanningsdirektoratet/" }
    - { id: opplaeringslova, punkt: "§ 12-6 Statsforvaltaren si handheving", url: "https://lovdata.no/lov/2023-06-09-30/§12-6" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «en uke, altså fem arbeidsdager» riktig gjengitt fra rundskrivet 7.2.2?"
    - "Bør steget si hvem som kan melde på vegne av eleven (foreldre med foreldreansvar, fullmektig, barnevernet)?"
    - "Privatskoler: Er det riktig lest av pl. § 2-4 at «skolen» erstatter fylkeskommunen i § 12-6 tredje og fjerde ledd, slik at pålegget går til skolen?"

- id: am-sf-skolen
  type: steg
  veiviser: aktivitetsplikten
  fase: saken
  tittel:
    nb: Når saken er meldt til statsforvalteren
    nn: Når saka er meldt til statsforvaltaren
  tekst:
    nb: Statsforvalteren vurderer om skolen har satt inn egnede tiltak og laget en tiltaksplan, slik saken står når vedtaket fattes. Fylkeskommunen skal gi statsforvalteren alle opplysningene som trengs, uten hinder av taushetsplikten. Har skolen ikke gjort nok, pålegger statsforvalteren som hovedregel fylkeskommunen å rette det innen en frist, og følger opp saken. Skolen fortsetter å arbeide med saken mens den er hos statsforvalteren.
    nn: Statsforvaltaren vurderer om skulen har sett inn eigna tiltak og laga ein tiltaksplan, slik saka står når vedtaket blir gjort. Fylkeskommunen skal gi statsforvaltaren alle opplysningane som trengst, utan hinder av teieplikta. Har skulen ikkje gjort nok, pålegg statsforvaltaren som hovudregel fylkeskommunen å rette det innan ein frist, og følgjer opp saka. Skulen held fram med å arbeide med saka medan ho er hos statsforvaltaren.
  ansvar:
    nb: Fylkeskommunen gir opplysningene og retter forholdet. Rektor har ansvaret på skolen.
    nn: Fylkeskommunen gir opplysningane og rettar forholdet. Rektor har ansvaret på skulen.
  dokumentasjon:
    nb: Det skolen har gjort i saken, med tiltaksplanen, og det skolen gjør for å følge vedtaket.
    nn: Det skulen har gjort i saka, med tiltaksplanen, og det skulen gjer for å følgje vedtaket.
  frist:
    nb: Fristen statsforvalteren setter i vedtaket.
    nn: Fristen statsforvaltaren set i vedtaket.
  forklaring:
    nb: Statsforvalteren kan ilegge tvangsmulkt hvis vedtaket ikke følges. Skolen og fylkeskommunen kan ikke klage på vedtaket. Eleven og foreldrene kan klage til Utdanningsdirektoratet.
    nn: Statsforvaltaren kan påleggje tvangsmulkt dersom vedtaket ikkje blir følgt. Skulen og fylkeskommunen kan ikkje klage på vedtaket. Eleven og foreldra kan klage til Utdanningsdirektoratet.
  paragrafer: [opplaeringslova/12-6, opplaeringslova/12-8]
  privatskole:
    tekst:
      nb: "For privatskoler gjelder dette etter privatskolelova § 2-4. Der opplæringslova § 12-6 tredje og fjerde ledd sier kommunen og fylkeskommunen, gjelder det skolen. Det er altså skolen som gir opplysningene og som pålegges å rette forholdet."
      nn: "For privatskular gjeld dette etter privatskolelova § 2-4. Der opplæringslova § 12-6 tredje og fjerde ledd seier kommunen og fylkeskommunen, gjeld det skulen. Det er altså skulen som gir opplysningane og som blir pålagd å rette forholdet."
    kilder:
      - { id: privatskolelova, punkt: "§ 2-4 Krav til skoleanlegg og skolemiljø", url: "https://lovdata.no/lov/2003-07-04-84/§2-4" }
  kilder:
    - { id: udir-rundskriv-skolemiljo-statsforvalteren, punkt: "7. Å melde saken til statsforvalteren", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/7.-a-melde-saken-til-statsforvalteren-handhevingsordningen/" }
    - { id: udir-rundskriv-skolemiljo, punkt: "8. Klage til Utdanningsdirektoratet", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/8.-klage-til-utdanningsdirektoratet/" }
    - { id: opplaeringslova, punkt: "§ 12-6 tredje og fjerde ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-6" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å skrive at skolen fortsetter å arbeide med saken mens den er hos statsforvalteren?"
    - "Er «uten hinder av taushetsplikten» en riktig gjengivelse av § 12-6 tredje ledd («utan hinder av lovfesta teieplikt»)?"

- id: am-elev
  type: steg
  veiviser: aktivitetsplikten
  fase: statsforvalteren
  tittel:
    nb: Når skolen ikke gjør nok
    nn: Når skulen ikkje gjer nok
  tekst:
    nb: Eleven har rett til et trygt og godt skolemiljø, og skolen skal ta det på alvor når eleven sier at hen ikke har det. Det er elevens egen opplevelse som avgjør om skolen skal sette inn tiltak. Mener eleven eller foreldrene at skolen ikke gjør nok, kan de melde saken til statsforvalteren. Først må saken være tatt opp med rektor.
    nn: Eleven har rett til eit trygt og godt skulemiljø, og skulen skal ta det på alvor når eleven seier at hen ikkje har det. Det er den eigne opplevinga til eleven som avgjer om skulen skal setje inn tiltak. Meiner eleven eller foreldra at skulen ikkje gjer nok, kan dei melde saka til statsforvaltaren. Først må saka vere teken opp med rektor.
  paragrafer: [opplaeringslova/12-2, opplaeringslova/12-6]
  sporsmal:
    tekst:
      nb: Er saken tatt opp med rektor for minst en uke siden?
      nn: Er saka teken opp med rektor for minst ei veke sidan?
    svar:
      - { id: ja, tekst: { nb: "Ja", nn: "Ja" }, neste: am-statsforvalteren }
      - { id: nei, tekst: { nb: "Nei, ikke ennå", nn: "Nei, ikkje enno" }, neste: am-ta-opp }
  kilder:
    - { id: udir-rundskriv-skolemiljo, punkt: "6.3.6 Plikt til å sette inn tiltak", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt/#6.3.6-plikt-til-a-sette-inn-tiltak" }
    - { id: udir-rundskriv-skolemiljo-statsforvalteren, punkt: "7.2.2 Saken må være tatt opp med rektor for en uke siden eller mer", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/7.-a-melde-saken-til-statsforvalteren-handhevingsordningen/#7.2.2-saken-ma-vare-tatt-opp-med-rektor-for-en-uke-siden-eller-mer" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å skrive at det er elevens egen opplevelse som avgjør om skolen skal sette inn tiltak (rundskrivet 6.3.6)?"

- id: am-ta-opp
  type: steg
  veiviser: aktivitetsplikten
  fase: statsforvalteren
  tittel:
    nb: Ta saken opp med rektor først
    nn: Ta saka opp med rektor først
  tekst:
    nb: Eleven eller foreldrene tar saken opp med rektor, eller den rektor har gitt oppgaven. Det kan gjøres muntlig eller skriftlig, og det trengs ikke dokumentasjon. Har det gått en uke uten at eleven har det trygt og godt, kan saken meldes til statsforvalteren. Statsforvalteren kan gjøre unntak fra uken når det er særlige grunner, for eksempel alvorlig vold, seksuelle krenkelser eller når det er rektor som krenker.
    nn: Eleven eller foreldra tek saka opp med rektor, eller den rektor har gitt oppgåva. Det kan gjerast munnleg eller skriftleg, og det trengst ikkje dokumentasjon. Har det gått ei veke utan at eleven har det trygt og godt, kan saka meldast til statsforvaltaren. Statsforvaltaren kan gjere unntak frå veka når det er særlege grunnar, til dømes alvorleg vald, seksuelle krenkingar eller når det er rektor som krenkjer.
  ansvar:
    nb: Eleven eller foreldrene tar saken opp. Rektor har ansvaret for at skolen følger den opp.
    nn: Eleven eller foreldra tek saka opp. Rektor har ansvaret for at skulen følgjer henne opp.
  frist:
    nb: Saken kan meldes til statsforvalteren når det har gått en uke, altså fem arbeidsdager.
    nn: Saka kan meldast til statsforvaltaren når det har gått ei veke, altså fem arbeidsdagar.
  fristKort: { nb: "Én uke", nn: "Ei veke" }
  paragrafer: [opplaeringslova/12-6]
  kilder:
    - { id: udir-rundskriv-skolemiljo-statsforvalteren, punkt: "7.2.2 Saken må være tatt opp med rektor for en uke siden eller mer", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/7.-a-melde-saken-til-statsforvalteren-handhevingsordningen/#7.2.2-saken-ma-vare-tatt-opp-med-rektor-for-en-uke-siden-eller-mer" }
    - { id: opplaeringslova, punkt: "§ 12-6 andre ledd", url: "https://lovdata.no/lov/2023-06-09-30/§12-6" }
  kontrollert: null
  kontrollsporsmal:
    - "Er eksemplene på særlige grunner (alvorlig vold, seksuelle krenkelser, rektor som krenker) riktig gjengitt fra rundskrivet 7.2.2?"
