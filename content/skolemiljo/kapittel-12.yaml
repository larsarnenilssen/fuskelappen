- id: k12-ansvar
  type: forklaring
  tittel:
    nb: Tvangsmulkt, straff og erstatning
    nn: Tvangsmulkt, straff og erstatning
  tekst:
    nb: >-
      Tre regler skal sikre at pliktene i kapittelet blir fulgt.


      - **Tvangsmulkt:** Statsforvalteren og klageinstansen kan fastsette tvangsmulkt for fylkeskommunen for å sikre at
      et vedtak etter § 12-6 blir gjennomført. Mulkten løper fra fristen i vedtaket er ute og til vedtaket er oppfylt,
      og går til statskassen.

      - **Straff:** Den som forsettlig eller grovt uaktsomt, eller flere ganger, bryter plikten til å følge med og gripe
      inn, plikten til å melde fra eller den skjerpede plikten, kan straffes med bot eller fengsel i opptil tre
      måneder. Det samme gjelder rektor som bryter plikten til å undersøke og sette inn tiltak. Også fylkeskommunen
      kan straffes. Straffansvaret foreldes etter fem år.

      - **Erstatning:** Krever en elev erstatning, og er det grunn til å tro at reglene om det psykososiale
      skolemiljøet ikke er fulgt, legges det til grunn at de ikke er fulgt. Det gjelder med mindre fylkeskommunen gjør
      noe annet sannsynlig (omvendt bevisbyrde).
    nn: >-
      Tre reglar skal sikre at pliktene i kapittelet blir følgde.


      - **Tvangsmulkt:** Statsforvaltaren og klageinstansen kan fastsetje tvangsmulkt for fylkeskommunen for å sikre at
      eit vedtak etter § 12-6 blir gjennomført. Mulkta går frå fristen i vedtaket er ute og til vedtaket er oppfylt,
      og går til statskassa.

      - **Straff:** Den som med vilje eller grovt aktlaust, eller fleire gonger, bryt plikta til å følgje med og gripe
      inn, plikta til å melde frå eller den skjerpa plikta, kan straffast med bot eller fengsel i opptil tre månader.
      Det same gjeld rektor som bryt plikta til å undersøkje og setje inn tiltak. Også fylkeskommunen kan straffast.
      Straffansvaret blir forelda etter fem år.

      - **Erstatning:** Krev ein elev erstatning, og er det grunn til å tru at reglane om det psykososiale
      skulemiljøet ikkje er følgde, blir det lagt til grunn at dei ikkje er følgde. Det gjeld om ikkje fylkeskommunen
      gjer noko anna truleg (omvend bevisbyrde).
  paragrafer: [opplaeringslova/12-8, opplaeringslova/12-9, opplaeringslova/12-10]
  privatskole:
    tekst:
      nb: "For privatskoler gjelder tvangsmulkt, straff og bevisbyrde skolen i stedet for fylkeskommunen (privatskolelova § 2-4)."
      nn: "For privatskular gjeld tvangsmulkt, straff og bevisbyrde skulen i staden for fylkeskommunen (privatskolelova § 2-4)."
    kilder:
      - { id: privatskolelova, punkt: "§ 2-4 Krav til skoleanlegg og skolemiljø", url: "https://lovdata.no/lov/2003-07-04-84/§2-4" }
  kilder:
    - { id: opplaeringslova, punkt: "§ 12-8 Tvangsmulkt", url: "https://lovdata.no/lov/2023-06-09-30/§12-8" }
    - { id: opplaeringslova, punkt: "§ 12-9 Straffansvar for brot på reglane om skolemiljø", url: "https://lovdata.no/lov/2023-06-09-30/§12-9" }
    - { id: opplaeringslova, punkt: "§ 12-10 Bevisbyrde i erstatningssaker om psykososialt skolemiljø", url: "https://lovdata.no/lov/2023-06-09-30/§12-10" }
  kontrollert: null
  kontrollsporsmal:
    - "Er oppsummeringen av hvilke plikter som er straffbare etter § 12-9 riktig, og er «plikten til å undersøke og sette inn tiltak» riktig for § 12-4 andre ledd tredje punktum?"
    - "Er «omvendt bevisbyrde» et dekkende navn på regelen i § 12-10?"
  stikkord: [tvangsmulkt, straff, straffansvar, erstatning, bevisbyrde, omvendt bevisbyrde]

- id: k12-informasjon
  type: forklaring
  tittel:
    nb: Informasjon til elevene og foreldrene
    nn: Informasjon til elevane og foreldra
  tekst:
    nb: >-
      Fylkeskommunen skal gi elevene og foreldrene informasjonen de trenger, blant annet om skolemiljøet og
      skolereglene, og om rettighetene og pliktene elevene har. Elevene og foreldrene skal kjenne til retten til et
      trygt og godt skolemiljø, aktivitetsplikten og muligheten til å melde saken til statsforvalteren.
    nn: >-
      Fylkeskommunen skal gi elevane og foreldra informasjonen dei treng, mellom anna om skulemiljøet og
      skulereglane, og om rettane og pliktene elevane har. Elevane og foreldra skal kjenne til retten til eit trygt og
      godt skulemiljø, aktivitetsplikta og høvet til å melde saka til statsforvaltaren.
  paragrafer: [opplaeringslova/10-8]
  kilder:
    - { id: opplaeringslova, punkt: "§ 10-8 Informasjon til elevane og foreldra", url: "https://lovdata.no/lov/2023-06-09-30/§10-8" }
    - { id: udir-rundskriv-skolemiljo-informasjon, punkt: "5. Skolene skal informere elever og foreldre" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig etter rundskrivet kapittel 5 at elevene og foreldrene skal få informasjon om aktivitetsplikten og håndhevingsordningen?"
  stikkord: [informasjon, foreldre, elevrettigheter]

- id: k12-fysiske-inngrep
  type: forklaring
  tittel:
    nb: Fysiske inngrep
    nn: Fysiske inngrep
  tekst:
    nb: >-
      Når andre tiltak ikke er nok, kan ansatte gripe inn fysisk mot en elev for å hindre at eleven krenker noen eller
      utsetter seg selv for fare, skader eiendom, oppfører seg sterkt nedverdigende for seg selv eller vesentlig
      forstyrrer opplæringen til andre. Inngrepet kan ikke gå lenger enn nødvendig. Den ansatte melder fra til rektor,
      og rektor til foreldrene. Ved gjentatte eller særlig alvorlige inngrep melder rektor fra til fylkeskommunen.
      Skolen skal dokumentere alle fysiske inngrep, med elevens syn på saken. Fylkeskommunen skal sørge for at skolen
      arbeider for at slike situasjoner ikke oppstår.
    nn: >-
      Når andre tiltak ikkje er nok, kan tilsette gripe inn fysisk mot ein elev for å hindre at eleven krenkjer nokon
      eller utset seg sjølv for fare, skader eigedom, oppfører seg sterkt fornedrande for seg sjølv eller vesentleg
      forstyrrar opplæringa til andre. Inngrepet kan ikkje gå lenger enn nødvendig. Den tilsette melder frå til
      rektor, og rektor til foreldra. Ved gjentekne eller særleg alvorlege inngrep melder rektor frå til
      fylkeskommunen. Skulen skal dokumentere alle fysiske inngrep, med synet til eleven på saka. Fylkeskommunen skal
      sørgje for at skulen arbeider for at slike situasjonar ikkje oppstår.
  paragrafer: [opplaeringslova/13-3, opplaeringslova/13-4, opplaeringslova/13-5]
  privatskole:
    tekst:
      nb: "For privatskoler står de samme reglene i privatskolelova §§ 3-10 a til 3-10 c."
      nn: "For privatskular står dei same reglane i privatskolelova §§ 3-10 a til 3-10 c."
    kilder:
      - { id: privatskolelova, punkt: "§ 3-10 b Fysiske inngrep for å avverje skade m.m.", url: "https://lovdata.no/lov/2003-07-04-84/§3-10b" }
  kilder:
    - { id: opplaeringslova, punkt: "§ 13-3 Førebygging", url: "https://lovdata.no/lov/2023-06-09-30/§13-3" }
    - { id: opplaeringslova, punkt: "§ 13-4 Fysiske inngrep for å avverje skade m.m.", url: "https://lovdata.no/lov/2023-06-09-30/§13-4" }
    - { id: opplaeringslova, punkt: "§ 13-5 Meldeplikt og dokumentasjon", url: "https://lovdata.no/lov/2023-06-09-30/§13-5" }
  kontrollert: null
  kontrollsporsmal:
    - "Er sammendraget av §§ 13-3 til 13-5 riktig, og hører kortet hjemme på siden om skolemiljøet?"
    - "Privatskoler: Er det riktig at privatskolelova §§ 3-10 a til 3-10 c har de samme reglene om forebygging, fysiske inngrep og melding?"
  stikkord: [fysiske inngrep, gripe inn fysisk, avverge skade, meldeplikt, dokumentasjon]
