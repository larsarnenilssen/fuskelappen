        nn: Når det kjem ein ny versjon, viser appen kva som er nytt. Dagens jukselapp er merkt når han står først.
      - nb: Nye begreper, og stien øverst på sidene har fått et nytt utseende.
        nn: Nye omgrep, og stien øvst på sidene har fått ein ny utsjånad.
