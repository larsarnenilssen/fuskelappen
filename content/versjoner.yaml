# Det som er nytt i hver versjon, til meldingen om ny versjon i appen (avgjørelse 088). Punktene skrives i
# versjons-PR-en ut fra CHANGELOG.md: 1–4 korte punkter på bokmål og nynorsk, med egne ord og det brukeren merker.
# En test krever punkter for versjonen i package.json, så de ikke kan glemmes. Nyeste versjon øverst.
versjoner:
  - versjon: 1.0.3
    dato: 2026-10-09
    nytt:
      - nb: "Arbeidsplan og Beskjeftigelse: Feltet for faget og navnet på funksjonen står øverst i kortet, der «Fag 1» og «Funksjon 1» sto før."
        nn: "Arbeidsplan og Sysselsetjing: Feltet for faget og namnet på funksjonen står øvst i kortet, der «Fag 1» og «Funksjon 1» stod før."
      - nb: Lukkede kort, stolpen over stillingen og utregningen viser kortnavnet på faget, for eksempel «Matematikk R1».
        nn: Lukka kort, stolpen over stillinga og utrekninga viser kortnamnet på faget, til dømes «Matematikk R1».
  - versjon: 1.0.2
    dato: 2026-10-09
    nytt:
      - nb: Søket over sidene lukkes med Esc eller et trykk utenfor søket, uten egen knapp.
        nn: Søket over sidene blir lukka med Esc eller eit trykk utanfor søket, utan eigen knapp.
      - nb: I Innstillinger tar den gule knappen øverst deg tilbake til siden du kom fra.
        nn: I Innstillingar tek den gule knappen øvst deg tilbake til sida du kom frå.
      - nb: Velkomst, Kildesjekken og Om appen står sammen nederst i Innstillinger.
        nn: Velkomst, Kjeldesjekken og Om appen står saman nedst i Innstillingar.
  - versjon: 1.0.1
    dato: 2026-10-09
    nytt:
      - nb: "Velkomst: en kort omvisning i appen, med valg av fylke og skole, rolle med forslag til favoritter og dagens jukselapp."
        nn: "Velkomst: ei kort omvising i appen, med val av fylke og skule, rolle med forslag til favorittar og dagens jukselapp."
      - nb: Du finner velkomsten nederst på forsiden («Ny her? Se velkomsten») og i Innstillinger.
        nn: Du finn velkomsten nedst på framsida («Ny her? Sjå velkomsten») og i Innstillingar.
      - nb: Overskriftene over veiviserne og kalkulatorene står i entall når det er ett verktøy, og i flertall når det er flere.
        nn: Overskriftene over vegvisarane og kalkulatorane står i eintal når det er eitt verktøy, og i fleirtal når det er fleire.
  - versjon: 0.46.0
    dato: 2026-10-08
    nytt:
      - nb: "Lokale regler: Under Innstillinger kan du legge inn regler og tall som gjelder ved skolen eller i fylket ditt, for eksempel planfestet tid."
        nn: "Lokale reglar: Under Innstillingar kan du leggje inn reglar og tal som gjeld ved skulen eller i fylket ditt, til dømes planfesta tid."
      - nb: Regelen gjelder med en gang for deg og er merket «Din egen». Kalkulatorene bruker tallet ditt.
        nn: Regelen gjeld med ein gong for deg og er merkt «Din eigen». Kalkulatorane bruker talet ditt.
      - nb: Meld inn regelen på e-post. Når den er godkjent, ser alle som har valgt skolen eller fylket den.
        nn: Meld inn regelen på e-post. Når han er godkjend, ser alle som har valt skulen eller fylket han.
  - versjon: 0.45.0
    dato: 2026-10-08
    nytt:
      - nb: "Hele appen har fått samme rolige design som forsiden, kalenderen og Videregående i tall: hvite kort, overskrifter på en lys flate og gule valg."
        nn: "Heile appen har fått same rolege design som framsida, kalenderen og Vidaregåande i tal: kvite kort, overskrifter på ei lys flate og gule val."
      - nb: På oversiktene i modulene står veiviserne, kalkulatorene og fristene til høyre, og kalkulatorene viser hva du fyller inn og hva som regnes ut.
        nn: På oversiktene i modulane står vegvisarane, kalkulatorane og fristane til høgre, og kalkulatorane viser kva du fyller inn og kva som blir rekna ut.
      - nb: I veiviserne står svarene du har gitt, med gul bakgrunn.
        nn: I vegvisarane står svara du har gitt, med gul bakgrunn.
      - nb: Tallet står først i flisene i Videregående i tall, og streken for landet i figurene står rett.
        nn: Talet står først i flisene i Vidaregåande i tal, og streken for landet i figurane står rett.
  - versjon: 0.44.0
    dato: 2026-10-08
    nytt:
      - nb: "Videregående i tall har fått tall fra SSB og tre temasider: Ungdom og søkere, Skolen og Læreplass og fullføring."
        nn: "Vidaregåande i tal har fått tal frå SSB og tre temasider: Ungdom og søkjarar, Skulen og Læreplass og fullføring."
      - nb: Tallene står også der de er nyttige, for eksempel ungdomskullene på Inntak og lærerne på Arbeidsplan.
        nn: Tala står òg der dei er nyttige, til dømes ungdomskulla på Inntak og lærarane på Arbeidsplan.
      - nb: Når det kommer en ny versjon, viser appen hva som er nytt. Dagens jukselapp er merket når den står først.
        nn: Når det kjem ein ny versjon, viser appen kva som er nytt. Dagens jukselapp er merkt når han står først.
      - nb: Nye begreper, og stien øverst på sidene har fått et nytt utseende.
        nn: Nye omgrep, og stien øvst på sidene har fått ein ny utsjånad.
  - versjon: 0.43.0
    dato: 2026-10-08
    nytt:
      - nb: "Dagens jukselapp: ett faktum fra appen hver dag, øverst på forsiden. Slå den på under «Tilpass»."
        nn: "Dagens jukselapp: eitt faktum frå appen kvar dag, øvst på framsida. Slå han på under «Tilpass»."
      - nb: Elevundersøkelsen har fått sin egen plass under Skolemiljø.
        nn: Elevundersøkinga har fått sin eigen plass under Skulemiljø.
      - nb: "«Skolemiljø» heter nå «Aktivitetsplikt og skoleregler»."
        nn: "«Skulemiljø» heiter no «Aktivitetsplikt og skulereglar»."
