# Det som er nytt i hver versjon, til meldingen om ny versjon i appen (avgjørelse 088). Punktene skrives i
# versjons-PR-en ut fra CHANGELOG.md: 1–4 korte punkter på bokmål og nynorsk, med egne ord og det brukeren merker.
# En test krever punkter for versjonen i package.json, så de ikke kan glemmes. Nyeste versjon øverst.
versjoner:
  - versjon: 0.45.0
    dato: 2026-10-08
    nytt:
      - nb: "Hele appen har fått samme rolige design som forsiden, kalenderen og Videregående i tall: hvite kort, overskrifter på en lys flate og gule valg."
        nn: "Heile appen har fått same rolege design som framsida, kalenderen og Vidaregåande i tal: kvite kort, overskrifter på ei lys flate og gule val."
      - nb: På oversiktene i modulene står veiviserne, kalkulatorene og fristene til høyre, og kalkulatorene viser hva du fyller inn og hva som regnes ut.
        nn: På oversiktene i modulane står vegvisarane, kalkulatorane og fristane til høgre, og kalkulatorane viser kva du fyller inn og kva som blir rekna ut.
      - nb: I veiviserne står svarene du har gitt, med gul bakgrunn.
        nn: I vegvisarane står svara du har gitt, med gul bakgrunn.
      - nb: Tallet står først i flisene i Videregående i tall, og streken for landet i figurene står rett.
        nn: Talet står først i flisene i Vidaregåande i tal, og streken for landet i figurane står rett.
  - versjon: 0.44.0
    dato: 2026-10-08
    nytt:
      - nb: "Videregående i tall har fått tall fra SSB og tre temasider: Ungdom og søkere, Skolen og Læreplass og fullføring."
        nn: "Vidaregåande i tal har fått tal frå SSB og tre temasider: Ungdom og søkjarar, Skulen og Læreplass og fullføring."
      - nb: Tallene står også der de er nyttige, for eksempel ungdomskullene på Inntak og lærerne på Arbeidsplan.
        nn: Tala står òg der dei er nyttige, til dømes ungdomskulla på Inntak og lærarane på Arbeidsplan.
      - nb: Når det kommer en ny versjon, viser appen hva som er nytt. Dagens jukselapp er merket når den står først.
        nn: Når det kjem ein ny versjon, viser appen kva som er nytt. Dagens jukselapp er merkt når han står først.
      - nb: Nye begreper, og stien øverst på sidene har fått et nytt utseende.
        nn: Nye omgrep, og stien øvst på sidene har fått ein ny utsjånad.
  - versjon: 0.43.0
    dato: 2026-10-08
    nytt:
      - nb: "Dagens jukselapp: ett faktum fra appen hver dag, øverst på forsiden. Slå den på under «Tilpass»."
        nn: "Dagens jukselapp: eitt faktum frå appen kvar dag, øvst på framsida. Slå han på under «Tilpass»."
      - nb: Elevundersøkelsen har fått sin egen plass under Skolemiljø.
        nn: Elevundersøkinga har fått sin eigen plass under Skulemiljø.
      - nb: "«Skolemiljø» heter nå «Aktivitetsplikt og skoleregler»."
        nn: "«Skulemiljø» heiter no «Aktivitetsplikt og skulereglar»."
