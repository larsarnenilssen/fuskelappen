  kontrollsporsmal:
    - "Er det riktig at den årlige evalueringen bare kreves for individuelt tilrettelagt opplæring, og ikke for personlig assistanse og fysisk tilrettelegging?"
    - "Fører «fortsatt behov» riktig tilbake til en ny vurdering av hva eleven trenger, med ny sakkyndig vurdering når den gamle går ut?"

- id: ti-avsluttet
  type: steg
  veiviser: tilpasset-og-individuell
  fase: oppfolging
  tittel:
    nb: Eleven trenger ikke lenger tilrettelegging
    nn: Eleven treng ikkje lenger tilrettelegging
  tekst:
    nb: Det trengs ikke noe nytt vedtak for å avslutte tilretteleggingen. Eleven får tilpasset opplæring innenfor den ordinære opplæringen, som alle andre. Lærerne følger med på utviklingen som før, og melder fra til rektor hvis det blir tvil om utbyttet.
    nn: Det trengst ikkje noko nytt vedtak for å avslutte tilrettelegginga. Eleven får tilpassa opplæring innanfor den ordinære opplæringa, som alle andre. Lærarane følgjer med på utviklinga som før, og melder frå til rektor dersom det blir tvil om utbyttet.
  paragrafer: [opplaeringslova/11-1, opplaeringslova/11-2]
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "9.2 Vurdere om eleven fortsatt har behov for individuelt tilrettelagt opplæring", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/arlig-evaluering-av-utbyttet/#vurdere-eleven-fortsatt-behov-individuelt-tilrettelagt-opplaring" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «Det trengs ikke noe nytt vedtak for å avslutte tilretteleggingen» formulert slik at det ikke kan misforstås, for eksempel når vedtaket fortsatt gjelder en periode?"

- id: ti-avslag
  type: steg
  veiviser: tilpasset-og-individuell
  fase: vedtak
  tittel:
    nb: Avslag
    nn: Avslag
  tekst:
    nb: Eleven får ikke individuell tilrettelegging. Skolen fortsetter med tilpasset opplæring og tiltak i den ordinære opplæringen. Avslaget skal være grunngitt, så eleven og foreldrene kan forstå det og vurdere om de vil klage.
    nn: Eleven får ikkje individuell tilrettelegging. Skolen held fram med tilpassa opplæring og tiltak i den ordinære opplæringa. Avslaget skal vere grunngitt, så eleven og foreldra kan forstå det og vurdere om dei vil klage.
  frist:
    nb: Klagefristen er tre uker fra eleven eller foreldrene fikk vedtaket.
    nn: Klagefristen er tre veker frå eleven eller foreldra fekk vedtaket.
  fristKort: { nb: "Klage: 3 uker", nn: "Klage: 3 veker" }
  paragrafer: [opplaeringslova/11-1, forvaltningsloven/24, forvaltningsloven/29]
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "7.3 Krav til innholdet i vedtaket", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/vedtak-om-individuell-tilrettelegging/#krav-innholdet-vedtaket" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "7.9 Klage på vedtaket", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/vedtak-om-individuell-tilrettelegging/#klage-vedtaket" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at klagefristen regnes fra eleven eller foreldrene fikk vedtaket (fvl. § 29: underretningen er kommet fram)?"

- id: ti-klage
  type: steg
  veiviser: tilpasset-og-individuell
  fase: oppfolging
  tittel:
    nb: Klage på vedtaket eller gjennomføringen
    nn: Klage på vedtaket eller gjennomføringa
  tekst:
    nb: Eleven og foreldrene kan klage på et vedtak om individuell tilrettelegging, både avslag og innhold. De kan også klage når eleven ikke får det vedtaket sier, og den retten gjelder hele tiden. Klagen sendes til den som fattet vedtaket. Får de ikke medhold, sendes saken så raskt som mulig til statsforvalteren.
    nn: Eleven og foreldra kan klage på eit vedtak om individuell tilrettelegging, både avslag og innhald. Dei kan også klage når eleven ikkje får det vedtaket seier, og den retten gjeld heile tida. Klaga blir send til den som gjorde vedtaket. Får dei ikkje medhald, blir saka send så raskt som mogleg til statsforvaltaren.
  ansvar:
    nb: Den som fattet vedtaket, vurderer klagen først. Statsforvalteren er klageinstans.
    nn: Den som gjorde vedtaket, vurderer klaga først. Statsforvaltaren er klageinstans.
  frist:
    nb: Tre uker fra vedtaket ble kjent. Klage på gjennomføringen har ingen frist.
    nn: Tre veker frå vedtaket vart kjent. Klage på gjennomføringa har ingen frist.
  fristKort: { nb: "Klage: 3 uker", nn: "Klage: 3 veker" }
  paragrafer: [opplaeringslova/29-1, forvaltningsloven/28, forvaltningsloven/29]
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "7.9 Klage på vedtaket", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/vedtak-om-individuell-tilrettelegging/#klage-vedtaket" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "8.4 Avvik mellom opplæringen eleven har fått og vedtaket", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/individuell-opplaringsplan-iop/#avvik-mellom-opplaringen-vedtaket" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «Klage på gjennomføringen har ingen frist» en riktig og ikke misvisende forenkling av veilederens «løpende rett til å klage»?"
