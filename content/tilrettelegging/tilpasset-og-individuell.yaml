    - "Veilederen nevner også opplæring i mobilitet for blinde og sterkt svaksynte. Bør den nevnes her, eller er det nok i forklaringen av fysisk tilrettelegging?"

- id: ti-assistanse
  type: steg
  veiviser: tilpasset-og-individuell
  fase: utredning
  tittel:
    nb: Opplyse saken om assistanse eller fysisk tilrettelegging
    nn: Opplyse saka om assistanse eller fysisk tilrettelegging
  tekst:
    nb: Personlig assistanse og fysisk tilrettelegging krever ikke sakkyndig vurdering. Fylkeskommunen må likevel sørge for at saken er godt nok opplyst, og eleven og foreldrene skal få si hva de mener før vedtaket. Kan eleven også trenge individuelt tilrettelagt opplæring, skal PP-tjenesten vurdere alt samlet.
    nn: Personleg assistanse og fysisk tilrettelegging krev ikkje sakkunnig vurdering. Fylkeskommunen må likevel sørgje for at saka er godt nok opplyst, og eleven og foreldra skal få seie kva dei meiner før vedtaket. Kan eleven også trenge individuelt tilrettelagd opplæring, skal PP-tenesta vurdere alt samla.
  ansvar:
    nb: Fylkeskommunen. Skolen bidrar med opplysninger.
    nn: Fylkeskommunen. Skolen bidreg med opplysningar.
  dokumentasjon:
    nb: Opplysningene saken bygger på, og hva eleven og foreldrene mener.
    nn: Opplysningane saka byggjer på, og kva eleven og foreldra meiner.
  forklaring:
    nb: Personlig assistanse er hjelp fra en voksen som følger eleven, men som ikke har ansvar for opplæringen. Helsehjelp, for eksempel legemidler eller sondemating, er ikke personlig assistanse etter opplæringslova. Noen ganger kan det være uklart om fylkeskommunen eller NAV har ansvaret for et hjelpemiddel. Pedagogiske hjelpemidler er fylkeskommunens ansvar.
    nn: Personleg assistanse er hjelp frå ein vaksen som følgjer eleven, men som ikkje har ansvar for opplæringa. Helsehjelp, til dømes legemiddel eller sondemating, er ikkje personleg assistanse etter opplæringslova. Nokre gonger kan det vere uklart om fylkeskommunen eller NAV har ansvaret for eit hjelpemiddel. Pedagogiske hjelpemiddel er ansvaret til fylkeskommunen.
  paragrafer: [opplaeringslova/11-4, opplaeringslova/11-5, forvaltningsloven/16, forvaltningsloven/17]
  neste: ti-vedtak
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "5.2 Personlig assistanse", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/individuell-tilrettelegging/#personlig-assistanse" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "5.5 Ansvaret for hjelpemidler", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/individuell-tilrettelegging/#ansvaret-for-hjelpemidler" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "6.1 Kommunen og fylkeskommunen må opplyse saken før de fatter vedtak", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/opplyse-saken-vedtak-individuell-tilrettelegging/#kommunen-og-fylkeskommunen-ma-opplyse-saken-for-de-fatter-vedtak" }
  kontrollert: null
  kontrollsporsmal:
    - "Er skillet mellom personlig assistanse og helsehjelp riktig og forsiktig nok formulert?"
    - "Er det riktig å skrive at pedagogiske hjelpemidler er fylkeskommunens ansvar, og at ansvaret ellers kan være uklart mellom fylkeskommunen og NAV?"

- id: ti-samtykke
  type: steg
  veiviser: tilpasset-og-individuell
  fase: utredning
  tittel:
    nb: Samtykke og henvisning til PP-tjenesten
    nn: Samtykke og tilvising til PP-tenesta
  tekst:
    nb: Før PP-tjenesten kan lage en [sakkyndig vurdering](#/begreper/sakkyndig-vurdering), må eleven eller foreldrene samtykke. En elev som har fylt 15 år, samtykker selv. Når samtykket er gitt, henviser skolen eleven til PP-tjenesten.
    nn: Før PP-tenesta kan lage ei [sakkunnig vurdering](#/begreper/sakkyndig-vurdering), må eleven eller foreldra samtykke. Ein elev som har fylt 15 år, samtykkjer sjølv. Når samtykket er gitt, viser skolen eleven vidare til PP-tenesta.
  ansvar:
    nb: Skolen innhenter samtykke og henviser. Eleven samtykker fra 15 år, ellers foreldrene.
    nn: Skolen hentar inn samtykke og viser vidare. Eleven samtykkjer frå 15 år, elles foreldra.
  dokumentasjon:
    nb: Samtykket og henvisningen.
    nn: Samtykket og tilvisinga.
  paragrafer: [opplaeringslova/11-7, opplaeringslova/24-5]
  neste: ti-sakkyndig
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "5.4 Individuelt tilrettelagt opplæring", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/individuell-tilrettelegging/#individuelt-tilrettelagt-opplaring" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "6.2 Krav om sakkyndig vurdering i saker om individuelt tilrettelagt opplæring", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/opplyse-saken-vedtak-individuell-tilrettelegging/#krav-om-sakkyndig-vurdering-individuelt-tilrettelagt-opplaring" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at det er skolen som innhenter samtykke og henviser til PP-tjenesten i videregående, eller gjør fylkeskommunen det på annen måte?"

- id: ti-sakkyndig
  type: steg
  veiviser: tilpasset-og-individuell
  fase: utredning
  tittel:
    nb: Sakkyndig vurdering fra PP-tjenesten
    nn: Sakkunnig vurdering frå PP-tenesta
  tekst:
    nb: |-
      PP-tjenesten vurderer om eleven trenger individuelt tilrettelagt opplæring, og ser alle behovene for tilrettelegging samlet. Vurderingen skal alltid si noe om

      1. elevens utbytte av opplæringen
      2. hvorfor eleven ikke har, eller ikke kan få, tilfredsstillende utbytte
      3. realistiske opplæringsmål
      4. tiltak som kan gi tilfredsstillende utbytte
      5. hvilken kompetanse de som gir opplæringen, bør ha
    nn: |-
      PP-tenesta vurderer om eleven treng individuelt tilrettelagd opplæring, og ser alle behova for tilrettelegging samla. Vurderinga skal alltid seie noko om

      1. utbyttet eleven har av opplæringa
      2. kvifor eleven ikkje har, eller ikkje kan få, tilfredsstillande utbytte
      3. realistiske opplæringsmål
      4. tiltak som kan gi tilfredsstillande utbytte
      5. kva kompetanse dei som gir opplæringa, bør ha
  ansvar:
    nb: PP-tjenesten, som er faglig uavhengig. Fylkeskommunen sørger for at vurderingen gir grunnlag for vedtak.
    nn: PP-tenesta, som er fagleg uavhengig. Fylkeskommunen sørgjer for at vurderinga gir grunnlag for vedtak.
  dokumentasjon:
    nb: Skriftlig sakkyndig vurdering, med hvor lenge den gjelder.
    nn: Skriftleg sakkunnig vurdering, med kor lenge ho gjeld.
  frist:
    nb: Uten ugrunnet opphold. Mangel på kapasitet er ikke en gyldig grunn til lang ventetid.
    nn: Utan ugrunna opphald. Mangel på kapasitet er ikkje ein gyldig grunn til lang ventetid.
  fristKort: { nb: "Uten opphold", nn: "Utan opphald" }
  forklaring:
    nb: Vurderingen er ikke bindende, men fylkeskommunen kan bare fravike den hvis eleven kan få tilfredsstillende utbytte på en annen måte, og det må grunngis i vedtaket. Foreldrene kan hente inn en alternativ sakkyndig vurdering, og den må fylkeskommunen ta med i vurderingen.
    nn: Vurderinga er ikkje bindande, men fylkeskommunen kan berre fråvike ho dersom eleven kan få tilfredsstillande utbytte på ein annan måte, og det må grunngivast i vedtaket. Foreldra kan hente inn ei alternativ sakkunnig vurdering, og den må fylkeskommunen ta med i vurderinga.
  paragrafer: [opplaeringslova/11-7, opplaeringslova/11-8, opplaeringslova/11-13, forvaltningsloven/11a]
  neste: ti-vedtak
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "6.2.1 Krav til innholdet i den sakkyndige vurderingen", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/opplyse-saken-vedtak-individuell-tilrettelegging/#krav-innhold-sakkyndig-vurdering" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "6.2.3 Varigheten av den sakkyndige vurderingen", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/opplyse-saken-vedtak-individuell-tilrettelegging/#varighet-sakkyndig-vurdering" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "6.2.4 Saksbehandlingstid", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/opplyse-saken-vedtak-individuell-tilrettelegging/#saksbehandlingstid" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "6.3 Foreldrene kan hente inn en alternativ sakkyndig vurdering", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/opplyse-saken-vedtak-individuell-tilrettelegging/#foreldrene-hente-alternativ-sakkyndig-vurdering" }
  kontrollert: null
  kontrollsporsmal:
    - "Er «den må fylkeskommunen ta med i vurderingen» en riktig gjengivelse av hva en alternativ sakkyndig vurdering betyr (veilederen 6.3)?"
    - "Er de fem punktene i § 11-8 gjengitt riktig med egne ord?"

- id: ti-vedtak
  type: steg
  veiviser: tilpasset-og-individuell
  fase: vedtak
  tittel:
    nb: Vedtak om individuell tilrettelegging
    nn: Vedtak om individuell tilrettelegging
  tekst:
    nb: Fylkeskommunen fatter et [enkeltvedtak](#/begreper/enkeltvedtak), også når svaret er nei. Vedtaket skal si hva eleven får, i hvilket omfang og hvor lenge, og det skal være grunngitt. Avviker vedtaket fra den sakkyndige vurderingen, må det grunngis særskilt. Før vedtak om individuelt tilrettelagt opplæring må eleven eller foreldrene samtykke, og det skal legges stor vekt på hva de mener.
    nn: Fylkeskommunen gjer eit [enkeltvedtak](#/begreper/enkeltvedtak), også når svaret er nei. Vedtaket skal seie kva eleven får, i kva omfang og kor lenge, og det skal vere grunngitt. Avvik vedtaket frå den sakkunnige vurderinga, må det grunngivast særskilt. Før vedtak om individuelt tilrettelagd opplæring må eleven eller foreldra samtykke, og det skal leggjast stor vekt på kva dei meiner.
  ansvar:
    nb: Fylkeskommunen. Oppgaven kan delegeres til rektor, men ansvaret ligger hos fylkeskommunen.
    nn: Fylkeskommunen. Oppgåva kan delegerast til rektor, men ansvaret ligg hos fylkeskommunen.
  dokumentasjon:
    nb: Skriftlig vedtak med grunngiving, omfang, varighet og opplysning om klagerett.
    nn: Skriftleg vedtak med grunngiving, omfang, varigheit og opplysning om klagerett.
  frist:
    nb: Uten ugrunnet opphold. Er det ikke fattet vedtak innen en måned etter at den sakkyndige vurderingen er mottatt, skal eleven eller foreldrene få et foreløpig svar. Uten sakkyndig vurdering regnes måneden fra henvendelsen.
    nn: Utan ugrunna opphald. Er det ikkje gjort vedtak innan ein månad etter at den sakkunnige vurderinga er motteken, skal eleven eller foreldra få eit førebels svar. Utan sakkunnig vurdering blir månaden rekna frå førespurnaden.
  fristKort: { nb: "Foreløpig svar: 1 måned", nn: "Førebels svar: 1 månad" }
  forklaring:
    nb: Vedtaket kan gjelde for mer enn ett år hvis behovet er stabilt. Varigheten må stå tydelig i vedtaket. Ber eleven eller foreldrene om fritak fra vurdering med karakter, gjelder det i videregående bare sidemålet.
    nn: Vedtaket kan gjelde for meir enn eitt år dersom behovet er stabilt. Varigheita må stå tydeleg i vedtaket. Ber eleven eller foreldra om fritak frå vurdering med karakter, gjeld det i vidaregåande berre sidemålet.
  paragrafer: [opplaeringslova/11-6, opplaeringslova/11-7, forvaltningsloven/11a, forvaltningsloven/24]
  sporsmal:
    tekst:
      nb: Hva ble vedtaket?
      nn: Kva vart vedtaket?
    svar:
      - { id: ito, tekst: { nb: "Individuelt tilrettelagt opplæring", nn: "Individuelt tilrettelagd opplæring" }, neste: ti-iop }
      - { id: praktisk, tekst: { nb: "Bare personlig assistanse eller fysisk tilrettelegging", nn: "Berre personleg assistanse eller fysisk tilrettelegging" }, neste: ti-gjennomforing }
      - { id: avslag, tekst: { nb: "Avslag", nn: "Avslag" }, neste: ti-avslag }
      - { id: uenig, tekst: { nb: "Eleven eller foreldrene er uenige i vedtaket", nn: "Eleven eller foreldra er usamde i vedtaket" }, neste: ti-klage }
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "7.1 Kommunen og fylkeskommunen skal fatte vedtak om individuell tilrettelegging", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/vedtak-om-individuell-tilrettelegging/#kommunen-og-fylkeskommunen-skal-fatte-vedtak-om-individuell-tilrettelegging" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "7.2 Delegere oppgaven med å fatte vedtak", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/vedtak-om-individuell-tilrettelegging/#delegere-oppgaven-fatte-vedtak" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "7.3 Krav til innholdet i vedtaket", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/vedtak-om-individuell-tilrettelegging/#krav-innholdet-vedtaket" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "7.4 Vedtakets varighet", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/vedtak-om-individuell-tilrettelegging/#vedtakets-varighet" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "12 Individuelt tilrettelagt opplæring og fritak fra vurdering med karakter", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/individuelt-tilrettelagt-opplaring-fritak-vurdering-karakter/" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig at måneden for foreløpig svar regnes fra henvendelsen når det ikke kreves sakkyndig vurdering (personlig assistanse og fysisk tilrettelegging)?"
    - "Er det riktig at fritak fra vurdering med karakter i videregående bare gjelder sidemålet for elever med individuelt tilrettelagt opplæring?"
    - "Er «Oppgaven kan delegeres til rektor, men ansvaret ligger hos fylkeskommunen» dekkende for hvordan det gjøres i fylkene?"

- id: ti-iop
  type: steg
  veiviser: tilpasset-og-individuell
  fase: oppfolging
  tittel:
    nb: Individuell opplæringsplan (IOP)
    nn: Individuell opplæringsplan (IOP)
  tekst:
    nb: Skolen lager en individuell opplæringsplan for elever som får individuelt tilrettelagt opplæring. Planen bygger på vedtaket og sier hva som er målene, innholdet og hvordan opplæringen skal gjennomføres. Den kan ikke gi eleven andre rettigheter enn vedtaket. Planen skal være nyttig i hverdagen, ikke et stort dokument.
    nn: Skolen lagar ein individuell opplæringsplan for elevar som får individuelt tilrettelagd opplæring. Planen byggjer på vedtaket og seier kva som er måla, innhaldet og korleis opplæringa skal gjennomførast. Han kan ikkje gi eleven andre rettar enn vedtaket. Planen skal vere nyttig i kvardagen, ikkje eit stort dokument.
  ansvar:
    nb: Skolen, i samarbeid med eleven og foreldrene. Kontaktlæreren og faglærerne bruker planen.
    nn: Skolen, i samarbeid med eleven og foreldra. Kontaktlæraren og faglærarane brukar planen.
  dokumentasjon:
    nb: IOP med mål, innhold og gjennomføring.
    nn: IOP med mål, innhald og gjennomføring.
  frist:
    nb: Så raskt som mulig etter vedtaket. Planen kan ikke tas i bruk før vedtaket er fattet.
    nn: Så raskt som mogleg etter vedtaket. Planen kan ikkje takast i bruk før vedtaket er gjort.
  fristKort: { nb: "Så raskt som mulig", nn: "Så raskt som mogleg" }
  paragrafer: [opplaeringslova/11-10]
  neste: ti-gjennomforing
  kilder:
    - { id: udir-veileder-tilpasset-opplaering, punkt: "8.1 Skolen skal utarbeide en individuell opplæringsplan", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/individuell-opplaringsplan-iop/#skolen-skal-utarbeide-individuell-opplaringsplan" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "8.3 Innholdet i en individuell opplæringsplan", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/individuell-opplaringsplan-iop/#innholdet-individuell-opplaringsplan" }
  kontrollert: null
  kontrollsporsmal:
    - "Er det riktig å nevne kontaktlæreren og faglærerne under ansvar, eller bør ansvaret bare stå som «skolen»?"

- id: ti-gjennomforing
  type: steg
  veiviser: tilpasset-og-individuell
  fase: oppfolging
  tittel:
    nb: Gjennomføring og årlig evaluering
    nn: Gjennomføring og årleg evaluering
  tekst:
    nb: Skolen gir tilretteleggingen slik vedtaket sier. For individuelt tilrettelagt opplæring lager skolen én gang i året en skriftlig oversikt over opplæringen eleven har fått, og en vurdering av utviklingen sett opp mot målene i IOP-en. Eleven eller foreldrene skal få se den. Før vedtaket går ut, vurderer skolen om eleven fortsatt trenger tilrettelegging.
    nn: Skolen gir tilrettelegginga slik vedtaket seier. For individuelt tilrettelagd opplæring lagar skolen éin gong i året ei skriftleg oversikt over opplæringa eleven har fått, og ei vurdering av utviklinga sett opp mot måla i IOP-en. Eleven eller foreldra skal få sjå henne. Før vedtaket går ut, vurderer skolen om eleven framleis treng tilrettelegging.
  ansvar:
    nb: Skolen.
    nn: Skolen.
  dokumentasjon:
    nb: Årlig skriftlig oversikt og vurdering (individuelt tilrettelagt opplæring).
    nn: Årleg skriftleg oversikt og vurdering (individuelt tilrettelagd opplæring).
  frist:
    nb: Én gang i året. Nytt vedtak før det gamle går ut.
    nn: Éin gong i året. Nytt vedtak før det gamle går ut.
  fristKort: { nb: "Hvert år", nn: "Kvart år" }
  paragrafer: [opplaeringslova/11-11]
  sporsmal:
    tekst:
      nb: Hva viser evalueringen?
      nn: Kva viser evalueringa?
    svar:
      - { id: fortsatt, tekst: { nb: "Eleven trenger fortsatt tilrettelegging", nn: "Eleven treng framleis tilrettelegging" }, neste: ti-behov }
      - { id: ferdig, tekst: { nb: "Eleven trenger ikke lenger tilrettelegging", nn: "Eleven treng ikkje lenger tilrettelegging" }, neste: ti-avsluttet }
      - { id: avvik, tekst: { nb: "Eleven får ikke det vedtaket sier", nn: "Eleven får ikkje det vedtaket seier" }, neste: ti-klage }
  kilder:
