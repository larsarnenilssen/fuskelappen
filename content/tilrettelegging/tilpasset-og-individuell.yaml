    - { id: udir-veileder-tilpasset-opplaering, punkt: "9.1 Skolen skal evaluere utbyttet av den individuelt tilrettelagte opplæringen en gang i året", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/arlig-evaluering-av-utbyttet/#skolen-skal-evaluere-utbyttet-individuelt-tilrettelagte-opplaringen-en-gang-aret" }
    - { id: udir-veileder-tilpasset-opplaering, punkt: "9.2 Vurdere om eleven fortsatt har behov for individuelt tilrettelagt opplæring", url: "https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/veileder-for-tilpasset-opplaring-og-individuell-tilrettelegging/arlig-evaluering-av-utbyttet/#vurdere-eleven-fortsatt-behov-individuelt-tilrettelagt-opplaring" }
