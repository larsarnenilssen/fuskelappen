<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%TEMAFARGE_LYS%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%TEMAFARGE_MORK%" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%APP_KORTNAVN%" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./ikoner/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./ikoner/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./ikoner/apple-touch-icon.png" />
    <title>%APP_NAVN%</title>
    <script>
      // Setter tema og målform før første tegning, slik at skjermen ikke blinker.
      try {
        var lagret = JSON.parse(localStorage.getItem('jukselappen') || localStorage.getItem('fuskelappen') || localStorage.getItem('protokollen') || 'null');
        var inn = lagret && lagret.innstillinger;
        if (inn && (inn.tema === 'lys' || inn.tema === 'mork')) document.documentElement.dataset.tema = inn.tema;
        if (inn && inn.malform === 'nn') document.documentElement.lang = 'nn';
      } catch (e) {}
      // Henter tekstene for målformen med en gang, samtidig med resten av appen. Samme valg som i app/tilstand.ts.
      try {
        var spraak = navigator.languages || [navigator.language];
        var forste = '';
        for (var i = 0; i < spraak.length; i++) if (/^(nb|nn|no)\b/i.test(spraak[i])) { forste = spraak[i].toLowerCase(); break; }
        var malform = inn && (inn.malform === 'nb' || inn.malform === 'nn') ? inn.malform : forste.indexOf('nn') === 0 ? 'nn' : 'nb';
        var tekstbit = %TEKSTBITER%[malform];
        if (tekstbit) {
          var lenke = document.createElement('link');
          lenke.rel = 'modulepreload';
          lenke.crossOrigin = '';
          lenke.href = tekstbit;
          document.head.appendChild(lenke);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
