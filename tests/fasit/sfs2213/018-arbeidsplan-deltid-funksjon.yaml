id: sfs2213-018
beskrivelse: "Arbeidsplan, 60 % stilling: engelsk Vg1 262,5 årstimer (50 %) og funksjon 10 % som utvider planfestet tid."
godkjent: { av: eier, dato: 2026-09-30 }
kalkulator: arbeidsplan
input:
  stilling: 60
  grupper:
    - { arsrammer: [{ fag: Engelsk, program: Stud.spes, trinn: Vg1 }], elever: 30, arstimer: 262.5 }
  funksjoner: [{ prosent: 10 }]
forventet:
  beskjeftigelse: 60
  undervisningstimer: 262.5
  annen_planfestet: 267.5
  planleggingsdager: 45
  funksjonstid: 168.75
  selvdisponert: 268.75
  planfestet: 743.75
begrunnelse: >-
  Undervisningsdelen: planfestet 1150 × 50 % = 575 (undervisning 262,5 og annen planfestet tid 312,5), selvdisponert
  (1687,5 − 1150) × 50 % = 268,75. Funksjonen utvider: 1687,5 × 10 % = 168,75. Planfestet i alt 743,75.
  Eksempel D2, godkjent av eier 30.09.2026.
  Endret 30.09.2026 etter eiers avklaring: planleggingsdagene (6 × 7,5 = 45 timer, som i InSchool) står på egen linje, og timene per uke er planfestet tid utenom planleggingsdagene delt på 38 skoleuker. Annen planfestet tid 312,5 − 45 = 267,5.
